name: Diagnose Revo Android internals

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diagnose-frontend.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android source
        shell: bash
        run: |
          cat .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03 | base64 --decode > /tmp/revo-android-source.zip
          unzip -q /tmp/revo-android-source.zip
      - name: Print Android implementation
        shell: bash
        run: |
          for f in \
            revo-android/app/src/main/java/com/revolution/android/AndroidRevoBridge.java \
            revo-android/app/src/main/java/com/revolution/android/MacroEngine.java \
            revo-android/app/src/main/java/com/revolution/android/MacroEngineRegistry.java \
            revo-android/app/src/main/java/com/revolution/android/RevoAccessibilityService.java \
            revo-android/app/src/main/java/com/revolution/android/LocalAssetWebViewClient.java \
            revo-android/app/src/main/AndroidManifest.xml \
            revo-android/app/src/main/assets/www/index.android.html; do
            echo "===== $f ====="
            sed -n '1,420p' "$f"
          done
      - name: Download and extract exact frontend
        shell: bash
        run: |
          curl -fL --retry 4 --retry-delay 2 -o /tmp/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          mkdir -p /tmp/www
          python3 revo-android/extract_revo_frontend.py /tmp/RevolutionMacro.exe /tmp/www
      - name: Trace dataRuntime, gather fields, logs and start state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/www/assets/index-2FXaJy0P.js').read_text(errors='ignore')
          for term in ['dataRuntime','AddDefaultField(','DeleteField(','logs','Logs','macroLog','activityLog','Start(','startup:done','state.running','running','fieldConfigs','gather.fields']:
              print('\n===== '+term+' =====')
              pos=0; n=0
              while n<8:
                  i=s.find(term,pos)
                  if i<0: break
                  print(s[max(0,i-1300):min(len(s),i+2600)].replace('\n',' '))
                  print('\n---')
                  pos=i+len(term); n+=1
          PY
