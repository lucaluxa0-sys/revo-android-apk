name: Diagnose Revo Android internals

on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/diagnose-frontend.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Restore source and exact Revo release
        shell: bash
        run: |
          cat .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03 | base64 --decode > /tmp/src.zip
          unzip -q /tmp/src.zip
          curl -fL --retry 4 -o /tmp/RevolutionMacro.exe https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          mkdir -p /tmp/www
          python3 revo-android/extract_revo_frontend.py /tmp/RevolutionMacro.exe /tmp/www

      - name: Inspect Android Java implementation
        shell: bash
        run: |
          for f in revo-android/app/src/main/java/com/revolution/android/*.java; do
            echo "===== $f ====="
            sed -n '1,420p' "$f"
          done

      - name: Trace Gather field add, help overlays, planters and logs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/www/assets/index-2FXaJy0P.js').read_text(errors='ignore')
          terms=[
            'AddDefaultField','DeleteField','Automatic Planters','Auto Planters','planter schedule',
            'Tooltip(','.Tooltip(', 'tooltip:{text:', 'Question', 'Help', 'withArrow',
            'OpenLogsFolder','CopyLogsFile','Logs','logLines','macroLog','activityLog',
            'Start(', 'Pause(', 'Stop(', 'startup:done'
          ]
          for term in terms:
            print('\n===== '+term+' =====')
            p=0;c=0
            while c<12:
              i=s.find(term,p)
              if i<0: break
              print('OFFSET',i)
              print(s[max(0,i-2200):min(len(s),i+5000)].replace('\n',' '))
              print('\n---')
              p=i+len(term);c+=1
          PY

      - name: Recover exact Vite PNGs by Rollup hash and icon
        shell: bash
        run: |
          mkdir -p /tmp/hashprobe
          cd /tmp/hashprobe
          npm init -y >/dev/null 2>&1
          npm install rollup@4 --no-audit --no-fund >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          node <<'JS'
          const fs=require('fs');
          const {xxhashBase64Url}=require('/tmp/hashprobe/node_modules/rollup/dist/native.js');
          const exe=fs.readFileSync('/tmp/RevolutionMacro.exe');
          const js=fs.readFileSync('/tmp/www/assets/index-2FXaJy0P.js','utf8');
          const refs=[...new Set([...js.matchAll(/\/assets\/([A-Za-z0-9_-]+\.png)/g)].map(m=>m[1]))].sort();
          function carvePngs(buf){
            const sig=Buffer.from([137,80,78,71,13,10,26,10]); const out=[]; let pos=0;
            while((pos=buf.indexOf(sig,pos))>=0){
              let p=pos+8, ok=false;
              while(p+12<=buf.length){
                const len=buf.readUInt32BE(p); const typ=buf.toString('ascii',p+4,p+8); const end=p+12+len;
                if(end>buf.length) break;
                p=end;
                if(typ==='IEND'){ok=true;break;}
              }
              if(ok){out.push({start:pos,end:p,data:buf.subarray(pos,p)});pos=p}else pos+=8;
            }
            return out;
          }
          const pngs=carvePngs(exe);
          const byHash=new Map();
          for(const p of pngs){const h=xxhashBase64Url(p.data).slice(0,8);if(!byHash.has(h))byHash.set(h,[]);byHash.get(h).push(p);}
          let matched=0;
          for(const name of refs){const h=name.slice(-12,-4);const hits=byHash.get(h)||[];if(hits.length)matched++;}
          console.log(`SUMMARY refs=${refs.length} pngs=${pngs.length} matched=${matched}`);
          if(matched!==refs.length) process.exitCode=2;
          JS
          rm -rf /tmp/revo-pe && mkdir -p /tmp/revo-pe
          cd /tmp/revo-pe
          7z x -y /tmp/RevolutionMacro.exe '.rsrc/0/ICON/1' >/dev/null
          file ./.rsrc/0/ICON/1
