name: Trace exact v0.9c BuffDetector MoveSpeed

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diag-v09c-buff-movespeed.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download exact pinned Revolution binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache buff-speed-evidence
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe' | sha256sum -c -

      - name: Install parsers
        run: python3 -m pip install --disable-pip-version-check pefile capstone

      - name: Trace concrete BuffDetector speed calculation
        shell: python
        run: |
          from pathlib import Path
          import bisect, math, struct
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64, CS_GRP_CALL
          from capstone.x86 import X86_OP_IMM, X86_OP_MEM, X86_REG_RIP

          EXE = Path('.cache/RevolutionMacro.exe')
          MOVE_SPEED = 0x140c1c820
          TICK = 0x140c1f220
          MANAGER_BUFF = 0x140c287a0
          raw = EXE.read_bytes()
          pe = pefile.PE(str(EXE), fast_load=False)
          base = int(pe.OPTIONAL_HEADER.ImageBase)
          image_size = int(pe.OPTIONAL_HEADER.SizeOfImage)
          sections = [
              dict(raw=int(s.PointerToRawData), size=int(s.SizeOfRawData),
                   rva=int(s.VirtualAddress), data=s.get_data())
              for s in pe.sections
          ]

          def va2off(va):
              rva = va - base
              if 0 <= rva < int(pe.OPTIONAL_HEADER.SizeOfHeaders): return rva
              for s in sections:
                  if s['rva'] <= rva < s['rva'] + s['size']:
                      return s['raw'] + rva - s['rva']
              return None
          def q(o): return struct.unpack_from('<Q', raw, o)[0]
          def u32(o): return struct.unpack_from('<I', raw, o)[0]
          def i32(o): return struct.unpack_from('<i', raw, o)[0]
          def cstr(va, limit=800):
              o = va2off(va)
              if o is None: return None
              z = raw.find(b'\0', o, min(len(raw), o + limit))
              z = min(len(raw), o + limit) if z < 0 else z
              try: return raw[o:z].decode('utf-8')
              except Exception: return None

          # Recover the exact Go function table using the same structural anchor
          # proven by the earlier hotfix3 diagnostics.
          minpc = 0x1400014a0
          best = None; p = 0
          while True:
              h = raw.find(struct.pack('<Q', minpc), p)
              if h < 0: break
              md = h - 160
              if md >= 0:
                  ft=q(md+128); n=q(md+136); cap=q(md+144); text=q(md+176); fn=q(md+8); pcln=q(md+104)
                  score=sum([text==minpc,1000<n<500000,cap>=n,va2off(ft)is not None,va2off(fn)is not None,va2off(pcln)is not None])
                  if best is None or score > best[0]: best=(score,(ft,n,text,fn,pcln))
              p=h+1
          if not best or best[0] < 5: raise SystemExit('moduledata recovery failed')
          ft,n,text,fn,pcln=best[1]; fo=va2off(ft); po=va2off(pcln)
          funcs=[]
          for i in range(int(n)-1):
              ent=u32(fo+i*8); funcoff=u32(fo+i*8+4); fm=po+funcoff
              if not (0 <= fm+8 < len(raw)): continue
              name=cstr(fn+i32(fm+4)); addr=text+ent
              if name and base <= addr < base+image_size: funcs.append((addr,name))
          funcs.sort(); addrs=[a for a,_ in funcs]; names=dict(funcs)

          for addr,label,suffix in [
              (MOVE_SPEED,'MoveSpeed','.MoveSpeed'),
              (TICK,'Tick','.Tick'),
              (MANAGER_BUFF,'DetectorManager.Buff','.Buff'),
          ]:
              nm=names.get(addr,'')
              if not nm.endswith(suffix):
                  raise SystemExit(f'{label} address drift: {addr:#x} -> {nm!r}')

          def fend(a):
              i=bisect.bisect_left(addrs,a)
              return addrs[i+1] if i+1 < len(addrs) else a+0x10000
          def code(a):
              e=fend(a)
              for s in sections:
                  sv=base+s['rva']; ev=sv+len(s['data'])
                  if sv <= a < ev:
                      return s['data'][a-sv:min(len(s['data']),e-sv)]
              return b''

          mdx=Cs(CS_ARCH_X86,CS_MODE_64); mdx.detail=True
          def insns(a): return list(mdx.disasm(code(a),a))

          receiver = names[MOVE_SPEED].rsplit('.MoveSpeed',1)[0]
          package = receiver.split('.(*',1)[0] + '.'
          methods=[(a,nm) for a,nm in funcs if nm.startswith(receiver + '.')]

          out=[]
          out.append('PINNED_SHA256=0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb')
          out.append(f'MOVE_SPEED={MOVE_SPEED:#x} {names[MOVE_SPEED]} end={fend(MOVE_SPEED):#x}')
          out.append(f'TICK={TICK:#x} {names[TICK]} end={fend(TICK):#x}')
          out.append(f'MANAGER_BUFF={MANAGER_BUFF:#x} {names[MANAGER_BUFF]} end={fend(MANAGER_BUFF):#x}')
          out.append(f'RECEIVER={receiver}')
          out.append('')
          out.append('===== RECEIVER METHOD TABLE =====')
          for a,nm in methods:
              out.append(f'{a:#x}-{fend(a):#x} {nm}')

          def annotate(a, full=True):
              ii=insns(a)
              lines=[]
              for idx,ins in enumerate(ii):
                  ann=[]
                  if ins.group(CS_GRP_CALL):
                      for op in ins.operands:
                          if op.type==X86_OP_IMM:
                              t=int(op.imm)&((1<<64)-1)
                              ann.append('CALL=' + names.get(t,hex(t)))
                  for op in ins.operands:
                      if op.type==X86_OP_MEM:
                          if op.mem.disp == 0xa8:
                              ann.append('FIELD_OFF=0xa8')
                          if op.mem.base==X86_REG_RIP:
                              va=ins.address+ins.size+op.mem.disp
                              off=va2off(va)
                              if off is not None:
                                  vals=[]
                                  if off+8 <= len(raw):
                                      bits=struct.unpack_from('<Q',raw,off)[0]
                                      dv=struct.unpack_from('<d',raw,off)[0]
                                      vals.append(f'q={bits:#018x}')
                                      if math.isfinite(dv): vals.append(f'd={dv:.17g}')
                                  if off+4 <= len(raw):
                                      fv=struct.unpack_from('<f',raw,off)[0]
                                      if math.isfinite(fv): vals.append(f'f={fv:.9g}')
                                  ann.append(f'RIP={va:#x}[' + ','.join(vals) + ']')
                  fp = any(k in ins.mnemonic.lower() for k in ('sd','ss')) and any(k in ins.mnemonic.lower() for k in ('mov','add','sub','mul','div','cvt','min','max','xor'))
                  if fp: ann.append('FP')
                  lines.append(f'{ins.address:#x}: {ins.mnemonic:9s} {ins.op_str}' + ((' ; ' + ' | '.join(ann)) if ann else ''))
              return ii,lines

          out.append('')
          out.append('===== EXACT MoveSpeed =====')
          _,lines=annotate(MOVE_SPEED)
          out.extend(lines)
          if not any('FIELD_OFF=0xa8' in x for x in lines):
              raise SystemExit('MoveSpeed no longer reads expected cached speed field +0xa8')

          out.append('')
          out.append('===== DetectorManager.Buff =====')
          _,lines=annotate(MANAGER_BUFF)
          out.extend(lines)

          tick_ins,tick_lines=annotate(TICK)
          out.append('')
          out.append('===== EXACT Tick =====')
          out.extend(tick_lines)

          writes=[]
          for idx,ins in enumerate(tick_ins):
              if any(op.type==X86_OP_MEM and op.mem.disp==0xa8 for op in ins.operands):
                  writes.append(idx)
          if not writes:
              raise SystemExit('Tick no longer references cached speed field +0xa8')
          out.append('')
          out.append('===== Tick contexts touching +0xa8 =====')
          for idx in writes:
              out.append(f'--- around {tick_ins[idx].address:#x} ---')
              for j in range(max(0,idx-20),min(len(tick_lines),idx+21)):
                  out.append(tick_lines[j])

          # Follow direct same-package calls from Tick to two levels. This keeps
          # the evidence focused on the obfuscated detector implementation while
          # still capturing coefficient helpers used by Tick.
          frontier=[TICK]; seen={TICK}; depth=0; helpers=[]
          while frontier and depth < 2:
              nxt=[]
              for src in frontier:
                  for ins in insns(src):
                      if not ins.group(CS_GRP_CALL): continue
                      for op in ins.operands:
                          if op.type!=X86_OP_IMM: continue
                          t=int(op.imm)&((1<<64)-1); nm=names.get(t,'')
                          if nm.startswith(package) and t not in seen:
                              seen.add(t); nxt.append(t); helpers.append(t)
              frontier=nxt; depth+=1

          out.append('')
          out.append('===== Same-package Tick helper disassembly =====')
          for a in helpers:
              out.append(f'----- {a:#x} {names.get(a)} end={fend(a):#x} -----')
              _,hlines=annotate(a)
              out.extend(hlines)

          # Compact arithmetic-only view makes modifier constants reviewable.
          out.append('')
          out.append('===== SPEED ARITHMETIC SIGNALS =====')
          targets=[TICK]+helpers
          for a in targets:
              for ins in insns(a):
                  m=ins.mnemonic.lower()
                  if any(k in m for k in ('addsd','subsd','mulsd','divsd','addss','subss','mulss','divss','cvtsi2sd','cvttsd2si','ucomisd','comisd')):
                      _,one=annotate(a)
                      line=next((x for x in one if x.startswith(f'{ins.address:#x}:')),None)
                      if line: out.append(names.get(a,'') + ' :: ' + line)

          Path('buff-speed-evidence/summary.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out[:8000]))

      - name: Upload buff speed evidence
        uses: actions/upload-artifact@v4
        with:
          name: revolution-v09c-buff-movespeed
          path: buff-speed-evidence/
          if-no-files-found: error
