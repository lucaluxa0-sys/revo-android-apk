name: Import historical GPL Revolution source

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-historical-revo-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - name: Download pinned historical module from Go proxy
        shell: bash
        run: |
          set -euo pipefail
          MOD='github.com/nosyliam/revolution@v0.0.0-20250120031029-3f890744b55a'
          GOPROXY=https://proxy.golang.org go mod download -json "$MOD" > /tmp/module.json
          cat /tmp/module.json
          python3 - <<'PY'
          import json, os, shutil, stat
          from pathlib import Path
          j=json.load(open('/tmp/module.json'))
          src=Path(j['Dir'])
          out=Path('third_party/revolution-2025-gpl')
          if out.exists(): shutil.rmtree(out)
          shutil.copytree(src,out)
          for p in [out,*out.rglob('*')]:
              try: p.chmod(p.stat().st_mode | stat.S_IWUSR)
              except OSError: pass
          files=[p for p in out.rglob('*') if p.is_file()]
          print('files',len(files))
          print('top-level',sorted(p.name for p in out.iterdir())[:100])
          if not (out/'go.mod').is_file(): raise SystemExit('historical module go.mod missing')
          licenses=[p for p in out.iterdir() if p.is_file() and p.name.lower().startswith('license')]
          if not licenses: raise SystemExit('historical module license file missing')
          print('license',licenses[0])
          PY
      - name: Add provenance notice
        shell: bash
        run: |
          cat > third_party/revolution-2025-gpl/ANDROID_PORT_PROVENANCE.md <<'EOF'
          # Historical Revolution source used for Android porting reference

          This directory is the Go module snapshot:

          `github.com/nosyliam/revolution@v0.0.0-20250120031029-3f890744b55a`

          downloaded from the public Go module proxy. It was published January 20, 2025 and carries its upstream licensing files.

          It is **historical reference source**. It is not asserted to be the source of the current RevolutionMacro.exe release used by this Android project. Android-specific work must preserve this distinction and the upstream licensing notices.
          EOF
      - name: Commit imported source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add third_party/revolution-2025-gpl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import historical GPL Revolution source for Android porting'
          for try in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
