name: Migrate v0.2.9 gather engine source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/migrate-v029-engine-source.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct current Android source
        shell: bash
        run: |
          cat .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03 | base64 --decode > /tmp/source.zip
          unzip -q /tmp/source.zip -d /tmp/src
          test -f /tmp/src/revo-android/app/src/main/java/com/revolution/android/MacroEngine.java
      - name: Apply desktop-grounded gather adapter
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip

          root = Path('/tmp/src/revo-android/app/src/main/java/com/revolution/android')
          adapter_b64 = ''''''
          (root / 'RevoGatherAdapter.java').write_bytes(gzip.decompress(base64.b64decode(adapter_b64)))

          def replace_once(path, old, new, label):
              s = path.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {count}')
              path.write_text(s.replace(old, new, 1))

          engine = root / 'MacroEngine.java'
          replace_once(engine, '    private final AtomicLong frameCount = new AtomicLong(0);\n', '    private final AtomicLong frameCount = new AtomicLong(0);\n    private final RevoGatherAdapter gather;\n', 'engine field')
          replace_once(engine, '    public MacroEngine(int displayId) { this.displayId = displayId; }\n', '    public MacroEngine(int displayId) {\n        this.displayId = displayId;\n        this.gather = new RevoGatherAdapter(displayId);\n    }\n', 'engine constructor')
          replace_once(engine, '    public Bitmap latestFrame() { return latestFrame.get(); }\n', '    public Bitmap latestFrame() { return latestFrame.get(); }\n\n    public synchronized String configure(String json) {\n        gather.configure(json);\n        return stateJson();\n    }\n', 'engine configure')
          replace_once(engine, '        frameCount.set(0);\n        status = "Starting";\n', '        frameCount.set(0);\n        gather.onStart();\n        status = "Starting";\n', 'engine start')
          replace_once(engine, '        status = next ? "Paused" : "Running";\n', '        status = next ? "Paused" : "Running";\n        gather.onPause(next);\n', 'engine pause')
          replace_once(engine, '        status = "Stopped";\n        Thread t = worker;\n', '        status = "Stopped";\n        gather.onStop();\n        Thread t = worker;\n', 'engine stop')
          replace_once(engine, '    private void onFrame(Bitmap frame) {\n        // v0.2: frame acquisition is live. Revo detector/routine adapters plug in here.\n    }\n', '    private void onFrame(Bitmap frame) {\n        gather.onFrame(frame);\n    }\n', 'engine onFrame')
          replace_once(engine, '            Bitmap b = latestFrame.get();\n', '            gather.appendState(o);\n            Bitmap b = latestFrame.get();\n', 'engine state')

          bridge = root / 'AndroidRevoBridge.java'
          replace_once(bridge, '    @JavascriptInterface public String getEngineState() { return engine().stateJson(); }\n', '    @JavascriptInterface public String getEngineState() { return engine().stateJson(); }\n    @JavascriptInterface public String configureMacro(String json) { return engine().configure(json); }\n', 'bridge configure')

          a11y = root / 'RevoAccessibilityService.java'
          replace_once(a11y, 'import android.view.accessibility.AccessibilityEvent;\n', 'import android.view.accessibility.AccessibilityEvent;\nimport android.view.accessibility.AccessibilityNodeInfo;\n', 'a11y import')
          replace_once(a11y, '    private static volatile RevoAccessibilityService instance;\n', '    private static volatile RevoAccessibilityService instance;\n    private volatile String activePackageName = "";\n', 'a11y state')
          replace_once(a11y, '    @Override public void onAccessibilityEvent(AccessibilityEvent event) { }\n    @Override public void onInterrupt() { }\n', '''    @Override public void onAccessibilityEvent(AccessibilityEvent event) {\n        if (event != null && event.getPackageName() != null) activePackageName = String.valueOf(event.getPackageName());\n    }\n    @Override public void onInterrupt() { }\n\n    public String activePackageName() {\n        try {\n            AccessibilityNodeInfo root = getRootInActiveWindow();\n            if (root != null && root.getPackageName() != null) {\n                String pkg = String.valueOf(root.getPackageName());\n                if (!pkg.isEmpty()) activePackageName = pkg;\n            }\n        } catch (Throwable ignored) {}\n        return activePackageName == null ? "" : activePackageName;\n    }\n\n    public boolean isRobloxForeground() {\n        String pkg = activePackageName();\n        return "com.roblox.client".equals(pkg) || "com.roblox.client.samsunggalaxy".equals(pkg);\n    }\n''', 'a11y foreground guard')

          assert 'gather.onFrame(frame);' in engine.read_text()
          assert 'configureMacro(String json)' in bridge.read_text()
          assert 'isRobloxForeground()' in a11y.read_text()
          print('v0.2.9 source migration applied')
      - name: Repack source into authoritative CI parts
        shell: bash
        run: |
          cd /tmp/src
          zip -qr /tmp/source-v029.zip revo-android
          base64 -w 76 /tmp/source-v029.zip > /tmp/source-v029.b64
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/source-v029.b64').read_text().splitlines(True)
          chunk = (len(lines) + 3) // 4
          for i in range(4):
              Path(f'.ci-source-part{i:02d}').write_text(''.join(lines[i*chunk:(i+1)*chunk]))
          PY
          cd "$GITHUB_WORKSPACE"
          for i in 00 01 02 03; do cp "/tmp/src/.ci-source-part$i" ".ci/source.part$i"; done
          cat .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03 | base64 --decode > /tmp/verify.zip
          unzip -p /tmp/verify.zip revo-android/app/src/main/java/com/revolution/android/RevoGatherAdapter.java | grep -F 'Exact command geometry from desktop patterns/gather/e_lol.lua.'
          unzip -p /tmp/verify.zip revo-android/app/src/main/java/com/revolution/android/MacroEngine.java | grep -F 'gather.onFrame(frame);'
      - name: Commit packed v0.2.9 source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03
          git diff --cached --stat
          git commit -m 'Port recovered e_lol gather adapter to Android engine'
          git push origin HEAD:main
