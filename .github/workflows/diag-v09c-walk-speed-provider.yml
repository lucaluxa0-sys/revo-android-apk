name: Trace v0.9c Walk speed provider

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diag-v09c-walk-speed-provider.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download exact pinned Revolution binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache speed-evidence
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe' | sha256sum -c -
      - name: Install parsers
        run: python3 -m pip install --disable-pip-version-check pefile capstone
      - name: Recover duration constant and speed-provider candidates
        shell: python
        run: |
          from pathlib import Path
          import bisect, math, struct
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64, CS_GRP_CALL
          from capstone.x86 import X86_OP_IMM, X86_OP_MEM, X86_REG_RIP

          EXE = Path('.cache/RevolutionMacro.exe')
          WALK = 0x140c61480
          EXPECTED_SHA = '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb'
          raw = EXE.read_bytes()
          pe = pefile.PE(str(EXE), fast_load=False)
          base = int(pe.OPTIONAL_HEADER.ImageBase)
          image_size = int(pe.OPTIONAL_HEADER.SizeOfImage)
          sections = [
              dict(
                  name=s.Name.rstrip(b'\0').decode(errors='replace'),
                  raw=int(s.PointerToRawData),
                  size=int(s.SizeOfRawData),
                  rva=int(s.VirtualAddress),
                  data=s.get_data(),
                  chars=int(s.Characteristics),
              )
              for s in pe.sections
          ]

          def va2off(va):
              rva = va - base
              if 0 <= rva < int(pe.OPTIONAL_HEADER.SizeOfHeaders):
                  return rva
              for s in sections:
                  if s['rva'] <= rva < s['rva'] + s['size']:
                      return s['raw'] + rva - s['rva']
              return None

          def q(o): return struct.unpack_from('<Q', raw, o)[0]
          def u32(o): return struct.unpack_from('<I', raw, o)[0]
          def i32(o): return struct.unpack_from('<i', raw, o)[0]
          def d64(o): return struct.unpack_from('<d', raw, o)[0]
          def cstr(va, limit=800):
              o = va2off(va)
              if o is None: return None
              z = raw.find(b'\0', o, min(len(raw), o + limit))
              z = min(len(raw), o + limit) if z < 0 else z
              try: return raw[o:z].decode('utf-8')
              except Exception: return None

          # Recover Go moduledata exactly as the established diagnostic does.
          minpc = 0x1400014a0
          best = None
          p = 0
          while True:
              h = raw.find(struct.pack('<Q', minpc), p)
              if h < 0: break
              md = h - 160
              if md >= 0:
                  ft=q(md+128); n=q(md+136); cap=q(md+144); text=q(md+176); fn=q(md+8); pcln=q(md+104)
                  score=sum([text==minpc, 1000<n<500000, cap>=n, va2off(ft)is not None, va2off(fn)is not None, va2off(pcln)is not None])
                  if best is None or score > best[0]: best=(score,(ft,n,text,fn,pcln))
              p = h + 1
          if not best or best[0] < 5:
              raise SystemExit('moduledata recovery failed')
          ft,n,text,fn,pcln = best[1]
          fo,po = va2off(ft),va2off(pcln)
          funcs=[]
          for i in range(int(n)-1):
              ent=u32(fo+i*8); funcoff=u32(fo+i*8+4); fm=po+funcoff
              if not (0 <= fm+8 < len(raw)): continue
              name=cstr(fn+i32(fm+4)); addr=text+ent
              if name and base <= addr < base+image_size: funcs.append((addr,name))
          funcs.sort()
          addrs=[a for a,_ in funcs]
          names=dict(funcs)
          funcset=set(addrs)
          if WALK not in names:
              raise SystemExit(f'exact Walk {WALK:#x} not recovered')

          def fend(a):
              i=bisect.bisect_left(addrs,a)
              return addrs[i+1] if i+1 < len(addrs) else a+0x10000
          def code(a):
              e=fend(a)
              for s in sections:
                  sv=base+s['rva']; ev=sv+len(s['data'])
                  if sv <= a < ev:
                      return s['data'][a-sv:min(len(s['data']),e-sv)]
              return b''

          mdx=Cs(CS_ARCH_X86,CS_MODE_64); mdx.detail=True
          walk_ins=list(mdx.disasm(code(WALK),WALK))
          out=[]
          out.append(f'WALK={WALK:#x} {names[WALK]} END={fend(WALK):#x}')

          # Prove every finite qword floating constant referenced by Walk.
          rip_values=[]
          for ins in walk_ins:
              for op in ins.operands:
                  if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                      va=ins.address+ins.size+op.mem.disp
                      off=va2off(va)
                      if off is None or off+8>len(raw): continue
                      val=d64(off)
                      if math.isfinite(val):
                          rip_values.append((ins.address,ins.mnemonic,ins.op_str,va,val,q(off)))
          out.append('===== WALK RIP-RELATIVE QWORD FLOATS =====')
          for ia,mn,ops,va,val,bits in rip_values:
              out.append(f'{ia:#x}: {mn} {ops} -> {va:#x} double={val:.17g} bits={bits:#018x}')
          duration=[x for x in rip_values if x[0]==0x140c61595]
          if len(duration)!=1:
              raise SystemExit(f'expected one duration constant at 0x140c61595, got {duration!r}')
          if duration[0][4] != 1_000_000_000.0:
              raise SystemExit(f'unexpected duration unit: {duration[0][4]!r}')
          out.append('DURATION_UNIT_PROOF=1000000000ns_per_second')

          # Walk's speed is returned by the second indirect call at 0x140c61589.
          # That call dispatches through method slot +0x28 (= itab Fun[2]).
          # Enumerate itab-like read-only records and rank Fun[2] implementations
          # by floating-point activity without assuming old source coefficients.
          def analyze_func(a):
              insns=list(mdx.disasm(code(a),a))
              fp=[]; constants=[]; direct_calls=[]
              for ins in insns:
                  m=ins.mnemonic.lower()
                  if ('sd' in m or 'ss' in m) and any(k in m for k in ('add','sub','mul','div','mov','cvt','xor','min','max')):
                      fp.append(f'{ins.address:#x}: {ins.mnemonic} {ins.op_str}')
                  if ins.group(CS_GRP_CALL):
                      for op in ins.operands:
                          if op.type==X86_OP_IMM:
                              t=int(op.imm)&((1<<64)-1)
                              if t in names: direct_calls.append((t,names[t]))
                  for op in ins.operands:
                      if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                          va=ins.address+ins.size+op.mem.disp; off=va2off(va)
                          if off is None or off+8>len(raw): continue
                          val=d64(off)
                          if math.isfinite(val) and abs(val)<1e15:
                              constants.append((va,val))
              return insns,fp,constants,direct_calls

          itabs=[]
          seen=set()
          # IMAGE_SCN_MEM_READ and not IMAGE_SCN_MEM_EXECUTE.
          for s in sections:
              if not (s['chars'] & 0x40000000) or (s['chars'] & 0x20000000):
                  continue
              data=s['data']; sva=base+s['rva']
              for rel in range(0,max(0,len(data)-56),8):
                  off=s['raw']+rel
                  try:
                      inter=q(off); typ=q(off+8); f0=q(off+24); f1=q(off+32); f2=q(off+40)
                  except Exception:
                      continue
                  if not (base<=inter<base+image_size and base<=typ<base+image_size): continue
                  if f0 not in funcset or f2 not in funcset: continue
                  key=(sva+rel,f2)
                  if key in seen: continue
                  seen.add(key)
                  insns,fp,consts,calls=analyze_func(f2)
                  # A MoveSpeed-like method must do meaningful floating work or call into a helper that does.
                  score=len(fp)*3 + min(len(consts),10) + sum(2 for _,nm in calls if 'config' in nm or 'common' in nm)
                  if fp or any('config' in nm or 'common' in nm for _,nm in calls):
                      itabs.append((score,sva+rel,inter,typ,f0,f1,f2,fp,consts,calls))
          itabs.sort(reverse=True,key=lambda x:x[0])
          out.append('===== ITAB FUN[2] FLOAT-HEAVY CANDIDATES =====')
          for rank,row in enumerate(itabs[:40],1):
              score,iva,inter,typ,f0,f1,f2,fp,consts,calls=row
              out.append(f'-- rank={rank} score={score} itab={iva:#x} inter={inter:#x} type={typ:#x} fun0={f0:#x}:{names.get(f0)} fun1={f1:#x}:{names.get(f1)} fun2={f2:#x}:{names.get(f2)}')
              if consts:
                  uniq=[]
                  for va,val in consts:
                      item=(va,round(val,12))
                      if item not in uniq: uniq.append(item)
                  out.append('constants='+'; '.join(f'{va:#x}={val:.12g}' for va,val in uniq[:20]))
              if calls:
                  out.append('calls='+'; '.join(f'{a:#x}:{nm}' for a,nm in calls[:20]))
              out.extend('fp '+x for x in fp[:30])

          # Also rank all exact Go functions with floating arithmetic and config/common calls.
          ranked=[]
          for a,nm in funcs:
              data=code(a)
              if not data or len(data)>12000: continue
              insns,fp,consts,calls=analyze_func(a)
              signal=sum(3 for _,cn in calls if 'pkg/config' in cn)+sum(2 for _,cn in calls if 'pkg/common' in cn)
              if fp and signal:
                  ranked.append((len(fp)*2+signal,a,nm,fp,consts,calls))
          ranked.sort(reverse=True,key=lambda x:x[0])
          out.append('===== FLOAT FUNCTIONS CALLING CONFIG/COMMON =====')
          for rank,(score,a,nm,fp,consts,calls) in enumerate(ranked[:40],1):
              out.append(f'-- rank={rank} score={score} {a:#x} {nm} end={fend(a):#x}')
              if consts:
                  uniq=[]
                  for va,val in consts:
                      item=(va,round(val,12))
                      if item not in uniq: uniq.append(item)
                  out.append('constants='+'; '.join(f'{va:#x}={val:.12g}' for va,val in uniq[:20]))
              out.append('calls='+'; '.join(f'{ca:#x}:{cn}' for ca,cn in calls[:20]))
              out.extend('fp '+x for x in fp[:25])

          # Keep the exact Walk body in the evidence for causal review.
          out.append('===== EXACT WALK DISASSEMBLY =====')
          for ins in walk_ins:
              ann=[]
              if ins.group(CS_GRP_CALL):
                  for op in ins.operands:
                      if op.type==X86_OP_IMM:
                          t=int(op.imm)&((1<<64)-1)
                          if t in names: ann.append('CALL='+names[t])
              out.append(f'{ins.address:#x}: {ins.mnemonic:8s} {ins.op_str}'+((' ; '+' | '.join(ann)) if ann else ''))

          Path('speed-evidence/summary.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))
      - name: Upload speed evidence
        uses: actions/upload-artifact@v4
        with:
          name: revolution-v09c-walk-speed-provider
          path: speed-evidence/
          if-no-files-found: error
