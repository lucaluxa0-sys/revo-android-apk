name: Publish exact v0.2.12 phone preview artifact

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v0212-phone-preview-existing-artifact.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish-existing-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact green phone-preview artifact
        uses: actions/download-artifact@v4
        with:
          name: RevolutionMacro-Android-v0.2.12-PHONE-PREVIEW-ecffc41288878223356007e52f852a71022228f0
          path: /tmp/v0212-preview
          repository: lucaluxa0-sys/revo-android-apk
          run-id: 34723400980
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact bytes and publish uniquely named preview
        shell: bash
        run: |
          set -euo pipefail
          NAME='RevolutionMacro-Android-v0.2.12-PHONE-PREVIEW-ecffc41.apk'
          EXPECTED='6701220de6054323a6f0c4626a2c7699977e448e6214ff2abaf7345961d93d34'
          SRC="/tmp/v0212-preview/$NAME"
          test -s "$SRC"
          echo "$EXPECTED  $SRC" | sha256sum -c -
          test ! -e "$NAME"
          cp "$SRC" "$NAME"
          sha256sum "$NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$NAME"
          git commit -m 'Publish v0.2.12 remote-agent phone preview ecffc41 APK [skip ci]'
          git push origin HEAD:main