name: Diagnose v0.2.9 Android Gather execution state

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diag-v029-runtime-gather-state.yml
      - tools/instrument-v029-gather-state.py

permissions:
  contents: read

jobs:
  android15:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          cat .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03 | base64 --decode > /tmp/source.zip
          unzip -q /tmp/source.zip
          mkdir -p .cache revo-android/app/src/main/assets/www
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo "0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe" | sha256sum -c -
          python3 revo-android/extract_revo_frontend.py .cache/RevolutionMacro.exe revo-android/app/src/main/assets/www
          cp revo-android/app/src/main/assets/www/index.android.html revo-android/app/src/main/assets/www/index.html
          JS=$(find revo-android/app/src/main/assets/www/assets -maxdepth 1 -name 'index-*.js' | head -n1)
          python3 tools/patch-revo-frontend-v028.py "$JS"
          cat patches/android-wails-shim-v0.2.4.js patches/android-backend-v0.2.5.js patches/android-backend-v0.2.6.js patches/android-backend-v0.2.8.js patches/android-backend-v0.2.8.1.js > revo-android/app/src/main/assets/www/android-wails-shim.js
          python3 tools/instrument-v029-gather-state.py revo-android/app/src/main/java/com/revolution/android/MainActivity.java
          gradle -p revo-android --stacktrace :app:assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Capture real Android runtime Gather state
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p emulator-artifacts
            adb install -r revo-android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.revolution.android
            adb shell am start -W -n com.revolution.android/.MainActivity
            sleep 22
            adb exec-out screencap -p > emulator-artifacts/revo-v029-gather-state.png
            adb logcat -d -v time > emulator-artifacts/logcat-v029-gather-state.txt
            ! grep -q 'RevoV029GatherState ERROR' emulator-artifacts/logcat-v029-gather-state.txt
            grep 'RevoV029GatherState {' emulator-artifacts/logcat-v029-gather-state.txt | tail -n1 > emulator-artifacts/gather-state.txt
            cat emulator-artifacts/gather-state.txt
            test -s emulator-artifacts/gather-state.txt
            grep -q '"runtimeDisconnected":false' emulator-artifacts/gather-state.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revo-v029-runtime-gather-state
          path: emulator-artifacts/
          if-no-files-found: warn
