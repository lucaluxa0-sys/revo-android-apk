name: Legacy Revo Android v0.2.5 dev build

# This legacy workflow is intentionally manual and artifact-only.
# It previously ran on every .ci/** change and committed a newly built binary
# over RevolutionMacro-Android-v0.2.5-dev.apk. That made one repository APK
# filename refer to different bytes over time. Production/test APK publication
# must use a fresh versioned filename with explicit checksum/provenance instead.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore Android source
        shell: bash
        run: |
          cat .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03 | base64 --decode > /tmp/revo-android-source.zip
          unzip -q /tmp/revo-android-source.zip
          test -f revo-android/app/build.gradle.kts

      - name: Download exact public Revolution Macro release
        shell: bash
        run: |
          mkdir -p .cache
          curl -fL --retry 4 --retry-delay 2 \
            -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo "0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe" | sha256sum -c -

      - name: Extract Revo frontend and apply Android runtime/backend
        shell: bash
        run: |
          mkdir -p revo-android/app/src/main/assets/www
          python3 revo-android/extract_revo_frontend.py \
            .cache/RevolutionMacro.exe \
            revo-android/app/src/main/assets/www
          cp revo-android/app/src/main/assets/www/index.android.html \
             revo-android/app/src/main/assets/www/index.html
          cat patches/android-wails-shim-v0.2.4.js \
              patches/android-backend-v0.2.5.js \
              > revo-android/app/src/main/assets/www/android-wails-shim.js

      - name: Build APK
        shell: bash
        run: gradle -p revo-android --stacktrace :app:assembleDebug

      - name: Stage immutable run artifact
        shell: bash
        run: |
          set -euo pipefail
          APK=revo-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          NAME="RevolutionMacro-Android-v0.2.5-dev-${GITHUB_SHA:0:12}.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" > SHA256SUMS-v0.2.5-dev.txt
          echo "artifact_name=$NAME" >> "$GITHUB_ENV"

      - name: Upload immutable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RevolutionMacro-Android-v0.2.5-dev-${{ github.sha }}
          path: |
            ${{ env.artifact_name }}
            SHA256SUMS-v0.2.5-dev.txt
          if-no-files-found: error
