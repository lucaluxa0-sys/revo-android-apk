name: Build and publish Revo Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.ci/**'
      - 'patches/android-wails-shim-v0.2.4.js'
      - '.github/workflows/build-and-publish-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore Android source
        shell: bash
        run: |
          cat .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03 | base64 --decode > /tmp/revo-android-source.zip
          unzip -q /tmp/revo-android-source.zip
          test -f revo-android/app/build.gradle.kts

      - name: Download exact public Revolution Macro release
        shell: bash
        run: |
          mkdir -p .cache
          curl -fL --retry 4 --retry-delay 2 \
            -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo "0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe" | sha256sum -c -

      - name: Extract Revo frontend and apply Android runtime fix
        shell: bash
        run: |
          mkdir -p revo-android/app/src/main/assets/www
          python3 revo-android/extract_revo_frontend.py \
            .cache/RevolutionMacro.exe \
            revo-android/app/src/main/assets/www
          cp revo-android/app/src/main/assets/www/index.android.html \
             revo-android/app/src/main/assets/www/index.html
          cp patches/android-wails-shim-v0.2.4.js \
             revo-android/app/src/main/assets/www/android-wails-shim.js

      - name: Build APK
        shell: bash
        run: gradle -p revo-android --stacktrace :app:assembleDebug

      - name: Publish APK into repository
        shell: bash
        run: |
          APK=revo-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" RevolutionMacro-Android-v0.2.4-dev.apk
          sha256sum RevolutionMacro-Android-v0.2.4-dev.apk > SHA256SUMS.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RevolutionMacro-Android-v0.2.4-dev.apk SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "APK already up to date"
          else
            git commit -m "Publish RevolutionMacro Android v0.2.4 dev APK"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload build artifact too
        uses: actions/upload-artifact@v4
        with:
          name: RevolutionMacro-Android-v0.2.4-dev
          path: RevolutionMacro-Android-v0.2.4-dev.apk
          if-no-files-found: error
