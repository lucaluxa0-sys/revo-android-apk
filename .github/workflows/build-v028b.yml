name: Revo Android v0.2.8 real interaction retry

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v028b.yml'

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3

      - name: Prepare Android source and exact Revo frontend
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          cat .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03 | base64 --decode > /tmp/source.zip
          unzip -q /tmp/source.zip
          cp revo-android/app/src/main/java/com/revolution/android/MainActivity.java /tmp/MainActivity.clean.java
          mkdir -p .cache revo-android/app/src/main/assets/www
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo "0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe" | sha256sum -c -
          python3 revo-android/extract_revo_frontend.py .cache/RevolutionMacro.exe revo-android/app/src/main/assets/www
          cp revo-android/app/src/main/assets/www/index.android.html revo-android/app/src/main/assets/www/index.html
          npm install --silent --prefix /tmp/hashprobe rollup@4.50.0
          node tools/recover-vite-pngs.js .cache/RevolutionMacro.exe revo-android/app/src/main/assets/www /tmp/hashprobe/node_modules/rollup/dist/native.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('revo-android/app/src/main/assets/www')
          m=json.loads((root/'revo-png-manifest.json').read_text())
          assert m['count']==113
          assert all((root/'assets'/x).is_file() for x in m['assets'])
          PY
          JS=$(find revo-android/app/src/main/assets/www/assets -maxdepth 1 -name 'index-*.js' | head -n1)
          python3 tools/patch-revo-frontend-v028.py "$JS"
          cat patches/android-wails-shim-v0.2.4.js \
              patches/android-backend-v0.2.5.js \
              patches/android-backend-v0.2.6.js \
              patches/android-backend-v0.2.8.js \
              > revo-android/app/src/main/assets/www/android-wails-shim.js

      - name: Install real Revolution icon
        shell: bash
        run: |
          rm -rf /tmp/revo-icon
          mkdir -p /tmp/revo-icon revo-android/app/src/main/res/drawable-nodpi
          (cd /tmp/revo-icon && 7z x -y "$GITHUB_WORKSPACE/.cache/RevolutionMacro.exe" '.rsrc/0/ICON/1' >/dev/null)
          cp /tmp/revo-icon/.rsrc/0/ICON/1 revo-android/app/src/main/res/drawable-nodpi/revo_icon.png
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('revo-android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=re.sub(r'\s+android:icon="[^"]*"','',s)
          s=re.sub(r'\s+android:roundIcon="[^"]*"','',s)
          s=s.replace('<application','<application\n        android:icon="@drawable/revo_icon"\n        android:roundIcon="@drawable/revo_icon"',1)
          p.write_text(s)
          PY

      - name: Instrument WebView with real-page navigation probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('revo-android/app/src/main/java/com/revolution/android/MainActivity.java')
          s=p.read_text()
          s=s.replace('import android.webkit.WebChromeClient;', 'import android.webkit.WebChromeClient;\nimport android.webkit.ConsoleMessage;\nimport android.util.Log;')
          s=s.replace('web.setWebChromeClient(new WebChromeClient());', '''WebView.setWebContentsDebuggingEnabled(true);\n        web.setWebChromeClient(new WebChromeClient() {\n            @Override public boolean onConsoleMessage(ConsoleMessage cm) { Log.e("RevoWeb", cm.message()); return true; }\n        });''')
          marker='web.loadUrl("https://revo.local/index.android.html");'
          probe=textwrap.dedent(r'''
          web.loadUrl("https://revo.local/index.android.html");
          Handler gate = new Handler(Looper.getMainLooper());
          gate.postDelayed(() -> web.evaluateJavascript(
          "(async()=>{const sleep=ms=>new Promise(r=>setTimeout(r,ms));const visible=e=>!!e&&e.getClientRects().length>0&&getComputedStyle(e).visibility!=='hidden'&&getComputedStyle(e).display!=='none';const text=e=>(e.innerText||e.textContent||'').trim();const buttons=()=>[...document.querySelectorAll('button')].filter(visible);const findButton=t=>buttons().find(b=>text(b)===t||text(b).includes(t));const tap=e=>{if(!e)return false;try{e.scrollIntoView({block:'center',inline:'center'});}catch(_){};const R=e.getBoundingClientRect(),x=R.left+R.width/2,y=R.top+R.height/2;for(const type of ['pointerdown','mousedown','pointerup','mouseup','click']){try{const C=type.startsWith('pointer')&&window.PointerEvent?PointerEvent:MouseEvent;e.dispatchEvent(new C(type,{bubbles:true,cancelable:true,clientX:x,clientY:y,pointerId:1,pointerType:'touch',isPrimary:true,button:0,buttons:type.includes('down')?1:0}));}catch(_){}}return true;};const out={};try{const rt=window.dataRuntime,m=window.go.cmd.Macro;out.backend=window.RevoAndroidDebug&&window.RevoAndroidDebug.backendVersion;out.tooltipCount=Object.keys(rt.tooltips||{}).length;out.discordShowed=rt.Object('settings').Concrete('discordRichPresencePromptShowed');out.discordEnabled=rt.presetObject(rt.preset||rt.defaultPreset||'Default').Object('macro').Concrete('discordRichPresenceEnabled');const active=rt.presetObject(rt.preset||rt.defaultPreset||'Default').Object('patterns').List('active');active.keyField='id';active.primitive=false;const startCount=active.values.length;await m.AddDefaultField('sunflower');await sleep(200);const added=active.values.find(x=>x&&x.object&&x.object.Concrete('field')==='sunflower');out.gatherAdded=!!added;out.gatherDelta=active.values.length-startCount;if(added)await m.DeleteField(added.key);await sleep(200);out.gatherRestored=active.values.length===startCount;let replay=null;window.runtime.EventsOnMultiple('logs_batch',x=>replay=x,1);await sleep(100);out.logCount=(window.RevoAndroidDebug.logs()||[]).length;out.logReplay=Array.isArray(replay)?replay.length:-1;const auto=rt.presetObject(rt.preset||rt.defaultPreset||'Default').Object('planter').Object('autoPlanters');auto.Set('enabled',true);await m.RefreshPlanterSchedule('Default');await sleep(700);const ps=rt.planterObject(rt.account||'Default').Object('state');out.solverRunning=ps.Concrete('solverRunning');out.solverStatus=ps.Concrete('solverStatus');out.solverReason=ps.Concrete('solverFailureReason');const planters=findButton('Planters');out.plantersTab=!!planters;tap(planters);await sleep(700);out.afterPlantersVisible=buttons().map(text).filter(Boolean).slice(0,40);const autoBtn=findButton('Auto-Planters');out.autoButton=!!autoBtn;tap(autoBtn);await sleep(700);let dialog=[...document.querySelectorAll('[role=dialog]')].filter(visible).find(d=>text(d).includes('Auto-Planters'));out.autoDialog=!!dialog;out.dialogText=dialog?text(dialog).slice(0,300):'';const help=dialog?[...dialog.querySelectorAll('button[aria-label=Help]')].find(visible):null;out.helpButton=!!help;tap(help);await sleep(200);const popup=document.querySelector('[data-revo-help-popup]');out.helpPopup=!!popup&&visible(popup);out.helpText=popup?text(popup).slice(0,240):'';const closeHelp=document.querySelector('button[aria-label=\"Close help\"]');tap(closeHelp);await sleep(150);out.helpClosed=!document.querySelector('[data-revo-help-popup]');dialog=[...document.querySelectorAll('[role=dialog]')].filter(visible).find(d=>text(d).includes('Auto-Planters'));const closeCandidates=dialog?[...dialog.querySelectorAll('button')].filter(visible).filter(b=>(b.getAttribute('aria-label')||'').toLowerCase().includes('close')||text(b)==='×'):[];out.modalCloseButtons=closeCandidates.map(b=>b.getAttribute('aria-label')||text(b));tap(closeCandidates[0]);await sleep(300);out.modalClosed=![...document.querySelectorAll('[role=dialog]')].filter(visible).some(d=>text(d).includes('Auto-Planters'));out.discordPromptInDom=(document.body.innerText||'').includes('Discord Rich Presence')&&(document.body.innerText||'').includes('Enable');console.error('RevoV028BProbe '+JSON.stringify(out));}catch(e){console.error('RevoV028BProbe ERROR '+String(e)+' '+(e&&e.stack||''));}})()",
          value -> Log.e("RevoV028BGate", String.valueOf(value))), 16000);
          ''').strip()
          if marker not in s: raise SystemExit('loadUrl marker missing')
          p.write_text(s.replace(marker,probe,1))
          PY

      - name: Build diagnostic APK
        shell: bash
        run: gradle -p revo-android --stacktrace :app:assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android 15 interaction gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p emulator-artifacts
            adb install -r revo-android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.revolution.android || true
            adb shell am start -W -n com.revolution.android/.MainActivity
            sleep 23
            adb exec-out screencap -p > emulator-artifacts/revo-v028b.png
            adb logcat -d -v time > emulator-artifacts/logcat-v028b.txt
            grep 'RevoV028BProbe {' emulator-artifacts/logcat-v028b.txt | tail -n1 > emulator-artifacts/probe.txt
            cat emulator-artifacts/probe.txt
            grep -q '"backend":"0.2.8"' emulator-artifacts/probe.txt
            grep -Eq '"tooltipCount":([2-9][0-9]|[1-9][0-9]{2,})' emulator-artifacts/probe.txt
            grep -q '"discordShowed":true' emulator-artifacts/probe.txt
            grep -q '"discordEnabled":false' emulator-artifacts/probe.txt
            grep -q '"gatherAdded":true' emulator-artifacts/probe.txt
            grep -q '"gatherDelta":1' emulator-artifacts/probe.txt
            grep -q '"gatherRestored":true' emulator-artifacts/probe.txt
            grep -Eq '"logCount":[1-9][0-9]*' emulator-artifacts/probe.txt
            grep -Eq '"logReplay":[1-9][0-9]*' emulator-artifacts/probe.txt
            grep -q '"solverRunning":false' emulator-artifacts/probe.txt
            grep -q '"solverStatus":"blocked"' emulator-artifacts/probe.txt
            grep -q '"plantersTab":true' emulator-artifacts/probe.txt
            grep -q '"autoButton":true' emulator-artifacts/probe.txt
            grep -q '"autoDialog":true' emulator-artifacts/probe.txt
            grep -q '"helpButton":true' emulator-artifacts/probe.txt
            grep -q '"helpPopup":true' emulator-artifacts/probe.txt
            grep -q '"helpClosed":true' emulator-artifacts/probe.txt
            grep -q '"modalClosed":true' emulator-artifacts/probe.txt
            grep -q '"discordPromptInDom":false' emulator-artifacts/probe.txt
            echo 'PASS: v0.2.8 real Android interaction retry is green'

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revo-android-v0.2.8b-emulator-evidence
          path: emulator-artifacts/
          if-no-files-found: warn

      - name: Build clean final APK
        shell: bash
        run: |
          cp /tmp/MainActivity.clean.java revo-android/app/src/main/java/com/revolution/android/MainActivity.java
          gradle -p revo-android --stacktrace clean :app:assembleDebug
          cp revo-android/app/build/outputs/apk/debug/app-debug.apk /tmp/RevolutionMacro-Android-v0.2.8-dev.apk
          sha256sum /tmp/RevolutionMacro-Android-v0.2.8-dev.apk | sed 's#/tmp/##' > /tmp/SHA256SUMS-v028.txt

      - name: Publish only after green emulator gate
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for try in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/RevolutionMacro-Android-v0.2.8-dev.apk RevolutionMacro-Android-v0.2.8-dev.apk
            cp /tmp/SHA256SUMS-v028.txt SHA256SUMS.txt
            git add RevolutionMacro-Android-v0.2.8-dev.apk SHA256SUMS.txt
            git commit -m 'Publish emulator-gated RevolutionMacro Android v0.2.8 dev APK' || exit 0
            git push origin HEAD:main && exit 0
          done
          exit 1
