name: Build test and publish Revo Android v0.2.8.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v028b.yml'
      - 'patches/android-backend-v0.2.8.1.js'

permissions:
  contents: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3

      - name: Restore Android source and exact Revolution frontend
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          cat .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03 | base64 --decode > /tmp/source.zip
          unzip -q /tmp/source.zip
          cp revo-android/app/src/main/java/com/revolution/android/MainActivity.java /tmp/MainActivity.clean.java
          mkdir -p .cache revo-android/app/src/main/assets/www
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo "0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe" | sha256sum -c -
          python3 revo-android/extract_revo_frontend.py .cache/RevolutionMacro.exe revo-android/app/src/main/assets/www
          cp revo-android/app/src/main/assets/www/index.android.html revo-android/app/src/main/assets/www/index.html
          npm install --silent --prefix /tmp/hashprobe rollup@4.50.0
          node tools/recover-vite-pngs.js .cache/RevolutionMacro.exe revo-android/app/src/main/assets/www /tmp/hashprobe/node_modules/rollup/dist/native.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('revo-android/app/src/main/assets/www')
          m=json.loads((root/'revo-png-manifest.json').read_text())
          assert m['count']==113
          assert all((root/'assets'/x).is_file() for x in m['assets'])
          PY
          JS=$(find revo-android/app/src/main/assets/www/assets -maxdepth 1 -name 'index-*.js' | head -n1)
          python3 tools/patch-revo-frontend-v028.py "$JS"
          cat patches/android-wails-shim-v0.2.4.js \
              patches/android-backend-v0.2.5.js \
              patches/android-backend-v0.2.6.js \
              patches/android-backend-v0.2.8.js \
              patches/android-backend-v0.2.8.1.js \
              > revo-android/app/src/main/assets/www/android-wails-shim.js

      - name: Install real Revolution icon
        shell: bash
        run: |
          rm -rf /tmp/revo-icon
          mkdir -p /tmp/revo-icon revo-android/app/src/main/res/drawable-nodpi
          (cd /tmp/revo-icon && 7z x -y "$GITHUB_WORKSPACE/.cache/RevolutionMacro.exe" '.rsrc/0/ICON/1' >/dev/null)
          cp /tmp/revo-icon/.rsrc/0/ICON/1 revo-android/app/src/main/res/drawable-nodpi/revo_icon.png
          file revo-android/app/src/main/res/drawable-nodpi/revo_icon.png | grep -q 'PNG image data, 256 x 256'
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('revo-android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=re.sub(r'\s+android:icon="[^"]*"','',s)
          s=re.sub(r'\s+android:roundIcon="[^"]*"','',s)
          s=s.replace('<application','<application\n        android:icon="@drawable/revo_icon"\n        android:roundIcon="@drawable/revo_icon"',1)
          p.write_text(s)
          PY

      - name: Instrument WebView for Android 15 interaction gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('revo-android/app/src/main/java/com/revolution/android/MainActivity.java')
          s=p.read_text()
          s=s.replace('import android.webkit.WebChromeClient;', 'import android.webkit.WebChromeClient;\nimport android.webkit.ConsoleMessage;\nimport android.util.Log;')
          s=s.replace('web.setWebChromeClient(new WebChromeClient());', '''WebView.setWebContentsDebuggingEnabled(true);\n        web.setWebChromeClient(new WebChromeClient() {\n            @Override public boolean onConsoleMessage(ConsoleMessage cm) {\n                Log.e("RevoWeb", cm.message() + " @" + cm.sourceId() + ":" + cm.lineNumber());\n                return true;\n            }\n        });''')
          marker='web.loadUrl("https://revo.local/index.android.html");'
          probe=textwrap.dedent(r'''
          web.loadUrl("https://revo.local/index.android.html");
          Handler gate = new Handler(Looper.getMainLooper());
          gate.postDelayed(() -> web.evaluateJavascript(
          "(async()=>{const sleep=ms=>new Promise(r=>setTimeout(r,ms));const visible=e=>!!e&&e.getClientRects().length>0&&getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden';const txt=e=>(e.innerText||e.textContent||'').trim();const btns=()=>[...document.querySelectorAll('button')].filter(visible);const exact=t=>btns().find(b=>txt(b)===t);const tap=e=>{if(!e)return false;e.scrollIntoView({block:'center'});e.click();return true};const out={};try{out.schema=window.RevoAndroidDebug&&window.RevoAndroidDebug.autoPlanterSchema&&window.RevoAndroidDebug.autoPlanterSchema();out.backend=window.RevoAndroidDebug&&window.RevoAndroidDebug.backendVersion;out.tooltipCount=Object.keys((window.dataRuntime&&window.dataRuntime.tooltips)||{}).length;tap(exact('Planters'));await sleep(500);const open=exact('Auto-Planters');out.openButton=!!open;tap(open);await sleep(700);let dialogs=[...document.querySelectorAll('[role=dialog]')].filter(visible);let d=dialogs.find(x=>txt(x).includes('Auto-Planters'));out.autoDialog=!!d;out.dialogText=d?txt(d).slice(0,500):'';const helps=d?[...d.querySelectorAll('button[aria-label=Help]')].filter(visible):[];out.helpCount=helps.length;tap(helps[0]);await sleep(250);const popup=document.querySelector('[data-revo-help-popup]');out.helpPopup=!!popup&&visible(popup);out.helpText=popup?txt(popup).slice(0,300):'';tap(document.querySelector('button[aria-label=\"Close help\"]'));await sleep(150);out.helpClosed=!document.querySelector('[data-revo-help-popup]');d=[...document.querySelectorAll('[role=dialog]')].filter(visible).find(x=>txt(x).includes('Auto-Planters'));const close=d&&[...d.querySelectorAll('button')].find(b=>(b.getAttribute('aria-label')||'').toLowerCase().includes('close'));out.closeFound=!!close;tap(close);await sleep(300);out.modalClosed=![...document.querySelectorAll('[role=dialog]')].filter(visible).some(x=>txt(x).includes('Auto-Planters'));out.discordPrompt=(document.body.innerText||'').includes('Discord Rich Presence')&&(document.body.innerText||'').includes('Enable');console.error('RevoV0281Probe '+JSON.stringify(out));}catch(e){console.error('RevoV0281Probe ERROR '+String(e)+' '+(e&&e.stack||''));}})()",
          value -> Log.e("RevoV0281Gate", String.valueOf(value))), 15000);
          ''').strip()
          if marker not in s: raise SystemExit('loadUrl marker missing')
          p.write_text(s.replace(marker,probe,1))
          PY

      - name: Build diagnostic APK
        shell: bash
        run: gradle -p revo-android --stacktrace :app:assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android 15 Auto-Planters and help gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p emulator-artifacts
            adb install -r revo-android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.revolution.android || true
            adb shell am start -W -n com.revolution.android/.MainActivity
            sleep 22
            adb exec-out screencap -p > emulator-artifacts/revo-v0281.png
            adb logcat -d -v time > emulator-artifacts/logcat-v0281.txt
            ! grep -q 'RevoV0281Probe ERROR' emulator-artifacts/logcat-v0281.txt
            grep 'RevoV0281Probe {' emulator-artifacts/logcat-v0281.txt | tail -n1 > emulator-artifacts/probe.txt
            cat emulator-artifacts/probe.txt
            grep -q '"backend":"0.2.8.1"' emulator-artifacts/probe.txt
            grep -q '"keyField":"type"' emulator-artifacts/probe.txt
            grep -q '"keyField":"field"' emulator-artifacts/probe.txt
            grep -q '"keyField":"planter"' emulator-artifacts/probe.txt
            grep -Eq '"tooltipCount":[1-9][0-9]*' emulator-artifacts/probe.txt
            grep -q '"openButton":true' emulator-artifacts/probe.txt
            grep -q '"autoDialog":true' emulator-artifacts/probe.txt
            grep -Eq '"helpCount":[1-9][0-9]*' emulator-artifacts/probe.txt
            grep -q '"helpPopup":true' emulator-artifacts/probe.txt
            grep -q '"helpClosed":true' emulator-artifacts/probe.txt
            grep -q '"closeFound":true' emulator-artifacts/probe.txt
            grep -q '"modalClosed":true' emulator-artifacts/probe.txt
            grep -q '"discordPrompt":false' emulator-artifacts/probe.txt
            ! grep -q "Cannot read properties of undefined (reading 'Concrete')" emulator-artifacts/logcat-v0281.txt
            echo 'PASS: v0.2.8.1 real Android interaction gate is green'

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revo-android-v0.2.8.1-emulator-evidence
          path: emulator-artifacts/
          if-no-files-found: warn

      - name: Build clean final APK
        shell: bash
        run: |
          cp /tmp/MainActivity.clean.java revo-android/app/src/main/java/com/revolution/android/MainActivity.java
          gradle -p revo-android --stacktrace clean :app:assembleDebug
          cp revo-android/app/build/outputs/apk/debug/app-debug.apk /tmp/RevolutionMacro-Android-v0.2.8.1-dev.apk
          sha256sum /tmp/RevolutionMacro-Android-v0.2.8.1-dev.apk | sed 's#/tmp/##' > /tmp/SHA256SUMS-v0281.txt
          cat /tmp/SHA256SUMS-v0281.txt

      - name: Publish only after green emulator gate
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for try in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/RevolutionMacro-Android-v0.2.8.1-dev.apk RevolutionMacro-Android-v0.2.8.1-dev.apk
            cp /tmp/SHA256SUMS-v0281.txt SHA256SUMS.txt
            git add RevolutionMacro-Android-v0.2.8.1-dev.apk SHA256SUMS.txt
            git commit -m 'Publish emulator-gated RevolutionMacro Android v0.2.8.1 dev APK' || exit 0
            git push origin HEAD:main && exit 0
          done
          exit 1
