name: Trace modern v0.9c BuffType ID map

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diag-v09c-buff-id-map.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download exact pinned Revolution binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache buff-id-evidence
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe' | sha256sum -c -

      - name: Install parsers
        run: python3 -m pip install --disable-pip-version-check pefile capstone

      - name: Trace metadata records to compiler-emitted map keys
        shell: python
        run: |
          from pathlib import Path
          import bisect, struct
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_IMM, X86_OP_MEM, X86_REG_RIP

          EXE=Path('.cache/RevolutionMacro.exe')
          SHA='0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb'
          raw=EXE.read_bytes(); pe=pefile.PE(str(EXE),fast_load=False)
          base=int(pe.OPTIONAL_HEADER.ImageBase); image_size=int(pe.OPTIONAL_HEADER.SizeOfImage)
          sections=[dict(raw=int(s.PointerToRawData),size=int(s.SizeOfRawData),rva=int(s.VirtualAddress),data=s.get_data()) for s in pe.sections]
          def va2off(va):
              rva=va-base
              if 0<=rva<int(pe.OPTIONAL_HEADER.SizeOfHeaders): return rva
              for s in sections:
                  if s['rva']<=rva<s['rva']+s['size']: return s['raw']+rva-s['rva']
              return None
          def u32(o): return struct.unpack_from('<I',raw,o)[0]
          def i32(o): return struct.unpack_from('<i',raw,o)[0]
          def qva(va):
              o=va2off(va)
              return None if o is None or o+8>len(raw) else struct.unpack_from('<Q',raw,o)[0]
          def cstr(va,limit=800):
              o=va2off(va)
              if o is None:return None
              z=raw.find(b'\0',o,min(len(raw),o+limit)); z=min(len(raw),o+limit) if z<0 else z
              try:return raw[o:z].decode('utf-8')
              except:return None
          def go_string(hva):
              ptr=qva(hva); ln=qva(hva+8)
              if ptr is None or ln is None:return None
              o=va2off(ptr)
              if o is None or ln>256 or o+ln>len(raw):return None
              try:return raw[o:o+ln].decode('utf-8')
              except:return None

          # Recover Go function table from the already-proven hotfix3 moduledata anchor.
          minpc=0x1400014a0; best=None; p=0
          while True:
              h=raw.find(struct.pack('<Q',minpc),p)
              if h<0:break
              md=h-160
              if md>=0:
                  ft=struct.unpack_from('<Q',raw,md+128)[0]; n=struct.unpack_from('<Q',raw,md+136)[0]
                  cap=struct.unpack_from('<Q',raw,md+144)[0]; text=struct.unpack_from('<Q',raw,md+176)[0]
                  fn=struct.unpack_from('<Q',raw,md+8)[0]; pcln=struct.unpack_from('<Q',raw,md+104)[0]
                  score=sum([text==minpc,1000<n<500000,cap>=n,va2off(ft)is not None,va2off(fn)is not None,va2off(pcln)is not None])
                  if best is None or score>best[0]:best=(score,(ft,n,text,fn,pcln))
              p=h+1
          if not best or best[0]<5:raise SystemExit('moduledata recovery failed')
          ft,n,text,fn,pcln=best[1]; fo=va2off(ft); po=va2off(pcln); funcs=[]
          for i in range(int(n)-1):
              ent=u32(fo+i*8); foff=u32(fo+i*8+4); fm=po+foff
              if not 0<=fm+8<len(raw):continue
              nm=cstr(fn+i32(fm+4)); a=text+ent
              if nm and base<=a<base+image_size:funcs.append((a,nm))
          funcs.sort(); addrs=[a for a,_ in funcs]; names=dict(funcs)
          def fend(a):
              i=bisect.bisect_left(addrs,a); return addrs[i+1] if i+1<len(addrs) else a+0x10000
          mdx=Cs(CS_ARCH_X86,CS_MODE_64); mdx.detail=True
          def disasm_func(a):
              s=va2off(a); e=va2off(fend(a))
              if s is None or e is None:return []
              return list(mdx.disasm(raw[s:e],a))

          records=[
            ('Haste',0x1425f58d0,'Haste',None),('HastePlus',0x1425f5958,'HastePlus',None),
            ('HasteCoconut',0x142643ef8,'HasteCoconut',None),('BlackBear',0x142643f80,'BlackBear','black_bear'),
            ('BrownBear',0x142644008,'BrownBear','brown_bear'),('GummyBear',0x142644090,'GummyBear','gummy_bear'),
            ('MotherBear',0x142644118,'MotherBear','mother_bear'),('PandaBear',0x1426441a0,'PandaBear','panda_bear'),
            ('PolarBear',0x142644228,'PolarBear','polar_bear'),('ScienceBear',0x1426442b0,'ScienceBear','science_bear'),
            ('Oil',0x142644338,'Oil','oil'),('SuperSmoothie',0x1426443c0,'SuperSmoothie','smoothie')]
          ranges={label:(va,va+0x88) for label,va,_,_ in records}
          out=[f'PINNED_SHA256={SHA}','===== verified metadata records =====']
          for label,va,nexp,iexp in records:
              name=go_string(va+0x48); image=go_string(va+0x78)
              if name!=nexp:raise SystemExit(f'{label}: name drift {name!r}')
              if iexp is not None and image!=iexp:raise SystemExit(f'{label}: image drift {image!r}')
              out.append(f'{label}: record={va:#x} name={name!r} image={image!r}')

          # Search ALL recovered Go functions.  A hit on any byte within a proven
          # 0x88 metadata record is printed with enough surrounding instructions
          # to expose the map key / copy sequence that consumes that record.
          hits=[]
          for a,nm in funcs:
              ii=disasm_func(a)
              if not ii:continue
              local=[]
              for idx,ins in enumerate(ii):
                  matched=set()
                  for op in ins.operands:
                      if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                          t=ins.address+ins.size+op.mem.disp
                          for label,(lo,hi) in ranges.items():
                              if lo<=t<hi:matched.add((label,t))
                      elif op.type==X86_OP_IMM:
                          t=int(op.imm)
                          for label,(lo,hi) in ranges.items():
                              if lo<=t<hi:matched.add((label,t))
                  if matched:local.append((idx,matched))
              if not local:continue
              labels=sorted({x[0] for _,m in local for x in m})
              hits.append((a,nm,labels))
              out += ['',f'===== FUNCTION {a:#x}-{fend(a):#x} {nm} labels={",".join(labels)} =====']
              emitted=set()
              for idx,matched in local:
                  out.append('XREF '+hex(ii[idx].address)+' '+' '.join(f'{lab}->{t:#x}' for lab,t in sorted(matched)))
                  for x in ii[max(0,idx-45):min(len(ii),idx+46)]:
                      if x.address in emitted:continue
                      emitted.add(x.address)
                      ann=[]
                      for op in x.operands:
                          if op.type==X86_OP_IMM:
                              if int(op.imm) in (0x14000cdc0,0x14000d160):ann.append('MAPASSIGN')
                      out.append(f'{x.address:#x}: {x.mnemonic:9s} {x.op_str}'+((' ; '+' '.join(ann)) if ann else ''))
          out += ['',f'FUNCTION_XREF_HITS={len(hits)}']
          if not hits:raise SystemExit('no code xrefs to proven metadata records')

          # Preserve direct concrete interface proof while this diagnostic is here.
          itab=0x1425ef060; interface_type=0x141e91c40; movespeed=0x140c1c820
          out += ['','===== BuffDetector itab =====',f'itab={itab:#x} inter={qva(itab):#x} concrete={qva(itab+8):#x}']
          if qva(itab)!=interface_type or qva(itab+0x28)!=movespeed:raise SystemExit('BuffDetector itab drift')
          for i in range(9):
              f=qva(itab+0x18+i*8); out.append(f'fun[{i}]={f:#x} {names.get(f,"<unresolved>")}')
          out.append('PROVED MoveSpeed=fun[2]=itab+0x28')

          Path('buff-id-evidence/summary.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))

      - name: Upload buff ID evidence
        uses: actions/upload-artifact@v4
        with:
          name: revolution-v09c-buff-id-map
          path: buff-id-evidence/
          if-no-files-found: error
