name: Trace modern v0.9c BuffType ID map

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diag-v09c-buff-id-map.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download exact pinned Revolution binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache buff-id-evidence
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe' | sha256sum -c -

      - name: Install parsers
        run: python3 -m pip install --disable-pip-version-check pefile capstone

      - name: Trace modern buff-name xrefs and enum-key setup
        shell: python
        run: |
          from pathlib import Path
          import bisect, struct
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_MEM, X86_REG_RIP

          EXE = Path('.cache/RevolutionMacro.exe')
          MOVE_SPEED = 0x140c1c820
          raw = EXE.read_bytes()
          pe = pefile.PE(str(EXE), fast_load=False)
          base = int(pe.OPTIONAL_HEADER.ImageBase)
          image_size = int(pe.OPTIONAL_HEADER.SizeOfImage)
          sections = [
              dict(raw=int(s.PointerToRawData), size=int(s.SizeOfRawData),
                   rva=int(s.VirtualAddress), data=s.get_data())
              for s in pe.sections
          ]

          def va2off(va):
              rva = va - base
              if 0 <= rva < int(pe.OPTIONAL_HEADER.SizeOfHeaders):
                  return rva
              for s in sections:
                  if s['rva'] <= rva < s['rva'] + s['size']:
                      return s['raw'] + rva - s['rva']
              return None

          def off2va(off):
              if 0 <= off < int(pe.OPTIONAL_HEADER.SizeOfHeaders):
                  return base + off
              for s in sections:
                  if s['raw'] <= off < s['raw'] + s['size']:
                      return base + s['rva'] + off - s['raw']
              return None

          def q(o): return struct.unpack_from('<Q', raw, o)[0]
          def u32(o): return struct.unpack_from('<I', raw, o)[0]
          def i32(o): return struct.unpack_from('<i', raw, o)[0]

          def cstr(va, limit=800):
              o = va2off(va)
              if o is None: return None
              z = raw.find(b'\0', o, min(len(raw), o + limit))
              z = min(len(raw), o + limit) if z < 0 else z
              try: return raw[o:z].decode('utf-8')
              except Exception: return None

          # Recover the exact Go function table using the already-proven hotfix3 anchor.
          minpc = 0x1400014a0
          best = None
          p = 0
          while True:
              h = raw.find(struct.pack('<Q', minpc), p)
              if h < 0: break
              md = h - 160
              if md >= 0:
                  ft=q(md+128); n=q(md+136); cap=q(md+144)
                  text=q(md+176); fn=q(md+8); pcln=q(md+104)
                  score=sum([text==minpc, 1000<n<500000, cap>=n,
                             va2off(ft)is not None, va2off(fn)is not None,
                             va2off(pcln)is not None])
                  if best is None or score > best[0]:
                      best=(score,(ft,n,text,fn,pcln))
              p=h+1
          if not best or best[0] < 5:
              raise SystemExit('moduledata recovery failed')

          ft,n,text,fn,pcln=best[1]
          fo=va2off(ft); po=va2off(pcln)
          funcs=[]
          for i in range(int(n)-1):
              ent=u32(fo+i*8); funcoff=u32(fo+i*8+4); fm=po+funcoff
              if not (0 <= fm+8 < len(raw)): continue
              name=cstr(fn+i32(fm+4)); addr=text+ent
              if name and base <= addr < base+image_size:
                  funcs.append((addr,name))
          funcs.sort()
          addrs=[a for a,_ in funcs]
          names=dict(funcs)
          move_name=names.get(MOVE_SPEED,'')
          if not move_name.endswith('.MoveSpeed'):
              raise SystemExit(f'MoveSpeed address drift: {move_name!r}')
          receiver=move_name.rsplit('.MoveSpeed',1)[0]
          package=receiver.split('.(*',1)[0] + '.'

          def fend(a):
              i=bisect.bisect_left(addrs,a)
              return addrs[i+1] if i+1 < len(addrs) else a+0x10000

          def code(a):
              e=fend(a)
              for s in sections:
                  sv=base+s['rva']; ev=sv+len(s['data'])
                  if sv <= a < ev:
                      return s['data'][a-sv:min(len(s['data']),e-sv)]
              return b''

          mdx=Cs(CS_ARCH_X86,CS_MODE_64)
          mdx.detail=True
          cache={}
          def insns(a):
              if a not in cache:
                  cache[a]=list(mdx.disasm(code(a),a))
              return cache[a]

          needles = {
              'Haste': [b'Haste'],
              'HastePlus': [b'HastePlus', b'Haste+'],
              'HasteCoconut': [b'HasteCoconut', b'Coconut Haste', b'coconut_haste'],
              'BlackBear': [b'black_bear', b'BlackBear'],
              'MotherBear': [b'mother_bear', b'MotherBear'],
              'PandaBear': [b'panda_bear', b'PandaBear'],
              'PolarBear': [b'polar_bear', b'PolarBear'],
              'BrownBear': [b'brown_bear', b'BrownBear'],
              'ScienceBear': [b'science_bear', b'ScienceBear'],
              'GummyBear': [b'gummy_bear', b'GummyBear'],
              'Oil': [b'"oil"', b'Oil],
              'SuperSmoothie': [b'smoothie', b'SuperSmoothie'],
          }

          # Locate raw string starts plus any static Go string headers {ptr,len}
          # that point at those starts. Header xrefs matter when code does not LEA
          # the literal bytes directly.
          targets_by_label={}
          loc_lines=[]
          for label, variants in needles.items():
              raw_starts=[]
              for needle in variants:
                  p=0
                  while True:
                      o=raw.find(needle,p)
                      if o < 0: break
                      v=off2va(o)
                      if v is not None:
                          raw_starts.append((needle,o,v))
                      p=o+1
              # De-duplicate while preserving exact needle evidence.
              seen=set(); starts=[]
              for item in raw_starts:
                  key=(item[1],item[2])
                  if key not in seen:
                      seen.add(key); starts.append(item)
              target_vas=set(v for _,_,v in starts)
              headers=[]
              for needle,o,v in starts:
                  pat=struct.pack('<Q',v)
                  hp=0
                  while True:
                      h=raw.find(pat,hp)
                      if h < 0: break
                      hva=off2va(h)
                      if hva is not None and h+16 <= len(raw):
                          ln=q(h+8)
                          # Accept plausible string-header lengths that at least
                          # cover this matched spelling, but keep them bounded.
                          if len(needle) <= ln <= 80:
                              headers.append((h,hva,ln,v))
                              target_vas.add(hva)
                      hp=h+1
              targets_by_label[label]=target_vas
              loc_lines.append(f'[{label}]')
              if not starts:
                  loc_lines.append('  NO_RAW_MATCH')
              for needle,o,v in starts[:40]:
                  loc_lines.append(f'  raw off={o:#x} va={v:#x} needle={needle!r}')
              for h,hva,ln,v in headers[:80]:
                  loc_lines.append(f'  header off={h:#x} va={hva:#x} len={ln} -> {v:#x}')

          package_funcs=[(a,nm) for a,nm in funcs if nm.startswith(package)]
          out=[]
          out.append('PINNED_SHA256=0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb')
          out.append(f'MOVE_SPEED={MOVE_SPEED:#x} {move_name}')
          out.append(f'PACKAGE={package}')
          out.append(f'PACKAGE_FUNCTIONS={len(package_funcs)}')
          out.append('')
          out.append('===== MOVEMENT BUFF STRING LOCATIONS =====')
          out.extend(loc_lines)
          out.append('')
          out.append('===== PACKAGE XREF CONTEXTS =====')

          total_xrefs=0
          for a,nm in package_funcs:
              ii=insns(a)
              if not ii: continue
              hits=[]
              for idx,ins in enumerate(ii):
                  for op in ins.operands:
                      if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                          target=ins.address+ins.size+op.mem.disp
                          labels=[label for label,tgts in targets_by_label.items() if target in tgts]
                          if labels:
                              hits.append((idx,target,labels))
              if not hits: continue
              total_xrefs += len(hits)
              out.append(f'----- {a:#x}-{fend(a):#x} {nm} -----')
              emitted=set()
              for idx,target,labels in hits:
                  lo=max(0,idx-36); hi=min(len(ii),idx+37)
                  out.append(f'XREF {ii[idx].address:#x} -> {target:#x} labels={",".join(labels)}')
                  for j in range(lo,hi):
                      ins=ii[j]
                      key=ins.address
                      if key in emitted: continue
                      emitted.add(key)
                      ann=[]
                      for op in ins.operands:
                          if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                              t=ins.address+ins.size+op.mem.disp
                              lbl=[label for label,tgts in targets_by_label.items() if t in tgts]
                              if lbl: ann.append('BUFF=' + ','.join(lbl))
                      out.append(f'{ins.address:#x}: {ins.mnemonic:9s} {ins.op_str}' + ((' ; ' + ' | '.join(ann)) if ann else ''))

          out.append('')
          out.append(f'TOTAL_PACKAGE_XREFS={total_xrefs}')
          if total_xrefs == 0:
              raise SystemExit('no movement-buff string/header xrefs found in detector package')

          Path('buff-id-evidence/summary.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out[:12000]))

      - name: Upload buff ID evidence
        uses: actions/upload-artifact@v4
        with:
          name: revolution-v09c-buff-id-map
          path: buff-id-evidence/
          if-no-files-found: error
