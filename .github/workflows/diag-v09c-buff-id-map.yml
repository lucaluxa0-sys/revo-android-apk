name: Trace modern v0.9c BuffType ID map

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diag-v09c-buff-id-map.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download exact pinned Revolution binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache buff-id-evidence
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe' | sha256sum -c -

      - name: Install parsers
        run: python3 -m pip install --disable-pip-version-check pefile capstone

      - name: Prove BuffType keys and MoveSpeed interface slot
        shell: python
        run: |
          from pathlib import Path
          import bisect, struct
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64

          EXE = Path('.cache/RevolutionMacro.exe')
          SHA = '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb'
          MOVE_SPEED = 0x140c1c820
          WALK = 0x140c61480
          BUFF_ITAB = 0x1425ef060
          BUFF_INTERFACE_TYPE = 0x141e91c40

          raw = EXE.read_bytes()
          pe = pefile.PE(str(EXE), fast_load=False)
          base = int(pe.OPTIONAL_HEADER.ImageBase)
          image_size = int(pe.OPTIONAL_HEADER.SizeOfImage)
          sections = [
              dict(raw=int(s.PointerToRawData), size=int(s.SizeOfRawData),
                   rva=int(s.VirtualAddress), data=s.get_data())
              for s in pe.sections
          ]

          def va2off(va):
              rva = va - base
              if 0 <= rva < int(pe.OPTIONAL_HEADER.SizeOfHeaders):
                  return rva
              for s in sections:
                  if s['rva'] <= rva < s['rva'] + s['size']:
                      return s['raw'] + rva - s['rva']
              return None

          def qva(va):
              off = va2off(va)
              if off is None or off + 8 > len(raw):
                  raise SystemExit(f'unmapped qword VA {va:#x}')
              return struct.unpack_from('<Q', raw, off)[0]

          def u32(o): return struct.unpack_from('<I', raw, o)[0]
          def i32(o): return struct.unpack_from('<i', raw, o)[0]

          def cstr(va, limit=800):
              off = va2off(va)
              if off is None: return None
              z = raw.find(b'\0', off, min(len(raw), off + limit))
              z = min(len(raw), off + limit) if z < 0 else z
              try: return raw[off:z].decode('utf-8')
              except Exception: return None

          def go_string(header_va):
              ptr = qva(header_va)
              ln = qva(header_va + 8)
              off = va2off(ptr)
              if off is None or ln > 256 or off + ln > len(raw):
                  return ptr, ln, None
              try: text = raw[off:off+ln].decode('utf-8')
              except Exception: text = None
              return ptr, ln, text

          # Recover Go function table using the same hotfix3 moduledata anchor
          # already validated by the earlier diagnostics.
          minpc = 0x1400014a0
          best = None
          p = 0
          while True:
              h = raw.find(struct.pack('<Q', minpc), p)
              if h < 0: break
              md = h - 160
              if md >= 0:
                  ft=struct.unpack_from('<Q',raw,md+128)[0]
                  n=struct.unpack_from('<Q',raw,md+136)[0]
                  cap=struct.unpack_from('<Q',raw,md+144)[0]
                  text=struct.unpack_from('<Q',raw,md+176)[0]
                  fn=struct.unpack_from('<Q',raw,md+8)[0]
                  pcln=struct.unpack_from('<Q',raw,md+104)[0]
                  score=sum([text==minpc, 1000<n<500000, cap>=n,
                             va2off(ft)is not None, va2off(fn)is not None,
                             va2off(pcln)is not None])
                  if best is None or score > best[0]:
                      best=(score,(ft,n,text,fn,pcln))
              p=h+1
          if not best or best[0] < 5:
              raise SystemExit('moduledata recovery failed')

          ft,n,text,fn,pcln=best[1]
          fo=va2off(ft); po=va2off(pcln)
          funcs=[]
          for i in range(int(n)-1):
              ent=u32(fo+i*8); funcoff=u32(fo+i*8+4); fm=po+funcoff
              if not (0 <= fm+8 < len(raw)): continue
              nm=cstr(fn+i32(fm+4)); addr=text+ent
              if nm and base <= addr < base+image_size:
                  funcs.append((addr,nm))
          funcs.sort()
          names=dict(funcs)
          addrs=[a for a,_ in funcs]
          if not names.get(MOVE_SPEED,'').endswith('.MoveSpeed'):
              raise SystemExit(f'MoveSpeed address drift: {names.get(MOVE_SPEED)!r}')

          out=[]
          out.append(f'PINNED_SHA256={SHA}')
          out.append(f'MOVE_SPEED={MOVE_SPEED:#x} {names[MOVE_SPEED]}')
          out.append('')
          out.append('===== STATIC BUFF METADATA ENTRY KEYS =====')

          # Previous pinned-binary xref evidence proved these are 0x88-byte
          # static {key, elem} records. Name is elem+0x40 => entry+0x48;
          # ImagePresent is elem+0x70 => entry+0x78.
          entries = [
              ('Haste',          0x1425f58d0, 'Haste',          None),
              ('HastePlus',      0x1425f5958, 'HastePlus',      None),
              ('HasteCoconut',   0x142643ef8, 'HasteCoconut',   None),
              ('BlackBear',      0x142643f80, 'BlackBear',      'black_bear'),
              ('BrownBear',      0x142644008, 'BrownBear',      'brown_bear'),
              ('GummyBear',      0x142644090, 'GummyBear',      'gummy_bear'),
              ('MotherBear',     0x142644118, 'MotherBear',     'mother_bear'),
              ('PandaBear',      0x1426441a0, 'PandaBear',      'panda_bear'),
              ('PolarBear',      0x142644228, 'PolarBear',      'polar_bear'),
              ('ScienceBear',    0x1426442b0, 'ScienceBear',    'science_bear'),
              ('Oil',            0x142644338, None,             'oil'),
              ('SuperSmoothie',  0x1426443c0, 'SuperSmoothie',  'smoothie'),
          ]

          key_by_label={}
          for label,entry,name_expected,image_expected in entries:
              key=qva(entry)
              _,_,name=go_string(entry+0x48)
              _,_,image=go_string(entry+0x78)
              if name_expected is not None and name != name_expected:
                  raise SystemExit(f'{label} name header drift: entry={entry:#x} got={name!r}')
              if image_expected is not None and image != image_expected:
                  raise SystemExit(f'{label} image header drift: entry={entry:#x} got={image!r}')
              key_by_label[label]=key
              out.append(f'{label}: key={key} entry={entry:#x} name={name!r} image={image!r}')

          expected = {
              'Haste':0, 'HastePlus':1, 'HasteCoconut':2,
              'BlackBear':3, 'MotherBear':4, 'PandaBear':5,
              'PolarBear':6, 'BrownBear':7, 'ScienceBear':9,
              'GummyBear':10, 'Oil':11, 'SuperSmoothie':12,
          }
          if key_by_label != expected:
              raise SystemExit(f'BuffType mapping mismatch: got={key_by_label!r} expected={expected!r}')

          out.append('')
          out.append('===== common.BuffDetector ITAB =====')
          inter=qva(BUFF_ITAB)
          concrete=qva(BUFF_ITAB+8)
          out.append(f'itab={BUFF_ITAB:#x} inter={inter:#x} concrete_type={concrete:#x}')
          if inter != BUFF_INTERFACE_TYPE:
              raise SystemExit(f'BuffDetector interface type drift: {inter:#x}')
          for i in range(9):
              fnva=qva(BUFF_ITAB+0x18+(i*8))
              out.append(f'fun[{i}] off={0x18+i*8:#x} addr={fnva:#x} name={names.get(fnva,"<unresolved>")}')
          move_slot=qva(BUFF_ITAB+0x28)
          if move_slot != MOVE_SPEED:
              raise SystemExit(f'BuffDetector fun[2]/+0x28 drift: {move_slot:#x}')
          out.append('PROVED MoveSpeed interface slot = fun[2] = itab+0x28')

          out.append('')
          out.append('===== Walk indirect MoveSpeed call context =====')
          def fend(a):
              i=bisect.bisect_left(addrs,a)
              return addrs[i+1] if i+1 < len(addrs) else a+0x10000
          start=va2off(WALK); end=va2off(fend(WALK))
          if start is None or end is None:
              raise SystemExit('Walk mapping failed')
          mdx=Cs(CS_ARCH_X86,CS_MODE_64)
          for ins in mdx.disasm(raw[start:end],WALK):
              if 0x140c61570 <= ins.address <= 0x140c61591:
                  out.append(f'{ins.address:#x}: {ins.mnemonic:8s} {ins.op_str}')

          Path('buff-id-evidence/summary.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))

      - name: Upload buff ID evidence
        uses: actions/upload-artifact@v4
        with:
          name: revolution-v09c-buff-id-map
          path: buff-id-evidence/
          if-no-files-found: error
