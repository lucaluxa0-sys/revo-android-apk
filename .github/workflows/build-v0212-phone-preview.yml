name: Build Revolution Android v0.2.12 phone preview APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v0212-phone-preview.yml'
      - 'tools/patch-native-v0211-bee-swarm-launch.py'
      - 'tools/patch-native-v0212-hive-routing.py'
      - 'tools/patch-native-v0212-field-routing.py'
      - 'tools/patch-native-v0212-template-contrast.py'
      - 'tools/patch-native-v0212-template-core.py'
      - 'tools/patch-native-v0212-joystick-hold.py'
      - 'tools/patch-native-v0212-joystick-callback-thread.py'
      - 'tools/patch-native-v0212-joystick-prequeue-continuation.py'
      - 'tools/patch-native-v0212-movement-speed.py'
      - 'tools/patch-revo-frontend-v028.py'
      - 'tools/recover-vite-pngs.js'
      - 'revo-android/extract_revo_frontend.py'
      - 'patches/android-wails-shim-v0.2.4.js'
      - 'patches/android-backend-v0.2.5.js'
      - 'patches/android-backend-v0.2.6.js'
      - 'patches/android-backend-v0.2.8.js'
      - 'patches/android-backend-v0.2.8.1.js'
      - 'patches/android-backend-v0.2.8.2.js'
      - 'patches/android-backend-v0.2.9.js'
      - 'patches/android-backend-v0.2.10.js'
      - '.ci/source.part00'
      - '.ci/source.part01'
      - '.ci/source.part02'
      - '.ci/source.part03'

permissions:
  contents: read

jobs:
  build-phone-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3

      - name: Restore production source and apply current v0.2.12 native patches
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          cat .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03 | base64 --decode > /tmp/source.zip
          unzip -q /tmp/source.zip
          python3 tools/patch-native-v0211-bee-swarm-launch.py
          python3 tools/patch-native-v0212-hive-routing.py
          python3 tools/patch-native-v0212-field-routing.py
          python3 tools/patch-native-v0212-template-contrast.py
          python3 -m py_compile \
            tools/patch-native-v0211-bee-swarm-launch.py \
            tools/patch-native-v0212-hive-routing.py \
            tools/patch-native-v0212-field-routing.py \
            tools/patch-native-v0212-template-contrast.py \
            tools/patch-native-v0212-template-core.py \
            tools/patch-native-v0212-joystick-hold.py \
            tools/patch-native-v0212-joystick-callback-thread.py \
            tools/patch-native-v0212-joystick-prequeue-continuation.py \
            tools/patch-native-v0212-movement-speed.py
          grep -q 'roblox://placeId=1537690962' revo-android/app/src/main/java/com/revolution/android/AndroidRevoBridge.java
          grep -q 'class RevoPreGatherRouter' revo-android/app/src/main/java/com/revolution/android/RevoPreGatherRouter.java
          grep -q 'FIELD_ROUTE_READY route=cannon->pinetree-br->pinetree-center' revo-android/app/src/main/java/com/revolution/android/RevoPreGatherRouter.java
          grep -q 'c0a499ba9512b4282bc3f59bdf9daacedd6841b1d7a2008f90075e3d0c07859f' revo-android/app/src/main/java/com/revolution/android/RevoPreGatherRouter.java
          grep -q 'CAPTURE_CALLBACK_TIMEOUT_MS' revo-android/app/src/main/java/com/revolution/android/MacroEngine.java
          grep -q 'joystickWithTimedTaps' revo-android/app/src/main/java/com/revolution/android/RevoAccessibilityService.java
          grep -q 'continuationQueue=prequeued-before-acquire-completion-v1' revo-android/app/src/main/java/com/revolution/android/RevoAccessibilityService.java
          grep -q 'callbackHandler=dedicated-handler-thread-v1' revo-android/app/src/main/java/com/revolution/android/RevoAccessibilityService.java
          grep -q 'Exact command geometry from desktop patterns/gather/e_lol.lua.' revo-android/app/src/main/java/com/revolution/android/RevoGatherAdapter.java
          grep -q 'getWindows()' revo-android/app/src/main/java/com/revolution/android/RevoAccessibilityService.java
          grep -q 'pkg=%s • route=%s' revo-android/app/src/main/java/com/revolution/android/MacroEngine.java
          grep -q 'class RevoMovementSpeed' revo-android/app/src/main/java/com/revolution/android/RevoMovementSpeed.java
          # Production timing must use the active-preset MoveSpeed path, never the CI-only 12 ms/stud accelerator.
          ! grep -R "msPerStud.*12" revo-android/app/src/main/java/com/revolution/android revo-android/app/src/main/assets 2>/dev/null

      - name: Restore exact Revolution v0.9c-hotfix3 frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache revo-android/app/src/main/assets/www /tmp/hashprobe
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo "0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe" | sha256sum -c -
          python3 revo-android/extract_revo_frontend.py .cache/RevolutionMacro.exe revo-android/app/src/main/assets/www
          cp revo-android/app/src/main/assets/www/index.android.html revo-android/app/src/main/assets/www/index.html
          npm install --silent --prefix /tmp/hashprobe rollup@4.50.0
          node tools/recover-vite-pngs.js .cache/RevolutionMacro.exe revo-android/app/src/main/assets/www /tmp/hashprobe/node_modules/rollup/dist/native.js
          python3 tools/patch-revo-frontend-v028.py "$(find revo-android/app/src/main/assets/www/assets -maxdepth 1 -name 'index-*.js' | head -n1)"
          python3 -c "import json; from pathlib import Path; root=Path('revo-android/app/src/main/assets/www'); m=json.loads((root/'revo-png-manifest.json').read_text()); assert m['count']==113; assert all((root/'assets'/x).is_file() for x in m['assets'])"

      - name: Assemble complete Android runtime without CI timing instrumentation
        shell: bash
        run: |
          set -euo pipefail
          cat patches/android-wails-shim-v0.2.4.js \
              patches/android-backend-v0.2.5.js \
              patches/android-backend-v0.2.6.js \
              patches/android-backend-v0.2.8.js \
              patches/android-backend-v0.2.8.1.js \
              patches/android-backend-v0.2.8.2.js \
              patches/android-backend-v0.2.9.js \
              patches/android-backend-v0.2.10.js \
              > revo-android/app/src/main/assets/www/android-wails-shim.js
          SHIM=revo-android/app/src/main/assets/www/android-wails-shim.js
          node --check "$SHIM"
          grep -q "'e_lol'" "$SHIM"
          grep -q "const baseMoveSpeed = positiveNumber(player.Concrete('moveSpeed'), 24);" "$SHIM"
          grep -q "msPerStud: localPositiveNumber('revo.android.msPerStud')" "$SHIM"
          grep -Fq "joystickCenterX: localNumber('revo.android.joystickCenterX', 0.09583333333333334)" "$SHIM"
          grep -Fq "joystickCenterY: localNumber('revo.android.joystickCenterY', 0.8657407407407407)" "$SHIM"
          grep -Fq "joystickRadius: localNumber('revo.android.joystickRadius', 0.08333333333333333)" "$SHIM"
          grep -Fq "jumpX: localNumber('revo.android.jumpX', 0.90375)" "$SHIM"
          grep -Fq "jumpY: localNumber('revo.android.jumpY', 0.8648148148148148)" "$SHIM"
          ! grep -q "msPerStud: localNumber('revo.android.msPerStud', 62.5)" "$SHIM"
          ! grep -q "localStorage.setItem('revo.android.msPerStud','12')" "$SHIM"

      - name: Install Revolution icon and stamp preview version
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/revo-icon
          mkdir -p /tmp/revo-icon revo-android/app/src/main/res/drawable-nodpi
          (cd /tmp/revo-icon && 7z x -y "$GITHUB_WORKSPACE/.cache/RevolutionMacro.exe" '.rsrc/0/ICON/1' >/dev/null)
          cp /tmp/revo-icon/.rsrc/0/ICON/1 revo-android/app/src/main/res/drawable-nodpi/revo_icon.png
          file revo-android/app/src/main/res/drawable-nodpi/revo_icon.png | grep -q 'PNG image data, 256 x 256'
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('revo-android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=re.sub(r'\s+android:icon="[^"]*"','',s)
          s=re.sub(r'\s+android:roundIcon="[^"]*"','',s)
          s=s.replace('<application','<application\n        android:icon="@drawable/revo_icon"\n        android:roundIcon="@drawable/revo_icon"',1)
          p.write_text(s)
          p=Path('revo-android/app/build.gradle.kts')
          s=p.read_text()
          s,n=re.subn(r'versionName\s*=\s*"[^"]+"','versionName = "0.2.12-phone-preview"',s,count=1)
          assert n==1
          p.write_text(s)
          PY

      - name: Build and verify phone preview APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p revo-android --stacktrace clean :app:assembleDebug
          APK=revo-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionName='0.2.12-phone-preview'" /tmp/badging.txt
          unzip -p "$APK" assets/www/android-wails-shim.js > /tmp/apk-android-wails-shim.js
          grep -q "'e_lol'" /tmp/apk-android-wails-shim.js
          grep -q "const baseMoveSpeed = positiveNumber(player.Concrete('moveSpeed'), 24);" /tmp/apk-android-wails-shim.js
          grep -q "msPerStud: localPositiveNumber('revo.android.msPerStud')" /tmp/apk-android-wails-shim.js
          grep -Fq "joystickCenterX: localNumber('revo.android.joystickCenterX', 0.09583333333333334)" /tmp/apk-android-wails-shim.js
          grep -Fq "joystickCenterY: localNumber('revo.android.joystickCenterY', 0.8657407407407407)" /tmp/apk-android-wails-shim.js
          grep -Fq "joystickRadius: localNumber('revo.android.joystickRadius', 0.08333333333333333)" /tmp/apk-android-wails-shim.js
          grep -Fq "jumpX: localNumber('revo.android.jumpX', 0.90375)" /tmp/apk-android-wails-shim.js
          grep -Fq "jumpY: localNumber('revo.android.jumpY', 0.8648148148148148)" /tmp/apk-android-wails-shim.js
          ! grep -q "msPerStud: localNumber('revo.android.msPerStud', 62.5)" /tmp/apk-android-wails-shim.js
          SHORT_SHA="${GITHUB_SHA:0:7}"
          OUT=phone-preview-output
          mkdir -p "$OUT"
          NAME="$OUT/RevolutionMacro-Android-v0.2.12-PHONE-PREVIEW-${SHORT_SHA}.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME" | tee "$OUT/SHA256SUMS-v0212-phone-preview.txt"
          printf 'repo=%s\nbuild_commit=%s\nfunctional_gate_run=%s\nfunctional_gate_commit=%s\nfunctional_gate_result=%s\nscreen_physics_gate_run=%s\nscreen_physics_gate_commit=%s\nscreen_physics_result=%s\ndesktop_release=%s\ndesktop_sha256=%s\nproduction_timing_model=%s\nproduction_mobile_controls=%s\nandroid_serializer=%s\nstatus=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            '34624466317' 'b2b25c31be5cd86181e70c230ff5c0648dd17150' 'unchanged retry passed full Android 15 Start -> Hive -> Cannon -> Pine -> real e_lol verifier' \
            '34636250700' 'c97cf6251fc12642f6a15d071a5c6f4fd0074456' 'fresh strict API35 screen-physics passed unchanged verifier; artifact sha256:760e44189594494237979bb67dc6e8a910454e8d9f12093af6f12b8bbc773b46' \
            'nosyliam/revolution-macro v0.9c-hotfix3' \
            '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb' \
            'active-preset MoveSpeed -> recovered desktop effective-speed duration; explicit msPerStud override only' \
            'Samsung landscape defaults: joystick=(0.09583333333333334,0.8657407407407407) radius=0.08333333333333333 jump=(0.90375,0.8648148148148148); localStorage override precedence retained' \
            '35ms acquire + prequeued continued full-deflection segment; serialized jump taps at recovered offsets' \
            'PHONE PREVIEW ONLY - physical Samsung joystick geometry measured and controlled real-BSS joystick swipe moved the character; full real-device hive/route/gather displacement and mobile buff-recognition validation remain pending' \
            > "$OUT/BUILD_PROVENANCE-v0212-phone-preview.txt"

      - name: Upload phone preview APK
        uses: actions/upload-artifact@v4
        with:
          name: RevolutionMacro-Android-v0.2.12-PHONE-PREVIEW-${{ github.sha }}
          path: phone-preview-output/
          if-no-files-found: error
