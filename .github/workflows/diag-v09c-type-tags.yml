name: Map exact v0.9c serialized type tags

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diag-v09c-type-tags.yml'

permissions:
  contents: read

jobs:
  map-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download exact pinned Revolution binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache type-evidence
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe' | sha256sum -c -

      - name: Install PE parser
        run: python3 -m pip install --disable-pip-version-check pefile

      - name: Enumerate Go typelinks and compare runtime type hashes to dataset tags
        shell: python
        run: |
          from pathlib import Path
          import json, struct
          import pefile

          raw=Path('.cache/RevolutionMacro.exe').read_bytes()
          pe=pefile.PE('.cache/RevolutionMacro.exe',fast_load=False)
          base=int(pe.OPTIONAL_HEADER.ImageBase)
          sections=[]
          for s in pe.sections:
              sections.append(dict(raw=int(s.PointerToRawData),size=int(s.SizeOfRawData),rva=int(s.VirtualAddress),data=s.get_data()))
          def va2off(va):
              rva=va-base
              if 0<=rva<int(pe.OPTIONAL_HEADER.SizeOfHeaders): return rva
              for s in sections:
                  if s['rva']<=rva<s['rva']+s['size']: return s['raw']+rva-s['rva']
              return None
          def q(off): return struct.unpack_from('<Q',raw,off)[0]
          def u32(off): return struct.unpack_from('<I',raw,off)[0]
          def i32(off): return struct.unpack_from('<i',raw,off)[0]

          minpc=0x1400014a0; best=None; p=0
          while True:
              hit=raw.find(struct.pack('<Q',minpc),p)
              if hit<0: break
              md=hit-160
              if md>=0 and md+700<len(raw):
                  ftab=q(md+128); n=q(md+136); cap=q(md+144); text=q(md+176)
                  score=sum([text==minpc,1000<n<500000,cap>=n,va2off(ftab) is not None])
                  if best is None or score>best[0]: best=(score,md)
              p=hit+1
          if not best or best[0]<4: raise SystemExit('moduledata recovery failed')
          md=best[1]

          # Exact executable layout: types +296, etypes +304; typelinks is the
          # second slice after the one-word plugin/type-map field, at +360.
          types=q(md+296); etypes=q(md+304)
          typelinks=q(md+360); typelinks_len=q(md+368); typelinks_cap=q(md+376)
          print(f'moduledata={base+md:#x} types={types:#x} etypes={etypes:#x} typelinks={typelinks:#x} len={typelinks_len} cap={typelinks_cap}')
          if not (base<=types<etypes<=base+int(pe.OPTIONAL_HEADER.SizeOfImage)): raise SystemExit('invalid types range')
          if not (0<typelinks_len<100000 and va2off(typelinks) is not None): raise SystemExit('invalid typelinks')

          def read_varint(off):
              x=0; shift=0
              for i in range(10):
                  b=raw[off+i]; x |= (b&0x7f)<<shift
                  if b<0x80:return x,i+1
                  shift+=7
              raise ValueError('varint too long')
          def typename(type_va):
              toff=va2off(type_va)
              if toff is None or toff+48>len(raw): return None
              no=i32(toff+40)
              nva=types+no; noff=va2off(nva)
              if noff is None or noff+2>len(raw): return None
              try: ln,nv=read_varint(noff+1)
              except Exception:return None
              a=noff+1+nv; z=a+ln
              if ln<0 or ln>10000 or z>len(raw):return None
              try:return raw[a:z].decode('utf-8')
              except Exception:return None

          wanted=set('f72810a4 176c5126 e58422da 9e2bcb91 da96a157 7db03b83 cb1f565a 0ee9c651 28c3610e 47991d31 8137973a 1f2d88f0 7bbc28b7 353933e9 4482ce9d f053b163 74b3480f ae5b5109 77eb3498 c111f63b 78722c1c 689a308c 2b53c5da'.split())
          loff=va2off(typelinks)
          rows=[]; matches=[]
          for i in range(int(typelinks_len)):
              rel=i32(loff+i*4); tva=types+rel; off=va2off(tva)
              if off is None or off+48>len(raw):continue
              h=u32(off+16); name=typename(tva)
              if not name:continue
              hx=f'{h:08x}'; rev=struct.pack('<I',h).hex()
              row={'i':i,'rel':rel,'va':f'{tva:#x}','hash':hx,'hash_le_bytes':rev,'name':name,'kind':raw[off+23]&0x1f,'tflag':raw[off+20]}
              rows.append(row)
              if hx in wanted or rev in wanted:
                  row2=dict(row); row2['matched_tag']=hx if hx in wanted else rev; matches.append(row2)
          Path('type-evidence/all-types.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
          Path('type-evidence/tag-hash-matches.json').write_text(json.dumps(matches,indent=2),encoding='utf-8')
          interesting=[r for r in rows if any(k in r['name'].lower() for k in ['revo_', 'revolution/lua', 'lua.', 'ast.', 'expr', 'stmt', 'statement', 'call', 'number', 'string'])]
          Path('type-evidence/interesting-types.json').write_text(json.dumps(interesting,indent=2),encoding='utf-8')
          print('types decoded',len(rows),'tag hash matches',len(matches),'interesting',len(interesting))
          print('===== TAG HASH MATCHES =====')
          for r in matches: print(json.dumps(r,sort_keys=True))
          print('===== REVOLUTION/LUA TYPES (first 1200) =====')
          for r in interesting[:1200]: print(json.dumps(r,sort_keys=True))

      - name: Upload type-tag evidence
        uses: actions/upload-artifact@v4
        with:
          name: revolution-v09c-type-tags
          path: type-evidence/
          if-no-files-found: error
