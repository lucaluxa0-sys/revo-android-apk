name: Test Revo Android v0.2.12 physical preflight

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/test-v0212-physical-preflight.yml'
      - '.github/workflows/physical-samsung-remote.yml'
      - 'tools/revo-phone-preflight.py'
      - 'tools/revo-phone-agent-client.py'

permissions:
  contents: read

jobs:
  physical-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify fail-closed physical preflight matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/revo-phone-preflight.py tools/revo-phone-agent-client.py
          python3 tools/revo-phone-preflight.py --self-test
          grep -q 'python3 tools/revo-phone-preflight.py' .github/workflows/physical-samsung-remote.yml
          grep -q 'status-before.json' .github/workflows/physical-samsung-remote.yml
