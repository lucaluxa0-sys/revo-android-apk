name: Test Revo Android in emulator

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'patches/**'
      - '.github/workflows/test-android-emulator.yml'

permissions:
  contents: read

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Android source
        shell: bash
        run: |
          cat .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03 | base64 --decode > /tmp/revo-android-source.zip
          unzip -q /tmp/revo-android-source.zip
          test -f revo-android/app/build.gradle.kts

      - name: Download exact Revolution Macro release
        shell: bash
        run: |
          mkdir -p .cache
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo "0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe" | sha256sum -c -

      - name: Extract Revo frontend and apply v0.2.3 runtime fix
        shell: bash
        run: |
          mkdir -p revo-android/app/src/main/assets/www
          python3 revo-android/extract_revo_frontend.py .cache/RevolutionMacro.exe revo-android/app/src/main/assets/www
          cp revo-android/app/src/main/assets/www/index.android.html revo-android/app/src/main/assets/www/index.html
          cp patches/android-wails-shim-v0.2.3.js revo-android/app/src/main/assets/www/android-wails-shim.js

      - name: Add WebView-native diagnostic probes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('revo-android/app/src/main/java/com/revolution/android/MainActivity.java')
          s = p.read_text()
          s = s.replace('import android.webkit.WebChromeClient;', 'import android.webkit.WebChromeClient;\nimport android.webkit.ConsoleMessage;\nimport android.util.Log;')
          s = s.replace(
              'web.setWebChromeClient(new WebChromeClient());',
              '''WebView.setWebContentsDebuggingEnabled(true);\n        web.setWebChromeClient(new WebChromeClient() {\n            @Override public boolean onConsoleMessage(ConsoleMessage cm) {\n                Log.e("RevoWeb", cm.message() + " @" + cm.sourceId() + ":" + cm.lineNumber());\n                return true;\n            }\n        });''')
          s = s.replace(
              'web.loadUrl("https://revo.local/index.android.html");',
              '''web.loadUrl("https://revo.local/index.android.html");\n        Handler probeHandler = new Handler(Looper.getMainLooper());\n        probeHandler.postDelayed(() -> {\n            if (web == null) return;\n            web.evaluateJavascript(\n                "JSON.stringify({ready:document.readyState,body:(document.body&&document.body.innerText||'').slice(0,1600),runtime:typeof window.runtime,dataRuntime:typeof window.dataRuntime,go:typeof window.go})",\n                value -> Log.e("RevoProbe", String.valueOf(value)));\n        }, 12000);\n        probeHandler.postDelayed(() -> {\n            if (web == null) return;\n            web.evaluateJavascript(\n                "(()=>{const b=[...document.querySelectorAll('button')].find(x=>(x.innerText||x.textContent||'').trim()==='Disable');if(!b)return 'not-found';b.click();return 'clicked';})()",\n                value -> Log.e("RevoDismiss", String.valueOf(value)));\n        }, 14000);\n        probeHandler.postDelayed(() -> {\n            if (web == null) return;\n            web.evaluateJavascript(\n                "JSON.stringify({body:(document.body&&document.body.innerText||'').slice(0,1600),buttons:[...document.querySelectorAll('button')].map(x=>(x.innerText||x.textContent||'').trim()).filter(Boolean).slice(0,30)})",\n                value -> Log.e("RevoMainProbe", String.valueOf(value)));\n        }, 18000);''')
          p.write_text(s)
          PY

      - name: Build diagnostic APK
        shell: bash
        run: gradle -p revo-android --stacktrace :app:assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot emulator and test WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            mkdir -p emulator-artifacts
            adb install -r revo-android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.revolution.android || true
            adb shell am start -W -n com.revolution.android/.MainActivity
            sleep 22
            adb exec-out screencap -p > emulator-artifacts/revo-main-screen.png
            adb logcat -d -v time > emulator-artifacts/logcat.txt
            grep -E 'RevoWeb|RevoProbe|RevoDismiss|RevoMainProbe|android-runtime|preload|startup' emulator-artifacts/logcat.txt > emulator-artifacts/revo-log.txt || true
            cat emulator-artifacts/revo-log.txt

            grep -q '\[android-runtime\] frontend runtime ready; sending preload' emulator-artifacts/logcat.txt
            grep 'RevoProbe' emulator-artifacts/logcat.txt | grep -q 'Gather'
            grep 'RevoProbe' emulator-artifacts/logcat.txt | grep -q 'Start'
            if grep 'RevoProbe' emulator-artifacts/logcat.txt | grep -q 'Starting Revolution Macro'; then
              echo 'FAIL: startup overlay still visible'
              exit 1
            fi
            grep 'RevoDismiss' emulator-artifacts/logcat.txt | grep -q 'clicked'
            grep 'RevoMainProbe' emulator-artifacts/logcat.txt | grep -q 'Gather'
            grep 'RevoMainProbe' emulator-artifacts/logcat.txt | grep -q 'Start'
            if grep 'RevoMainProbe' emulator-artifacts/logcat.txt | grep -q 'Starting Revolution Macro'; then
              echo 'FAIL: startup overlay returned'
              exit 1
            fi
            echo 'PASS: Revo Android reached interactive WebView UI and accepted first-run interaction'

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revo-android-emulator-evidence
          path: emulator-artifacts/
          if-no-files-found: warn
