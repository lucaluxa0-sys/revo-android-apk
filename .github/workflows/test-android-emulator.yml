name: Test Revo Android in emulator

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'patches/**'
      - '.github/workflows/test-android-emulator.yml'

permissions:
  contents: read

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Android source
        shell: bash
        run: |
          cat .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03 | base64 --decode > /tmp/revo-android-source.zip
          unzip -q /tmp/revo-android-source.zip
          test -f revo-android/app/build.gradle.kts

      - name: Download exact Revolution Macro release
        shell: bash
        run: |
          mkdir -p .cache
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo "0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe" | sha256sum -c -

      - name: Extract Revo frontend and apply v0.2.5 runtime/backend
        shell: bash
        run: |
          mkdir -p revo-android/app/src/main/assets/www
          python3 revo-android/extract_revo_frontend.py .cache/RevolutionMacro.exe revo-android/app/src/main/assets/www
          cp revo-android/app/src/main/assets/www/index.android.html revo-android/app/src/main/assets/www/index.html
          cat patches/android-wails-shim-v0.2.4.js \
              patches/android-backend-v0.2.5.js \
              > revo-android/app/src/main/assets/www/android-wails-shim.js

      - name: Add WebView-native diagnostic probes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('revo-android/app/src/main/java/com/revolution/android/MainActivity.java')
          s = p.read_text()
          s = s.replace('import android.webkit.WebChromeClient;', 'import android.webkit.WebChromeClient;\nimport android.webkit.ConsoleMessage;\nimport android.util.Log;')
          s = s.replace(
              'web.setWebChromeClient(new WebChromeClient());',
              '''WebView.setWebContentsDebuggingEnabled(true);\n        web.setWebChromeClient(new WebChromeClient() {\n            @Override public boolean onConsoleMessage(ConsoleMessage cm) {\n                Log.e("RevoWeb", cm.message() + " @" + cm.sourceId() + ":" + cm.lineNumber());\n                return true;\n            }\n        });''')
          s = s.replace(
              'web.loadUrl("https://revo.local/index.android.html");',
              '''web.loadUrl("https://revo.local/index.android.html");\n        Handler probeHandler = new Handler(Looper.getMainLooper());\n        probeHandler.postDelayed(() -> {\n            if (web == null) return;\n            web.evaluateJavascript(\n                "JSON.stringify({ready:document.readyState,body:(document.body&&document.body.innerText||'').slice(0,1600),runtime:typeof window.runtime,dataRuntime:typeof window.dataRuntime,go:typeof window.go,backend:window.RevoAndroidDebug&&window.RevoAndroidDebug.backendVersion})",\n                value -> Log.e("RevoProbe", String.valueOf(value)));\n        }, 12000);\n        probeHandler.postDelayed(() -> {\n            if (web == null) return;\n            web.evaluateJavascript(\n                "(()=>{const b=[...document.querySelectorAll('button')].find(x=>(x.innerText||x.textContent||'').trim()==='Disable');if(!b)return 'not-found';b.click();return 'clicked';})()",\n                value -> Log.e("RevoDismiss", String.valueOf(value)));\n        }, 14000);\n        probeHandler.postDelayed(() -> {\n            if (web == null) return;\n            web.evaluateJavascript(\n                "JSON.stringify({body:(document.body&&document.body.innerText||'').slice(0,1600),buttons:[...document.querySelectorAll('button')].map(x=>(x.innerText||x.textContent||'').trim()).filter(Boolean).slice(0,30)})",\n                value -> Log.e("RevoMainProbe", String.valueOf(value)));\n        }, 18000);\n        probeHandler.postDelayed(() -> {\n            if (web == null) return;\n            web.evaluateJavascript(\n                "(()=>{try{const rt=window.dataRuntime;if(!rt)return JSON.stringify({error:'no-dataRuntime'});const p=rt.presetObject('Default');const phase=localStorage.getItem('__revo_v024_probe_written');if(!phase){p.Set('androidPersistProbe','persist-v024');localStorage.setItem('__revo_v024_probe_written','1');return JSON.stringify({phase:'write',value:p.Concrete('androidPersistProbe'),disconnected:rt.disconnected});}return JSON.stringify({phase:'reload',value:p.Concrete('androidPersistProbe'),disconnected:rt.disconnected,persistedOps:(window.RevoAndroidDebug&&window.RevoAndroidDebug.persistedOps?window.RevoAndroidDebug.persistedOps().length:-1)});}catch(e){return JSON.stringify({error:String(e),stack:e&&e.stack});}})()",\n                value -> Log.e("RevoPersistenceProbe", String.valueOf(value)));\n        }, 19000);\n        probeHandler.postDelayed(() -> {\n            if (web == null) return;\n            web.evaluateJavascript(\n                "(()=>{try{const rt=window.dataRuntime,m=window.go&&window.go.cmd&&window.go.cmd.Macro;if(!rt||!m)return JSON.stringify({error:'missing-runtime-or-macro'});const phase=localStorage.getItem('__revo_v025_crud_written');if(!phase){m.CreatePreset('Android CRUD Source');const src=rt.presetObject('Android CRUD Source');src.Set('crudProbe','copied-v025');src.Object('nested').Set('flag',true);m.DuplicatePreset('Android CRUD Source','Android CRUD Copy');m.RenamePreset('Android CRUD Copy','Android CRUD Renamed');m.SetAccountPreset('Default','Android CRUD Renamed');m.DeletePreset('Android CRUD Source');localStorage.setItem('__revo_v025_crud_written','1');}const dst=rt.presetObject('Android CRUD Renamed');return JSON.stringify({phase:phase?'reload':'write',backend:window.RevoAndroidDebug&&window.RevoAndroidDebug.backendVersion,presets:window.RevoAndroidDebug&&window.RevoAndroidDebug.listPresets?window.RevoAndroidDebug.listPresets():[],defaultPreset:rt.defaultPreset,activePreset:rt.preset,probe:dst.Concrete('crudProbe'),nested:dst.Object('nested').Concrete('flag'),disconnected:rt.disconnected});}catch(e){return JSON.stringify({error:String(e),stack:e&&e.stack});}})()",\n                value -> Log.e("RevoCrudProbe", String.valueOf(value)));\n        }, 21000);\n        probeHandler.postDelayed(() -> {\n            if (web == null) return;\n            web.evaluateJavascript(\n                "(()=>{try{const rt=window.dataRuntime;const p=rt.presetObject('Default');return JSON.stringify({value:p.Concrete('androidPersistProbe'),disconnected:rt.disconnected,persistedOps:(window.RevoAndroidDebug&&window.RevoAndroidDebug.persistedOps?window.RevoAndroidDebug.persistedOps().length:-1),backend:window.RevoAndroidDebug&&window.RevoAndroidDebug.backendVersion});}catch(e){return JSON.stringify({error:String(e)});}})()",\n                value -> Log.e("RevoAckProbe", String.valueOf(value)));\n        }, 27000);''')
          p.write_text(s)
          PY

      - name: Build diagnostic APK
        shell: bash
        run: gradle -p revo-android --stacktrace :app:assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot emulator and test WebView, persistence, and preset backend
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            mkdir -p emulator-artifacts
            adb install -r revo-android/app/build/outputs/apk/debug/app-debug.apk

            # First boot: write normal settings and exercise Revo preset CRUD/default assignment.
            adb logcat -c
            adb shell am force-stop com.revolution.android || true
            adb shell am start -W -n com.revolution.android/.MainActivity
            sleep 31
            adb exec-out screencap -p > emulator-artifacts/revo-main-screen-first.png
            adb logcat -d -v time > emulator-artifacts/logcat-first.txt
            grep -E 'RevoWeb|RevoProbe|RevoDismiss|RevoMainProbe|RevoPersistenceProbe|RevoCrudProbe|RevoAckProbe|android-runtime|android-backend|preload|startup' emulator-artifacts/logcat-first.txt > emulator-artifacts/revo-log-first.txt || true
            cat emulator-artifacts/revo-log-first.txt

            grep -q '\[android-runtime\] frontend runtime ready; sending preload' emulator-artifacts/logcat-first.txt
            grep -q '\[android-backend\] v0.2.5 preset/account backend installed' emulator-artifacts/logcat-first.txt
            grep 'RevoProbe' emulator-artifacts/logcat-first.txt | grep -q 'Gather'
            grep 'RevoProbe' emulator-artifacts/logcat-first.txt | grep -q 'Start'
            grep 'RevoProbe' emulator-artifacts/logcat-first.txt | grep -q '0.2.5'
            grep 'RevoPersistenceProbe' emulator-artifacts/logcat-first.txt | grep -q 'persist-v024'
            grep 'RevoAckProbe' emulator-artifacts/logcat-first.txt | grep -q '\\"disconnected\\":false'
            test "$(grep 'RevoAckProbe' emulator-artifacts/logcat-first.txt | grep -c 'Connecting to Backend' || true)" -eq 0

            grep 'RevoCrudProbe' emulator-artifacts/logcat-first.txt | grep -q '\\"phase\\":\\"write\\"'
            grep 'RevoCrudProbe' emulator-artifacts/logcat-first.txt | grep -q 'Android CRUD Renamed'
            grep 'RevoCrudProbe' emulator-artifacts/logcat-first.txt | grep -q 'copied-v025'
            grep 'RevoCrudProbe' emulator-artifacts/logcat-first.txt | grep -q '\\"nested\\":true'
            grep 'RevoCrudProbe' emulator-artifacts/logcat-first.txt | grep -q '\\"defaultPreset\\":\\"Android CRUD Renamed\\"'
            grep 'RevoCrudProbe' emulator-artifacts/logcat-first.txt | grep -q '\\"activePreset\\":\\"Android CRUD Renamed\\"'
            grep 'RevoCrudProbe' emulator-artifacts/logcat-first.txt | grep -q '\\"disconnected\\":false'
            test "$(grep 'RevoCrudProbe' emulator-artifacts/logcat-first.txt | grep -c 'Android CRUD Source' || true)" -eq 0
            test "$(grep 'RevoCrudProbe' emulator-artifacts/logcat-first.txt | grep -c 'Android CRUD Copy' || true)" -eq 0
            grep '\[android-runtime\] persisted runtime ops=' emulator-artifacts/logcat-first.txt

            # Second boot: all preset structure and the chosen default must come back from storage.
            adb logcat -c
            adb shell am force-stop com.revolution.android || true
            adb shell am start -W -n com.revolution.android/.MainActivity
            sleep 31
            adb exec-out screencap -p > emulator-artifacts/revo-main-screen-reload.png
            adb logcat -d -v time > emulator-artifacts/logcat-reload.txt
            grep -E 'RevoWeb|RevoPersistenceProbe|RevoCrudProbe|RevoAckProbe|android-runtime|android-backend|preload|startup' emulator-artifacts/logcat-reload.txt > emulator-artifacts/revo-log-reload.txt || true
            cat emulator-artifacts/revo-log-reload.txt

            grep '\[android-runtime\] loaded persisted runtime ops=' emulator-artifacts/logcat-reload.txt
            grep 'RevoPersistenceProbe' emulator-artifacts/logcat-reload.txt | grep -q '\\"phase\\":\\"reload\\"'
            grep 'RevoPersistenceProbe' emulator-artifacts/logcat-reload.txt | grep -q 'persist-v024'
            grep 'RevoCrudProbe' emulator-artifacts/logcat-reload.txt | grep -q '\\"phase\\":\\"reload\\"'
            grep 'RevoCrudProbe' emulator-artifacts/logcat-reload.txt | grep -q 'Android CRUD Renamed'
            grep 'RevoCrudProbe' emulator-artifacts/logcat-reload.txt | grep -q 'copied-v025'
            grep 'RevoCrudProbe' emulator-artifacts/logcat-reload.txt | grep -q '\\"nested\\":true'
            grep 'RevoCrudProbe' emulator-artifacts/logcat-reload.txt | grep -q '\\"defaultPreset\\":\\"Android CRUD Renamed\\"'
            grep 'RevoCrudProbe' emulator-artifacts/logcat-reload.txt | grep -q '\\"activePreset\\":\\"Android CRUD Renamed\\"'
            grep 'RevoCrudProbe' emulator-artifacts/logcat-reload.txt | grep -q '\\"disconnected\\":false'
            test "$(grep 'RevoCrudProbe' emulator-artifacts/logcat-reload.txt | grep -c 'Android CRUD Source' || true)" -eq 0
            test "$(grep 'RevoCrudProbe' emulator-artifacts/logcat-reload.txt | grep -c 'Android CRUD Copy' || true)" -eq 0
            grep 'RevoAckProbe' emulator-artifacts/logcat-reload.txt | grep -q '\\"disconnected\\":false'
            test "$(grep 'RevoAckProbe' emulator-artifacts/logcat-reload.txt | grep -c 'Connecting to Backend' || true)" -eq 0
            echo 'PASS: Revo Android v0.2.5 persisted settings and completed preset create/duplicate/rename/default/delete across restart'

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revo-android-v0.2.5-emulator-evidence
          path: emulator-artifacts/
          if-no-files-found: warn
