name: Recover v0.9c literal transform closures

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diag-v09c-lit-transform-closures.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Download exact pinned Revolution binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache lit-transform-evidence
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe' | sha256sum -c -

      - name: Recover closure symbols and exact machine code
        shell: bash
        run: |
          set -euo pipefail

          go tool nm -sort address .cache/RevolutionMacro.exe \
            > lit-transform-evidence/go-nm.txt 2> lit-transform-evidence/go-nm.stderr.txt || true
          grep -Ei 'codec|walkStrings|EncodeValue|DecodeValue' \
            lit-transform-evidence/go-nm.txt \
            > lit-transform-evidence/codec-symbols.txt || true

          go tool objdump -s 'codec' .cache/RevolutionMacro.exe \
            > lit-transform-evidence/go-codec-objdump.txt 2> lit-transform-evidence/go-codec-objdump.stderr.txt || true

          objdump -h .cache/RevolutionMacro.exe \
            > lit-transform-evidence/pe-sections.txt
          objdump -d -M intel \
            --start-address=0x140a19d00 --stop-address=0x140a1a300 \
            .cache/RevolutionMacro.exe \
            > lit-transform-evidence/closure-disassembly.txt

          grep -E '140a19e60|140a19ea0|140a19ee0|140a19f20|140a19f|140a1a0|call|xor|rol|ror|imul|add|sub' \
            lit-transform-evidence/closure-disassembly.txt \
            > lit-transform-evidence/closure-key-lines.txt || true

          strings -a -t x -n 4 .cache/RevolutionMacro.exe | \
            grep -Ei 'codec|walkStrings|EncodeValue|DecodeValue|xor|cipher' \
            > lit-transform-evidence/relevant-strings.txt || true

          {
            echo '===== GO NM STDERR ====='
            cat lit-transform-evidence/go-nm.stderr.txt || true
            echo
            echo '===== CODEC SYMBOLS ====='
            cat lit-transform-evidence/codec-symbols.txt || true
            echo
            echo '===== CLOSURE KEY LINES ====='
            cat lit-transform-evidence/closure-key-lines.txt || true
          } | tee lit-transform-evidence/summary.txt

          test -s lit-transform-evidence/closure-disassembly.txt

      - name: Upload literal transform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revolution-v09c-lit-transform-closures
          path: lit-transform-evidence/
          if-no-files-found: error
