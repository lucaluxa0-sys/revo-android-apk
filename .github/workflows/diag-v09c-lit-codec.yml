name: Trace exact v0.9c literal codec

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diag-v09c-lit-codec.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download exact pinned Revolution binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache lit-codec
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe' | sha256sum -c -
      - name: Install parsers
        run: python3 -m pip install --disable-pip-version-check pefile capstone
      - name: Annotate literal codec implementation
        shell: python
        run: |
          from pathlib import Path
          import bisect,json,struct
          import pefile
          from capstone import Cs,CS_ARCH_X86,CS_MODE_64,CS_GRP_CALL
          from capstone.x86 import X86_OP_IMM,X86_OP_MEM,X86_REG_RIP

          raw=Path('.cache/RevolutionMacro.exe').read_bytes(); pe=pefile.PE('.cache/RevolutionMacro.exe',fast_load=False)
          base=int(pe.OPTIONAL_HEADER.ImageBase); image_size=int(pe.OPTIONAL_HEADER.SizeOfImage)
          sections=[]
          for s in pe.sections:
            sections.append(dict(raw=int(s.PointerToRawData),size=int(s.SizeOfRawData),rva=int(s.VirtualAddress),data=s.get_data()))
          def va2off(va):
            rva=va-base
            if 0<=rva<int(pe.OPTIONAL_HEADER.SizeOfHeaders):return rva
            for s in sections:
              if s['rva']<=rva<s['rva']+s['size']:return s['raw']+rva-s['rva']
            return None
          def q(off):return struct.unpack_from('<Q',raw,off)[0]
          def u32(off):return struct.unpack_from('<I',raw,off)[0]
          def i32(off):return struct.unpack_from('<i',raw,off)[0]
          def readva(va,n):
            off=va2off(va); return None if off is None else raw[off:off+n]
          def preview(va,n=96):
            b=readva(va,n)
            if b is None:return None
            return ''.join(chr(x) if 32<=x<127 else '.' for x in b)

          # Rebuild exact function table so direct calls can be named.
          minpc=0x1400014a0;best=None;p=0
          while True:
            hit=raw.find(struct.pack('<Q',minpc),p)
            if hit<0:break
            md=hit-160
            if md>=0 and md+400<len(raw):
              ftab=q(md+128);n=q(md+136);cap=q(md+144);text=q(md+176);fnptr=q(md+8);pcln=q(md+104)
              score=sum([text==minpc,1000<n<500000,cap>=n,va2off(ftab) is not None,va2off(fnptr) is not None,va2off(pcln) is not None])
              if best is None or score>best[0]:best=(score,(md,ftab,n,text,fnptr,pcln))
            p=hit+1
          if not best or best[0]<5:raise SystemExit('moduledata fail')
          md,ftab,n,text,fnptr,pcln=best[1];fo=va2off(ftab);po=va2off(pcln)
          def cstr(va,limit=1000):
            o=va2off(va)
            if o is None:return None
            z=raw.find(b'\0',o,min(len(raw),o+limit));z=o+limit if z<0 else z
            try:return raw[o:z].decode()
            except:return None
          funcs=[]
          for i in range(int(n)-1):
            entry=u32(fo+i*8);funcoff=u32(fo+i*8+4);fm=po+funcoff
            if fm+8>len(raw):continue
            name=cstr(fnptr+i32(fm+4));addr=text+entry
            if name:funcs.append((addr,name))
          funcs.sort(); addrs=[x[0] for x in funcs]; by={a:n for a,n in funcs}
          def containing(va):
            i=bisect.bisect_right(addrs,va)-1
            return funcs[i][1] if i>=0 else None
          mdx=Cs(CS_ARCH_X86,CS_MODE_64);mdx.detail=True
          targets=[
            (0x140a18420,0x140a18560,'litCodec.EncodeValue'),
            (0x140a18560,0x140a18660,'litCodec.DecodeValue'),
            (0x140a18660,0x140a18ea0,'walkStrings'),
            (0x140a18ea0,0x140a19e60,'codec.init.1'),
          ]
          out=[]; refs=[]
          for start,end,label in targets:
            o=va2off(start); data=raw[o:o+(end-start)]
            out.append(f'===== {label} {start:#x}-{end:#x} =====')
            for ins in mdx.disasm(data,start):
              ann=[]
              if ins.group(CS_GRP_CALL) and ins.operands and ins.operands[0].type==X86_OP_IMM:
                t=int(ins.operands[0].imm)&((1<<64)-1); ann.append('CALL='+by.get(t,f'{t:#x}'))
              for op in ins.operands:
                if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                  t=ins.address+ins.size+op.mem.disp
                  if base<=t<base+image_size:
                    b=readva(t,64); rec={'function':label,'insn':f'{ins.address:#x}','target':f'{t:#x}','qword':None,'preview':preview(t,96),'hex':b.hex() if b else None}
                    if b and len(b)>=8:
                      v=struct.unpack_from('<Q',b)[0];rec['qword']=f'{v:#x}'
                      if base<=v<base+image_size:
                        rec['deref_preview']=preview(v,128); bb=readva(v,128);rec['deref_hex']=bb.hex() if bb else None
                    refs.append(rec);ann.append('RIP='+f'{t:#x}')
              out.append(f'{ins.address:#x}: {ins.mnemonic} {ins.op_str}'+((' ; '+' ; '.join(ann)) if ann else ''))
          Path('lit-codec/disassembly.txt').write_text('\n'.join(out),encoding='utf-8')
          Path('lit-codec/rip-refs.json').write_text(json.dumps(refs,indent=2),encoding='utf-8')
          print('\n'.join(out))
          print('===== RIP REFS =====')
          for r in refs:print(json.dumps(r,sort_keys=True))
      - name: Upload literal codec evidence
        uses: actions/upload-artifact@v4
        with:
          name: revolution-v09c-lit-codec
          path: lit-codec/
          if-no-files-found: error
