name: Recover desktop routing xrefs with Capstone

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diag-desktop-routing-capstone-xrefs.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download exact pinned Revolution desktop binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache capstone-routing
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe' | sha256sum -c -

      - name: Install PE/disassembly helpers
        shell: bash
        run: python3 -m pip install --disable-pip-version-check pefile capstone

      - name: Rank code targets nearest high-signal routing literals
        shell: python
        run: |
          from pathlib import Path
          import bisect, json, re
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_MEM, X86_OP_IMM, X86_REG_RIP

          raw = Path('.cache/RevolutionMacro.exe').read_bytes()
          pe = pefile.PE('.cache/RevolutionMacro.exe', fast_load=False)
          base = int(pe.OPTIONAL_HEADER.ImageBase)
          needles = [b'Claimed Hive: %d', b'Travelling To: %s', b'claimhive', b'red-cannon-logged',
                     b'gather.nextField', b'gather.useDipper', b'CurrentGatherField', b'WalkAlign', b'WalkAsync']

          sections=[]
          for s in pe.sections:
              sections.append(dict(name=s.Name.rstrip(b'\0').decode('ascii','replace'),
                  raw=int(s.PointerToRawData), size=int(s.SizeOfRawData), rva=int(s.VirtualAddress),
                  chars=int(s.Characteristics), data=s.get_data()))

          def off_to_rva(off):
              if off < pe.OPTIONAL_HEADER.SizeOfHeaders: return off
              for s in sections:
                  if s['raw'] <= off < s['raw']+s['size']:
                      return s['rva'] + off-s['raw']
              return None
          def rva_to_off(rva):
              if rva < pe.OPTIONAL_HEADER.SizeOfHeaders: return rva
              for s in sections:
                  span=max(s['size'],len(s['data']))
                  if s['rva'] <= rva < s['rva']+span:
                      return s['raw'] + rva-s['rva']
              return None
          def sec_for_rva(rva):
              for s in sections:
                  if s['rva'] <= rva < s['rva']+max(s['size'],len(s['data'])): return s['name']
              return '<none>'

          strings=[]
          for n in needles:
              p=0
              while True:
                  off=raw.find(n,p)
                  if off<0: break
                  rva=off_to_rva(off)
                  if rva is not None: strings.append(dict(text=n.decode(),off=off,rva=rva,va=base+rva,length=len(n)))
                  p=off+1

          funcs=[]
          try:
              for e in pe.DIRECTORY_ENTRY_EXCEPTION:
                  b=int(e.struct.BeginAddress); en=int(e.struct.EndAddress)
                  if b<en: funcs.append((b,en))
          except Exception: pass
          funcs=sorted(set(funcs)); starts=[x[0] for x in funcs]
          def containing(rva):
              i=bisect.bisect_right(starts,rva)-1
              if i>=0 and funcs[i][0] <= rva < funcs[i][1]: return funcs[i]
              return None

          md=Cs(CS_ARCH_X86,CS_MODE_64); md.detail=True
          code=[]
          for s in sections:
              if not s['chars'] & 0x20000000: continue
              for insn in md.disasm(s['data'],base+s['rva']):
                  targets=[]
                  for op in insn.operands:
                      if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                          targets.append(insn.address+insn.size+op.mem.disp)
                      elif op.type==X86_OP_IMM:
                          v=int(op.imm)&((1<<64)-1)
                          if base <= v < base+int(pe.OPTIONAL_HEADER.SizeOfImage): targets.append(v)
                  if targets:
                      code.append(dict(va=insn.address,rva=insn.address-base,mn=insn.mnemonic,op=insn.op_str,targets=targets))

          # For each literal, rank every code reference to mapped data within +/-16 KiB.
          ranked={}
          for st in strings:
              hits=[]
              for ci in code:
                  for target in ci['targets']:
                      d=target-st['va']
                      if abs(d)<=16384:
                          trva=target-base
                          hits.append(dict(distance=d,target_rva=trva,target_section=sec_for_rva(trva),
                              insn_rva=ci['rva'],mnemonic=ci['mn'],op_str=ci['op'],function=containing(ci['rva'])))
              # prefer targets nearest literal, then before/at literal, then stable instruction RVA
              hits.sort(key=lambda h:(abs(h['distance']), 0 if h['distance']<=0 else 1, h['insn_rva']))
              ranked[f"{st['text']}@{st['rva']:x}"]=hits[:80]

          # ASCII neighborhood helps tell whether target points to start of a packed/concatenated string slab.
          def ascii_window(st, radius=512):
              a=max(0,st['off']-radius); b=min(len(raw),st['off']+st['length']+radius)
              chunk=raw[a:b]
              txt=''.join(chr(x) if 32<=x<127 else '.' for x in chunk)
              return dict(file_start=a,literal_offset=st['off']-a,text=txt)

          selected_funcs={}
          for key,hits in ranked.items():
              for h in hits[:12]:
                  if h['function']:
                      selected_funcs[tuple(h['function'])]=True

          # Disassemble complete candidate functions, but cap output.
          def func_bytes(b,en):
              for s in sections:
                  if (s['chars']&0x20000000) and s['rva']<=b<s['rva']+len(s['data']):
                      a=b-s['rva']; z=min(len(s['data']),en-s['rva'])
                      return s['name'],s['data'][a:z],base+b
              return '<none>',b'',base+b

          lines=[f'image_base=0x{base:x}',f'code_instructions_with_targets={len(code)}',f'string_occurrences={len(strings)}']
          for st in strings:
              key=f"{st['text']}@{st['rva']:x}"
              lines += ['',f"===== LITERAL {st['text']!r} rva=0x{st['rva']:x} len={st['length']} ====="]
              w=ascii_window(st,256)
              lines.append(f"ASCII_WINDOW file_start=0x{w['file_start']:x} literal_at=+0x{w['literal_offset']:x}: {w['text']}")
              hits=ranked[key]
              lines.append(f'NEARBY_TARGETS={len(hits)} (top 80 within +/-0x4000)')
              for h in hits:
                  f=h['function']; fs='<none>' if not f else f"0x{f[0]:x}-0x{f[1]:x}"
                  lines.append(f"NEAR distance={h['distance']:+d} target=0x{h['target_rva']:x} sec={h['target_section']} insn=0x{h['insn_rva']:x} {h['mnemonic']} {h['op_str']} func={fs}")

          for (b,en) in sorted(selected_funcs):
              name,data,va=func_bytes(b,en)
              lines += ['',f'===== CANDIDATE FUNCTION 0x{b:x}-0x{en:x} size={en-b} sec={name} =====']
              count=0
              for insn in md.disasm(data,va):
                  lines.append(f"0x{insn.address-base:08x}: {insn.mnemonic:8s} {insn.op_str}")
                  count+=1
                  if count>=1600:
                      lines.append('... truncated ...'); break

          obj={'strings':strings,'ranked':ranked,'selected_functions':[list(k) for k in selected_funcs]}
          Path('capstone-routing/nearest.json').write_text(json.dumps(obj,indent=2),encoding='utf-8')
          Path('capstone-routing/nearest.txt').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[:2200]))

      - name: Upload nearest-xref routing evidence
        uses: actions/upload-artifact@v4
        with:
          name: revolution-desktop-routing-nearest-xrefs
          path: capstone-routing/
          if-no-files-found: error
