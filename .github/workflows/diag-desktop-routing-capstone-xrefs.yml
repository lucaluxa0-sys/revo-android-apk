name: Recover desktop routing xrefs with Capstone

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diag-desktop-routing-capstone-xrefs.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download exact pinned Revolution desktop binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache capstone-routing
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe' | sha256sum -c -

      - name: Install PE/disassembly helpers
        shell: bash
        run: python3 -m pip install --disable-pip-version-check pefile capstone

      - name: Recover RIP-relative routing string references
        shell: python
        run: |
          from pathlib import Path
          import bisect, json, struct
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_MEM, X86_OP_IMM, X86_REG_RIP

          exe = Path('.cache/RevolutionMacro.exe')
          raw = exe.read_bytes()
          pe = pefile.PE(str(exe), fast_load=False)
          image_base = int(pe.OPTIONAL_HEADER.ImageBase)

          needles = [
              b'Claimed Hive: %d',
              b'Travelling To: %s',
              b'claimhive',
              b'red-cannon-logged',
              b'hive-side-check',
              b'red-cannon',
              b'gather.nextField',
              b'gather.useDipper',
              b'PathingFailure',
              b'SpawnedOnHivePad',
              b'CheckForClaimedHive',
              b'HiveClaimMethod',
              b'PreferredHiveSlot',
              b'CurrentGatherField',
              b'WalkAlign',
              b'WalkAsync',
              b'CannonDiscovery',
          ]

          def file_offset_to_rva(off):
              if off < pe.OPTIONAL_HEADER.SizeOfHeaders:
                  return off
              for s in pe.sections:
                  start = int(s.PointerToRawData)
                  end = start + int(s.SizeOfRawData)
                  if start <= off < end:
                      return int(s.VirtualAddress) + (off - start)
              return None

          strings = []
          for needle in needles:
              pos = 0
              while True:
                  off = raw.find(needle, pos)
                  if off < 0: break
                  rva = file_offset_to_rva(off)
                  if rva is not None:
                      strings.append({
                          'text': needle.decode('ascii'),
                          'file_offset': off,
                          'rva': rva,
                          'va': image_base + rva,
                          'length': len(needle),
                      })
                  pos = off + 1

          # Runtime-function ranges from .pdata / PE exception directory.
          funcs = []
          try:
              for e in pe.DIRECTORY_ENTRY_EXCEPTION:
                  b = int(e.struct.BeginAddress)
                  en = int(e.struct.EndAddress)
                  if b < en:
                      funcs.append((b, en))
          except Exception:
              pass
          funcs = sorted(set(funcs))
          func_starts = [x[0] for x in funcs]

          def containing_func(rva):
              if not funcs: return None
              i = bisect.bisect_right(func_starts, rva) - 1
              if i >= 0:
                  b, en = funcs[i]
                  if b <= rva < en: return (b, en)
              return None

          md = Cs(CS_ARCH_X86, CS_MODE_64)
          md.detail = True
          xrefs = []
          instructions = {}
          executable_sections = []
          for s in pe.sections:
              if int(s.Characteristics) & 0x20000000:
                  sec_name = s.Name.rstrip(b'\0').decode('ascii','replace')
                  sec_rva = int(s.VirtualAddress)
                  sec_va = image_base + sec_rva
                  sec_data = s.get_data()
                  executable_sections.append((sec_name, sec_rva, sec_va, sec_data))
                  for insn in md.disasm(sec_data, sec_va):
                      instructions[insn.address] = insn
                      targets = []
                      for op in insn.operands:
                          if op.type == X86_OP_MEM and op.mem.base == X86_REG_RIP:
                              targets.append(insn.address + insn.size + op.mem.disp)
                          elif op.type == X86_OP_IMM:
                              targets.append(int(op.imm) & ((1<<64)-1))
                      if not targets: continue
                      for st in strings:
                          lo = st['va']; hi = lo + st['length']
                          if any(lo <= t < hi for t in targets):
                              rva = insn.address - image_base
                              fr = containing_func(rva)
                              xrefs.append({
                                  'string': st['text'],
                                  'string_rva': st['rva'],
                                  'string_va': st['va'],
                                  'insn_va': insn.address,
                                  'insn_rva': rva,
                                  'mnemonic': insn.mnemonic,
                                  'op_str': insn.op_str,
                                  'function': None if fr is None else {'begin_rva': fr[0], 'end_rva': fr[1], 'size': fr[1]-fr[0]},
                              })

          # Emit targeted disassembly for each unique containing runtime function.
          unique_funcs = {}
          for x in xrefs:
              f = x['function']
              if f:
                  unique_funcs[(f['begin_rva'], f['end_rva'])] = f

          def bytes_for_rva(begin, end):
              for name, sec_rva, sec_va, sec_data in executable_sections:
                  if sec_rva <= begin < sec_rva + len(sec_data):
                      a = begin - sec_rva
                      b = min(len(sec_data), end - sec_rva)
                      return name, sec_data[a:b], image_base + begin
              return None, b'', image_base + begin

          lines = []
          lines.append(f'image_base=0x{image_base:x}')
          lines.append(f'exception_function_ranges={len(funcs)}')
          lines.append(f'string_occurrences={len(strings)}')
          for st in strings:
              lines.append(f"STRING {st['text']!r} file=0x{st['file_offset']:x} rva=0x{st['rva']:x} va=0x{st['va']:x}")
          lines.append(f'xrefs={len(xrefs)}')
          for x in xrefs:
              f = x['function']
              fs = '<none>' if not f else f"0x{f['begin_rva']:x}-0x{f['end_rva']:x} size={f['size']}"
              lines.append(f"XREF {x['string']!r} insn_rva=0x{x['insn_rva']:x} {x['mnemonic']} {x['op_str']} func={fs}")

          for (begin,end), f in sorted(unique_funcs.items()):
              name, data, va = bytes_for_rva(begin,end)
              lines.append('')
              lines.append(f'===== RUNTIME FUNCTION rva=0x{begin:x}-0x{end:x} size={end-begin} section={name} =====')
              refs_here = [x for x in xrefs if x['function'] and x['function']['begin_rva']==begin and x['function']['end_rva']==end]
              lines.append('REF_STRINGS=' + ', '.join(sorted(set(x['string'] for x in refs_here))))
              count=0
              for insn in md.disasm(data, va):
                  marker = '  <XREF>' if any(x['insn_va']==insn.address for x in refs_here) else ''
                  lines.append(f"0x{insn.address-image_base:08x}: {insn.mnemonic:8s} {insn.op_str}{marker}")
                  count += 1
                  if count >= 4000:
                      lines.append('... function disassembly truncated at 4000 instructions ...')
                      break

          Path('capstone-routing/summary.txt').write_text('\n'.join(lines), encoding='utf-8')
          Path('capstone-routing/xrefs.json').write_text(json.dumps({'strings':strings,'xrefs':xrefs},indent=2), encoding='utf-8')
          print('\n'.join(lines[:1200]))

      - name: Upload Capstone routing evidence
        uses: actions/upload-artifact@v4
        with:
          name: revolution-desktop-routing-capstone-xrefs
          path: capstone-routing/
          if-no-files-found: error
