name: Dispatch v0.2.12 hive-cannon gate on Accessibility setup changes

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.ci/enable_revo_accessibility.py'
      - '.github/workflows/dispatch-v0212-hive-cannon-on-a11y.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-v0212-hive-cannon-on-a11y
  cancel-in-progress: false

jobs:
  dispatch-real-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current main through the real API 35 hive-cannon gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run test-v0212-hive-cannon-e2e.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo "Dispatched test-v0212-hive-cannon-e2e.yml at current main."
