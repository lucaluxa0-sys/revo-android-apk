name: Test Revo Android v0.2.11 e_lol end to end v2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/test-v0211-elol-e2e-v2.yml'
      - 'tools/patch-native-v0211-bee-swarm-launch.py'
      - 'tools/instrument-v0211-elol-e2e.py'
      - 'tools/validate-v0211-elol-e2e.py'
      - 'patches/android-backend-v0.2.9.js'
      - 'patches/android-backend-v0.2.10.js'
      - '.ci/source.part00'
      - '.ci/source.part01'
      - '.ci/source.part02'
      - '.ci/source.part03'
      - '.ci/enable_revo_accessibility.py'

permissions:
  contents: read

jobs:
  elol-real-flow-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3

      - name: Restore production source and apply v0.2.11 launch fix
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          cat .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03 | base64 --decode > /tmp/source.zip
          unzip -q /tmp/source.zip
          python3 tools/patch-native-v0211-bee-swarm-launch.py
          python3 tools/instrument-v0211-elol-e2e.py
          python3 -m py_compile tools/patch-native-v0211-bee-swarm-launch.py tools/instrument-v0211-elol-e2e.py tools/validate-v0211-elol-e2e.py .ci/enable_revo_accessibility.py
          grep -q 'roblox://placeId=1537690962' revo-android/app/src/main/java/com/revolution/android/AndroidRevoBridge.java
          grep -q 'Exact command geometry from desktop patterns/gather/e_lol.lua.' revo-android/app/src/main/java/com/revolution/android/RevoGatherAdapter.java
          grep -q 'roblox-foreground-frame-delta-v1' revo-android/app/src/main/java/com/revolution/android/RevoGatherAdapter.java

      - name: Restore exact desktop frontend and Android overlays
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache revo-android/app/src/main/assets/www /tmp/hashprobe
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo "0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe" | sha256sum -c -
          python3 revo-android/extract_revo_frontend.py .cache/RevolutionMacro.exe revo-android/app/src/main/assets/www
          cp revo-android/app/src/main/assets/www/index.android.html revo-android/app/src/main/assets/www/index.html
          npm install --silent --prefix /tmp/hashprobe rollup@4.50.0
          node tools/recover-vite-pngs.js .cache/RevolutionMacro.exe revo-android/app/src/main/assets/www /tmp/hashprobe/node_modules/rollup/dist/native.js
          python3 tools/patch-revo-frontend-v028.py "$(find revo-android/app/src/main/assets/www/assets -maxdepth 1 -name 'index-*.js' | head -n1)"
          cat patches/android-wails-shim-v0.2.4.js \
              patches/android-backend-v0.2.5.js \
              patches/android-backend-v0.2.6.js \
              patches/android-backend-v0.2.8.js \
              patches/android-backend-v0.2.8.1.js \
              patches/android-backend-v0.2.8.2.js \
              patches/android-backend-v0.2.9.js \
              patches/android-backend-v0.2.10.js \
              > revo-android/app/src/main/assets/www/android-wails-shim.js
          node --check revo-android/app/src/main/assets/www/android-wails-shim.js

      - name: Build Revolution diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p revo-android --stacktrace clean :app:assembleDebug
          test -s revo-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build motion-reactive CI Roblox receiver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fake-roblox/app/src/main/java/com/roblox/client fake-roblox/app/src/main/res/values
          cat > fake-roblox/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "FakeRobloxMotion"
          include(":app")
          EOF
          cat > fake-roblox/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.12.2" apply false }
          EOF
          cat > fake-roblox/app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "com.roblox.client"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.roblox.client"
                  minSdk = 30
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF
          cat > fake-roblox/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" /></resources>
          EOF
          cat > fake-roblox/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@style/AppTheme" android:label="Fake Roblox Motion CI">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="roblox" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > fake-roblox/app/src/main/java/com/roblox/client/MainActivity.java <<'EOF'
          package com.roblox.client;
          import android.app.Activity;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.os.Bundle;
          import android.util.Log;
          import android.view.MotionEvent;
          import android.view.View;
          public class MainActivity extends Activity {
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  String uri = getIntent() == null || getIntent().getData() == null ? "" : getIntent().getData().toString();
                  Log.e("FakeRoblox", "FAKE_ROBLOX_URI=" + uri);
                  setContentView(new MotionView(this, uri));
              }
              static final class MotionView extends View {
                  private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final String uri;
                  private boolean bright;
                  private int touches;
                  MotionView(Context context, String uri) { super(context); this.uri = uri; setFocusable(true); setClickable(true); }
                  @Override protected void onDraw(Canvas canvas) {
                      canvas.drawColor(bright ? Color.WHITE : Color.BLACK);
                      paint.setColor(bright ? Color.BLACK : Color.WHITE);
                      paint.setTextSize(46f);
                      canvas.drawText("Fake Roblox Bee Swarm CI", 72, 160, paint);
                      canvas.drawText("touches=" + touches, 72, 225, paint);
                      canvas.drawText(uri, 72, 290, paint);
                  }
                  @Override public boolean onTouchEvent(MotionEvent event) {
                      if (event.getActionMasked() == MotionEvent.ACTION_DOWN) {
                          touches++;
                          bright = !bright;
                          Log.e("FakeRoblox", "FAKE_ROBLOX_TOUCH count=" + touches + " x=" + event.getX() + " y=" + event.getY());
                          invalidate();
                      }
                      return true;
                  }
              }
          }
          EOF
          gradle -p fake-roblox --stacktrace :app:assembleDebug
          test -s fake-roblox/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android 15 real Start plus e_lol movement gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            mkdir -p emulator-artifacts
            adb install -r fake-roblox/app/build/outputs/apk/debug/app-debug.apk
            adb install -r revo-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell cmd appops set com.revolution.android ACCESS_RESTRICTED_SETTINGS allow
            adb shell cmd appops get com.revolution.android ACCESS_RESTRICTED_SETTINGS | tee emulator-artifacts/restricted-appop.txt
            grep -qi 'allow' emulator-artifacts/restricted-appop.txt
            adb shell am force-stop com.revolution.android || true
            adb shell am force-stop com.roblox.client || true
            adb shell am start -W -n com.revolution.android/.MainActivity | tee emulator-artifacts/revo-first-start.txt
            python3 .ci/enable_revo_accessibility.py
            adb shell settings get secure enabled_accessibility_services | tee emulator-artifacts/enabled-setting.txt
            adb shell settings get secure accessibility_enabled | tee emulator-artifacts/accessibility-enabled.txt
            adb shell dumpsys accessibility > emulator-artifacts/accessibility.txt
            grep -Fq 'com.revolution.android.RevoAccessibilityService' emulator-artifacts/enabled-setting.txt
            grep -Fxq '1' emulator-artifacts/accessibility-enabled.txt
            grep -Fq 'RevoAccessibilityService' emulator-artifacts/accessibility.txt
            adb shell am start -W -n com.revolution.android/.MainActivity | tee emulator-artifacts/revo-return.txt
            sleep 8
            adb logcat -c
            adb shell am broadcast -a com.revolution.android.START_ELOL_GATE -p com.revolution.android | tee emulator-artifacts/elol-broadcast.txt
            sleep 16
            adb exec-out screencap -p > emulator-artifacts/elol-final.png
            adb shell dumpsys activity activities > emulator-artifacts/activities.txt 2>&1 || true
            adb logcat -d -v time > emulator-artifacts/logcat.txt
            grep -E 'RevoElol|RevoWeb|RevoAndroid|RevoGatherAdapter|RevoMovementEvidence|FakeRoblox|android-engine' emulator-artifacts/logcat.txt > emulator-artifacts/elol-flow.txt || true
            cat emulator-artifacts/elol-flow.txt
            python3 tools/validate-v0211-elol-e2e.py emulator-artifacts

      - name: Upload e_lol end-to-end evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revo-v0211-elol-e2e-v2-evidence
          path: emulator-artifacts/
          if-no-files-found: warn
