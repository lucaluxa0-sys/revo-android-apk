name: Diagnose current desktop Revolution runtime data

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diag-desktop-runtime-data.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download exact public Revolution Macro release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'RevolutionMacro.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe' -OutFile $exe
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb') { throw "SHA mismatch: $sha" }
          Write-Host "PASS exact EXE $sha"

      - name: Launch Revo and wait for its real Storage config
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'RevolutionMacro.exe'
          $p = Start-Process -FilePath $exe -PassThru
          $p.Id | Set-Content (Join-Path $env:RUNNER_TEMP 'revo-pid.txt')
          Write-Host "Started PID=$($p.Id)"

          $found = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            $found = Get-ChildItem $env:APPDATA -Filter config.yaml -File -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '(?i)\\revolution\\.*\\Storage\\config\.yaml$' } |
              Select-Object -First 1
            if ($found) {
              Write-Host "Found config after $((($i + 1) * 2))s: $($found.FullName)"
              break
            }
            if (($i + 1) % 10 -eq 0) { Write-Host "Still waiting for Revo Storage... $((($i + 1) * 2))s" }
          }
          if (-not $found) { throw 'Revo did not create Storage/config.yaml within 120 seconds.' }
          $found.DirectoryName | Set-Content (Join-Path $env:RUNNER_TEMP 'revo-storage-path.txt')

      - name: Capture exact Revolution Storage and userpatterns
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'revo-runtime-data-exact'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $storage = (Get-Content (Join-Path $env:RUNNER_TEMP 'revo-storage-path.txt') -Raw).Trim()
          Write-Host "Storage path: $storage"

          foreach ($name in @('config.yaml','settings.yaml','accounts.yaml','planters.yaml')) {
            $src = Join-Path $storage $name
            if (Test-Path $src -PathType Leaf) {
              Copy-Item -LiteralPath $src -Destination (Join-Path $out $name) -Force
              $h = (Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host "CAPTURED $name bytes=$((Get-Item $src).Length) sha256=$h"
            } else {
              Write-Host "MISSING $name"
            }
          }

          $up = Join-Path $env:USERPROFILE '.revolution-macro\userpatterns'
          if (Test-Path $up) {
            $upOut = Join-Path $out 'userpatterns'
            New-Item -ItemType Directory -Force -Path $upOut | Out-Null
            Get-ChildItem $up -File -Force -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination $upOut -Force
              Write-Host "USERPATTERN $($_.Name) bytes=$($_.Length)"
            }
          }

      - name: Print targeted Gather and pattern lines
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'revo-runtime-data-exact'
          foreach ($name in @('config.yaml','settings.yaml')) {
            $f = Join-Path $out $name
            if (-not (Test-Path $f)) { continue }
            Write-Host "===== $name targeted matches ====="
            Select-String -Path $f -Pattern 'patterns:|gatherPattern|availablePatterns|sprinklerType|backpackPercent|walkReturn|driftComp|repetitions|dataRepoVersion|dataRepoHash|patternMemberType|pattern:' -Context 3,10 |
              Select-Object -First 250 |
              ForEach-Object { $_.ToString() }
          }

      - name: Stop Revo
        if: always()
        shell: pwsh
        run: |
          Get-Process RevolutionMacro -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload exact runtime data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revolution-desktop-runtime-data-exact
          path: ${{ runner.temp }}/revo-runtime-data-exact/
          if-no-files-found: warn
