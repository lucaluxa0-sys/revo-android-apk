name: Diagnose current desktop Revolution runtime data

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diag-desktop-runtime-data.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download exact public Revolution Macro release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'revo-runtime-probe'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $exe = Join-Path $work 'RevolutionMacro.exe'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe' -OutFile $exe
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb') { throw "SHA mismatch: $sha" }
          Write-Host "PASS exact EXE $sha"

      - name: Launch Revo and wait for fully initialized runtime data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'revo-runtime-probe'
          $exe = Join-Path $work 'RevolutionMacro.exe'
          $settings = Join-Path $work 'settings\settings.yaml'
          $state = Join-Path $work 'settings\state.yaml'
          $planters = Join-Path $work 'settings\planters.yaml'
          $patterns = Join-Path $work 'patterns\patterns.bin'
          $p = Start-Process -FilePath $exe -WorkingDirectory $work -PassThru
          Write-Host "Started PID=$($p.Id) WorkingDirectory=$work"

          $ready = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            try { $p.Refresh() } catch {}
            if ($p.HasExited) { throw "RevolutionMacro exited before runtime data initialized. ExitCode=$($p.ExitCode)" }

            $settingsBytes = if (Test-Path $settings) { (Get-Item $settings).Length } else { 0 }
            $stateBytes = if (Test-Path $state) { (Get-Item $state).Length } else { 0 }
            $plantersBytes = if (Test-Path $planters) { (Get-Item $planters).Length } else { 0 }
            $patternsBytes = if (Test-Path $patterns) { (Get-Item $patterns).Length } else { 0 }
            Write-Host "Probe $((($i + 1) * 2))s settings=$settingsBytes state=$stateBytes planters=$plantersBytes patterns=$patternsBytes"

            if ($settingsBytes -gt 10000 -and $stateBytes -gt 100 -and $plantersBytes -gt 1000 -and $patternsBytes -gt 100000) {
              $ready = $true
              break
            }
          }
          if (-not $ready) { throw 'Revolution runtime files never reached initialized sizes' }
          Start-Sleep -Seconds 2
          Write-Host "PASS initialized settings=$((Get-Item $settings).Length) state=$((Get-Item $state).Length) planters=$((Get-Item $planters).Length) patterns=$((Get-Item $patterns).Length)"

      - name: Capture exact runtime files and hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'revo-runtime-probe'
          $out = Join-Path $env:RUNNER_TEMP 'revo-runtime-data-exact'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          foreach ($dir in @('settings','patterns')) {
            $src = Join-Path $work $dir
            if (Test-Path $src) {
              Copy-Item -LiteralPath $src -Destination (Join-Path $out $dir) -Recurse -Force
            }
          }

          $manifest = foreach ($f in Get-ChildItem -LiteralPath $out -File -Recurse -Force) {
            [pscustomobject]@{
              RelativePath = $f.FullName.Substring($out.Length + 1)
              Bytes = $f.Length
              Sha256 = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $manifest | Sort-Object RelativePath | Format-Table -AutoSize | Out-String -Width 4096 | Write-Host
          $manifest | Sort-Object RelativePath | ConvertTo-Json -Depth 3 | Set-Content (Join-Path $out 'manifest.json') -Encoding UTF8

      - name: Print exact non-auth desktop settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'revo-runtime-data-exact'
          foreach ($name in @('settings.yaml','state.yaml','planters.yaml','accounts.yaml','analytics.yaml')) {
            $file = Join-Path $out "settings\$name"
            if (Test-Path $file) {
              Write-Host "===== EXACT $name ====="
              Get-Content -LiteralPath $file -Raw | Write-Host
            }
          }

      - name: Compare runtime patterns.bin with pinned upstream dataset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'revo-runtime-data-exact'
          $runtime = Join-Path $out 'patterns\patterns.bin'
          $upstream = Join-Path $env:RUNNER_TEMP 'patterns-upstream.bin'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/nosyliam/revolution-macro/v0.9c-hotfix3/datasets/v8/patterns.bin' -OutFile $upstream
          $rh = (Get-FileHash $runtime -Algorithm SHA256).Hash.ToLowerInvariant()
          $uh = (Get-FileHash $upstream -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "RUNTIME patterns.bin sha256=$rh bytes=$((Get-Item $runtime).Length)"
          Write-Host "UPSTREAM patterns.bin sha256=$uh bytes=$((Get-Item $upstream).Length)"
          if ($rh -ne $uh) { throw 'Runtime patterns.bin differs from pinned v8 upstream dataset' }
          Write-Host 'PASS runtime patterns.bin is byte-for-byte identical to pinned v8 upstream dataset'

          $bytes = [IO.File]::ReadAllBytes($runtime)
          $n = [Math]::Min(128, $bytes.Length)
          $hex = ($bytes[0..($n-1)] | ForEach-Object { $_.ToString('x2') }) -join ''
          Write-Host "patterns.bin first${n}bytes.hex=$hex"

      - name: Print gather Lua files
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'revo-runtime-data-exact'
          Get-ChildItem -LiteralPath (Join-Path $out 'patterns\gather') -File -Filter *.lua -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object {
            Write-Host "===== $($_.Name) ====="
            Get-Content -LiteralPath $_.FullName -Raw | Write-Host
          }

      - name: Stop Revo
        if: always()
        shell: pwsh
        run: |
          Get-Process RevolutionMacro -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload exact runtime data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revolution-desktop-runtime-data-exact
          path: ${{ runner.temp }}/revo-runtime-data-exact/
          if-no-files-found: error
