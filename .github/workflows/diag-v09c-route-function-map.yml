name: Recover v0.9c routing function map

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diag-v09c-route-function-map.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download exact pinned Revolution desktop binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache route-map
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe' | sha256sum -c -

      - name: Install PE and disassembly helpers
        shell: bash
        run: python3 -m pip install --disable-pip-version-check pefile capstone

      - name: Trace route table pointers for cannon to Pine Tree
        shell: python
        run: |
          from pathlib import Path
          import bisect, json, struct
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64
          from capstone.x86 import X86_OP_MEM, X86_OP_IMM, X86_REG_RIP

          raw=Path('.cache/RevolutionMacro.exe').read_bytes()
          pe=pefile.PE('.cache/RevolutionMacro.exe',fast_load=False)
          base=int(pe.OPTIONAL_HEADER.ImageBase)
          image_size=int(pe.OPTIONAL_HEADER.SizeOfImage)
          sections=[]
          for s in pe.sections:
              sections.append(dict(name=s.Name.rstrip(b'\0').decode('ascii','replace'),raw=int(s.PointerToRawData),
                  size=int(s.SizeOfRawData),rva=int(s.VirtualAddress),chars=int(s.Characteristics),data=s.get_data()))

          def off2va(off):
              if off < pe.OPTIONAL_HEADER.SizeOfHeaders:return base+off
              for s in sections:
                  if s['raw']<=off<s['raw']+s['size']:return base+s['rva']+off-s['raw']
              return None
          def va2off(va):
              rva=va-base
              if rva < pe.OPTIONAL_HEADER.SizeOfHeaders:return rva
              for s in sections:
                  if s['rva']<=rva<s['rva']+s['size']:return s['raw']+rva-s['rva']
              return None
          def ascii_at(va,n=180):
              off=va2off(va)
              if off is None:return ''
              b=raw[off:min(len(raw),off+n)]
              return ''.join(chr(x) if 32<=x<127 else '.' for x in b)

          funcs=[]
          try:
              for e in pe.DIRECTORY_ENTRY_EXCEPTION:
                  b=int(e.struct.BeginAddress); en=int(e.struct.EndAddress)
                  if b<en:funcs.append((base+b,base+en))
          except Exception:pass
          funcs=sorted(set(funcs)); starts=[x[0] for x in funcs]
          def containing(va):
              i=bisect.bisect_right(starts,va)-1
              return funcs[i] if i>=0 and funcs[i][0]<=va<funcs[i][1] else None

          needles=[b'pinetree-br',b'blue-cannon',b'goto-cannon',b'next-vertex',b'afb-target-field',
                   b'Pine Tree Forest',b'gather/e_lol.lua',b'Entering Field: %s',b'Travelling To: %s',
                   b'Route Destination: %s',b'Skipping empty route']
          occ=[]
          for n in needles:
              p=0
              while True:
                  off=raw.find(n,p)
                  if off<0:break
                  va=off2va(off)
                  if va is not None:occ.append(dict(text=n.decode(),off=off,va=va,length=len(n)))
                  p=off+1
          occ.sort(key=lambda x:x['va'])

          md=Cs(CS_ARCH_X86,CS_MODE_64);md.detail=True
          code=[]
          for s in sections:
              if not (s['chars']&0x20000000):continue
              for ins in md.disasm(s['data'],base+s['rva']):
                  ts=[]
                  for op in ins.operands:
                      if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                          ts.append(ins.address+ins.size+op.mem.disp)
                      elif op.type==X86_OP_IMM:
                          v=int(op.imm)&((1<<64)-1)
                          if base<=v<base+image_size:ts.append(v)
                  if ts:code.append((ins.address,ins.mnemonic,ins.op_str,ts))

          # Find every static qword pointer to the exact start of each high-signal string. Do not assume
          # Go string-descriptor alignment or a neighboring length field; modern route tables can embed
          # names inside larger structs/maps.
          pointers=[]
          for o in occ:
              pat=struct.pack('<Q',o['va'])
              p=0
              while True:
                  hit=raw.find(pat,p)
                  if hit<0:break
                  pva=off2va(hit)
                  if pva is not None:
                      pointers.append(dict(literal=o['text'],literal_va=o['va'],pointer_off=hit,pointer_va=pva))
                  p=hit+1

          # Also allow a code/data pointer to start up to 4096 bytes before a target literal in Go's packed
          # string slab. This catches strings represented as suffixes of a larger packed constant.
          broad=[]
          for addr,mn,ops,ts in code:
              for t in ts:
                  off=va2off(t)
                  if off is None:continue
                  for o in occ:
                      delta=o['va']-t
                      if 0<=delta<=4096:
                          pv=ascii_at(t,delta+o['length']+32)
                          if o['text'] in pv:
                              broad.append(dict(literal=o['text'],literal_va=o['va'],target_va=t,delta=delta,
                                  insn_va=addr,mnemonic=mn,op_str=ops,function=containing(addr)))

          # Map static pointer-table locations back to executable references. Search +/-256 because Go's
          # generated code may address a struct/table base and then index to the string field.
          pvas=sorted(set(x['pointer_va'] for x in pointers))
          xrefs=[]
          for addr,mn,ops,ts in code:
              for t in ts:
                  i=bisect.bisect_left(pvas,t-256); j=bisect.bisect_right(pvas,t+256)
                  for pva in pvas[i:j]:
                      for x in pointers:
                          if x['pointer_va']!=pva:continue
                          xrefs.append(dict(**x,target_va=t,target_delta=t-pva,insn_va=addr,
                              mnemonic=mn,op_str=ops,function=containing(addr)))

          # Dump qwords around each route-name pointer so neighboring vertex IDs, destination names,
          # lengths, flags and function pointers are visible as one record rather than isolated strings.
          neighborhoods=[]
          for x in pointers:
              po=x['pointer_off']
              a=max(0,po-128); z=min(len(raw),po+256)
              rows=[]
              q=(a+7)&~7
              while q+8<=z:
                  v=struct.unpack_from('<Q',raw,q)[0]
                  entry={'off':q,'va':off2va(q),'value':v}
                  if base<=v<base+image_size:
                      entry['target_preview']=ascii_at(v,120)
                      entry['target_function']=containing(v)
                  rows.append(entry);q+=8
              neighborhoods.append(dict(pointer=x,rows=rows))

          # De-duplicate and select executable functions tied to either static route tables or broad packed strings.
          def dedupe(items,keys):
              out=[];seen=set()
              for x in items:
                  k=tuple(x.get(q) if not isinstance(x.get(q),list) else tuple(x.get(q)) for q in keys)
                  if k not in seen:seen.add(k);out.append(x)
              return out
          pointers=dedupe(pointers,['literal','pointer_va'])
          broad=dedupe(broad,['literal','target_va','insn_va'])
          xrefs=dedupe(xrefs,['literal','pointer_va','insn_va','target_va'])
          target_funcs=set()
          for x in broad+xrefs:
              f=x.get('function')
              if f:target_funcs.add(tuple(f))

          report=[f'image_base=0x{base:x}',f'pdata_functions={len(funcs)}',f'occurrences={len(occ)}',
                  f'exact_static_pointers={len(pointers)}',f'broad_code_refs={len(broad)}',f'pointer_table_xrefs={len(xrefs)}']
          for o in occ:report.append('LITERAL '+json.dumps(o,sort_keys=True))
          for x in pointers:report.append('POINTER '+json.dumps(x,sort_keys=True))
          for x in broad:report.append('BROAD '+json.dumps(x,sort_keys=True))
          for x in xrefs:report.append('TABLE_XREF '+json.dumps(x,sort_keys=True))
          Path('route-map/summary.txt').write_text('\n'.join(report),encoding='utf-8')
          Path('route-map/evidence.json').write_text(json.dumps(dict(occurrences=occ,pointers=pointers,broad=broad,
              table_xrefs=xrefs,neighborhoods=neighborhoods,functions=sorted(target_funcs)),indent=2),encoding='utf-8')

          lines=[]
          for b,en in sorted(target_funcs):
              lines.append(f'\n===== FUNCTION 0x{b:x}-0x{en:x} size={en-b} =====')
              data=None
              for s in sections:
                  sva=base+s['rva'];sev=sva+len(s['data'])
                  if sva<=b<sev:
                      aa=b-sva;zz=min(len(s['data']),en-sva);data=s['data'][aa:zz];break
              if data is None:continue
              for i,ins in enumerate(md.disasm(data,b)):
                  lines.append(f'0x{ins.address:016x}: {ins.mnemonic:8s} {ins.op_str}')
                  if i>=3000:lines.append('... truncated ...');break
          Path('route-map/target-disassembly.txt').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(report[:5000]))

      - name: Upload direct route function evidence
        uses: actions/upload-artifact@v4
        with:
          name: revolution-v09c-route-function-map
          path: route-map/
          if-no-files-found: error
