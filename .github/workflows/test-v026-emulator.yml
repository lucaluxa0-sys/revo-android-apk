name: Test Revo Android v0.2.6 pattern backend

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'patches/android-backend-v0.2.6.js'
      - '.github/workflows/test-v026-emulator.yml'

permissions:
  contents: read

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3

      - name: Restore Android source
        shell: bash
        run: |
          cat .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03 | base64 --decode > /tmp/revo-android-source.zip
          unzip -q /tmp/revo-android-source.zip
          test -f revo-android/app/build.gradle.kts

      - name: Download exact Revolution Macro release
        shell: bash
        run: |
          mkdir -p .cache
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo "0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe" | sha256sum -c -

      - name: Extract frontend and apply Android backends through v0.2.6
        shell: bash
        run: |
          mkdir -p revo-android/app/src/main/assets/www
          python3 revo-android/extract_revo_frontend.py .cache/RevolutionMacro.exe revo-android/app/src/main/assets/www
          cp revo-android/app/src/main/assets/www/index.android.html revo-android/app/src/main/assets/www/index.html
          cat patches/android-wails-shim-v0.2.4.js \
              patches/android-backend-v0.2.5.js \
              patches/android-backend-v0.2.6.js \
              > revo-android/app/src/main/assets/www/android-wails-shim.js

      - name: Add WebView pattern probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('revo-android/app/src/main/java/com/revolution/android/MainActivity.java')
          s = p.read_text()
          s = s.replace('import android.webkit.WebChromeClient;', 'import android.webkit.WebChromeClient;\nimport android.webkit.ConsoleMessage;\nimport android.util.Log;')
          s = s.replace(
              'web.setWebChromeClient(new WebChromeClient());',
              '''WebView.setWebContentsDebuggingEnabled(true);\n        web.setWebChromeClient(new WebChromeClient() {\n            @Override public boolean onConsoleMessage(ConsoleMessage cm) {\n                Log.e("RevoWeb", cm.message() + " @" + cm.sourceId() + ":" + cm.lineNumber());\n                return true;\n            }\n        });''')
          s = s.replace(
              'web.loadUrl("https://revo.local/index.android.html");',
              '''web.loadUrl("https://revo.local/index.android.html");\n        Handler probeHandler = new Handler(Looper.getMainLooper());\n        probeHandler.postDelayed(() -> {\n            if (web == null) return;\n            web.evaluateJavascript(\n                "(()=>{const b=[...document.querySelectorAll('button')].find(x=>(x.innerText||x.textContent||'').trim()==='Disable');if(b)b.click();return 'dismissed';})()",\n                value -> Log.e("RevoDismiss", String.valueOf(value)));\n        }, 14000);\n        probeHandler.postDelayed(() -> {\n            if (web == null) return;\n            web.evaluateJavascript(\n                "(()=>{try{const rt=window.dataRuntime,m=window.go&&window.go.cmd&&window.go.cmd.Macro;if(!rt||!m)return 'missing-runtime';const p=rt.presetObject(rt.preset||rt.defaultPreset||'Default');const active=p.Object('patterns').List('active');active.keyField='id';active.primitive=false;let a=active.Object('android-copy-src');if(!a)a=active.Append('android-copy-src');a.Set('field','Pine Tree');a.Object('config').Set('seconds',123);a.Object('config').Object('movement').Set('width',7);const seq=a.Object('config').List('sequence');seq.keyField='';seq.primitive=true;while(seq.values.length)seq.Delete(0);seq.Append('', 'W');seq.Append('', 'A');let b=active.Object('android-copy-dst');if(!b)b=active.Append('android-copy-dst');b.Set('field','Blue Flower');b.Object('config').Set('seconds',1);m.CopyPattern('android-copy-src',false);m.LoadPattern('android-copy-dst',false);setTimeout(()=>{try{const out={backend:window.RevoAndroidDebug&&window.RevoAndroidDebug.backendVersion,seconds:b.Object('config').Concrete('seconds'),width:b.Object('config').Object('movement').Concrete('width'),sequence:b.Object('config').List('sequence').values,clipboard:window.RevoAndroidDebug&&window.RevoAndroidDebug.patternClipboard&&window.RevoAndroidDebug.patternClipboard(),disconnected:rt.disconnected};console.error('RevoPatternProbe '+JSON.stringify(out));}catch(e){console.error('RevoPatternProbe ERROR '+String(e));}},500);return 'scheduled';}catch(e){console.error('RevoPatternProbe ERROR '+String(e));return 'error';}})()",\n                value -> Log.e("RevoPatternSchedule", String.valueOf(value)));\n        }, 21000);''')
          p.write_text(s)
          PY

      - name: Build diagnostic APK
        shell: bash
        run: gradle -p revo-android --stacktrace :app:assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot emulator and verify Gather pattern copy paste
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            mkdir -p emulator-artifacts
            adb install -r revo-android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.revolution.android || true
            adb shell am start -W -n com.revolution.android/.MainActivity
            sleep 25
            adb exec-out screencap -p > emulator-artifacts/revo-v026-screen.png
            adb logcat -d -v time > emulator-artifacts/logcat-v026.txt
            grep -E 'RevoPattern|android-backend|android-runtime|preload' emulator-artifacts/logcat-v026.txt > emulator-artifacts/revo-v026-log.txt || true
            cat emulator-artifacts/revo-v026-log.txt
            grep -q '\[android-backend\] v0.2.6 gather pattern backend installed' emulator-artifacts/logcat-v026.txt
            grep 'RevoPatternProbe' emulator-artifacts/logcat-v026.txt | grep -q '\\"backend\\":\\"0.2.6\\"'
            grep 'RevoPatternProbe' emulator-artifacts/logcat-v026.txt | grep -q '\\"seconds\\":123'
            grep 'RevoPatternProbe' emulator-artifacts/logcat-v026.txt | grep -q '\\"width\\":7'
            grep 'RevoPatternProbe' emulator-artifacts/logcat-v026.txt | grep -q '\\"sequence\\":\[\\"W\\",\\"A\\"\]'
            grep 'RevoPatternProbe' emulator-artifacts/logcat-v026.txt | grep -q '\\"field\\":\\"Pine Tree\\"'
            grep 'RevoPatternProbe' emulator-artifacts/logcat-v026.txt | grep -q '\\"disconnected\\":false'
            echo 'PASS: v0.2.6 Gather pattern Copy/Paste works inside the real Revo Android WebView'

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revo-android-v0.2.6-pattern-evidence
          path: emulator-artifacts/
          if-no-files-found: warn
