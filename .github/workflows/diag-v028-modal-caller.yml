name: Diagnose Revo Auto-Planters panel render

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diag-v028-modal-caller.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract exact Auto-Planters panel context
        shell: bash
        run: |
          cat .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03 | base64 --decode > /tmp/source.zip
          unzip -q /tmp/source.zip
          mkdir -p /tmp/www diagnostics
          curl -fL --retry 4 --retry-delay 2 -o /tmp/RevolutionMacro.exe https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          python3 revo-android/extract_revo_frontend.py /tmp/RevolutionMacro.exe /tmp/www
          JS=$(find /tmp/www/assets -maxdepth 1 -name 'index-*.js' | head -n1)
          python3 - "$JS" diagnostics/auto-planters-panel.txt <<'PY'
          from pathlib import Path
          import re, sys

          src = Path(sys.argv[1]).read_text(errors='ignore')
          out = []
          def section(title, text):
              out.append(f"\n===== {title} =====\n{text}\n")

          for term in ['children:"Auto-Planters"', 'Z1=', 'ey=', 'ny=', 'sy=', 'ay=({open']:
              pos = 0
              found = 0
              while True:
                  i = src.find(term, pos)
                  if i < 0: break
                  found += 1
                  section(f"TERM {term} #{found} OFFSET {i}", src[max(0, i-5000):min(len(src), i+18000)])
                  pos = i + len(term)
              if not found:
                  section(f"TERM {term}", 'NOT FOUND')

          # Collect every .Concrete(...) call near the Auto-Planters label so the
          # Android runtime can seed the exact objects the current frontend expects.
          label = src.find('children:"Auto-Planters"')
          if label >= 0:
              win_start = max(0, label - 30000)
              win_end = min(len(src), label + 80000)
              window = src[win_start:win_end]
              calls = []
              for m in re.finditer(r'(.{0,180}?\.Concrete\([^)]{0,180}\))', window):
                  snippet = m.group(1).replace('\n', ' ')
                  calls.append(f"ABS_OFFSET {win_start + m.start()} :: {snippet}")
              section('CONCRETE CALLS NEAR AUTO-PLANTERS', '\n'.join(calls) if calls else 'NONE')

          # Also collect Object/List chains around planter strings. This is useful
          # when the undefined value is an intermediate Object()/List() result.
          planter_hits = []
          for m in re.finditer(r'(?i)planter', src):
              i = m.start()
              chunk = src[max(0, i-400):min(len(src), i+900)]
              if '.Concrete(' in chunk or '.Object(' in chunk or '.List(' in chunk:
                  planter_hits.append(f"OFFSET {i}\n{chunk}")
                  if len(planter_hits) >= 120:
                      break
          section('PLANTER OBJECT/LIST/CONCRETE CONTEXTS', '\n\n---\n'.join(planter_hits))

          Path(sys.argv[2]).write_text(''.join(out), encoding='utf-8')
          print(f"wrote {sys.argv[2]} ({Path(sys.argv[2]).stat().st_size} bytes)")
          PY
      - name: Commit diagnostic output
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/auto-planters-panel.txt
          if git diff --cached --quiet; then
            echo 'Diagnostic output unchanged'
            exit 0
          fi
          git commit -m 'Record Auto-Planters frontend render context'
          git push
