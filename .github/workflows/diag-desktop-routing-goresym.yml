name: Recover desktop Revolution routing symbols with GoReSym

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diag-desktop-routing-goresym.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Download exact pinned Revolution desktop binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache routing-symbols
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe' | sha256sum -c -

      - name: Build GoReSym from source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/mandiant/GoReSym.git /tmp/GoReSym
          (cd /tmp/GoReSym && go build -o /tmp/goresym .)
          /tmp/goresym -about | head -n 30

      - name: Recover Go metadata with progressively simpler modes
        shell: bash
        run: |
          set -u
          attempts=(
            'full|-t -p -strings'
            'paths|-p'
            'strings|-strings'
            'basic|'
          )
          : > routing-symbols/attempts.txt
          for item in "${attempts[@]}"; do
            name="${item%%|*}"
            flags="${item#*|}"
            echo "===== $name flags=[$flags] =====" | tee -a routing-symbols/attempts.txt
            set +e
            if [ -n "$flags" ]; then
              /tmp/goresym $flags .cache/RevolutionMacro.exe > "routing-symbols/$name.json" 2> "routing-symbols/$name.err"
            else
              /tmp/goresym .cache/RevolutionMacro.exe > "routing-symbols/$name.json" 2> "routing-symbols/$name.err"
            fi
            rc=$?
            set -e
            echo "exit=$rc stdout_bytes=$(wc -c < routing-symbols/$name.json) stderr_bytes=$(wc -c < routing-symbols/$name.err)" | tee -a routing-symbols/attempts.txt
            cat "routing-symbols/$name.err" | head -n 80 | tee -a routing-symbols/attempts.txt || true
          done
          cat routing-symbols/attempts.txt

      - name: Extract routing-specific functions files and strings from any valid recovery
        shell: python
        run: |
          import json, re
          from pathlib import Path
          root=Path('routing-symbols')
          candidates=[]
          for name in ['full','paths','strings','basic']:
              p=root/f'{name}.json'
              try:
                  d=json.loads(p.read_text(errors='replace'))
                  if isinstance(d,dict): candidates.append((p.stat().st_size,name,d))
              except Exception:
                  pass
          out=[]
          if not candidates:
              out.append('NO_VALID_GORESYM_JSON')
              out.append((root/'attempts.txt').read_text(errors='replace'))
              (root/'routing-summary.txt').write_text('\n'.join(out))
              print('\n'.join(out))
              raise SystemExit(0)
          _,mode,data=max(candidates)
          terms=re.compile(r'hive|claim|field|route|routing|travel|walk|gather|spawn|join|convert|reset|cannon|path|move|dipper|sprinkler|character',re.I)
          out.append('selected_mode='+mode)
          out.append('Version='+str(data.get('Version')))
          out.append('BuildId='+str(data.get('BuildId')))
          out.append('Arch='+str(data.get('Arch')))
          out.append('top_level_keys='+repr(sorted(data.keys())))
          funcs=data.get('UserFunctions') or []
          out.append(f'UserFunctions={len(funcs)}')
          matched=[]
          for f in funcs:
              blob=' '.join(str(v) for v in f.values()) if isinstance(f,dict) else str(f)
              if terms.search(blob): matched.append(f)
          out.append(f'RoutingMatchedFunctions={len(matched)}')
          for f in matched: out.append(json.dumps(f,sort_keys=True))
          files=data.get('Files') or []
          fmatch=[x for x in files if terms.search(str(x))]
          out.append(f'\nRoutingMatchedFiles={len(fmatch)}')
          for x in fmatch: out.append(str(x))
          strings=data.get('Strings') or []
          smatch=[]
          for x in strings:
              blob=json.dumps(x,sort_keys=True) if isinstance(x,(dict,list)) else str(x)
              if terms.search(blob): smatch.append(x)
          out.append(f'\nRoutingMatchedStrings={len(smatch)}')
          for x in smatch[:1500]: out.append(json.dumps(x,sort_keys=True) if isinstance(x,(dict,list)) else str(x))
          (root/'routing-summary.txt').write_text('\n'.join(out))
          print('\n'.join(out[:500]))

      - name: Upload routing symbol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revolution-desktop-routing-goresym
          path: routing-symbols/
          if-no-files-found: error
