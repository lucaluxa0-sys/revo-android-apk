name: Build test and publish Revo Android v0.2.8.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'patches/android-backend-v0.2.8.js'
      - 'patches/android-backend-v0.2.8.1.js'
      - 'tools/patch-revo-frontend-v028.py'
      - '.github/workflows/build-v028.yml'

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore Android source
        shell: bash
        run: |
          cat .ci/source.part00 .ci/source.part01 .ci/source.part02 .ci/source.part03 | base64 --decode > /tmp/source.zip
          unzip -q /tmp/source.zip
          test -f revo-android/app/build.gradle.kts
          cp revo-android/app/src/main/java/com/revolution/android/MainActivity.java /tmp/MainActivity.clean.java

      - name: Download pinned Revolution release
        shell: bash
        run: |
          mkdir -p .cache
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo "0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe" | sha256sum -c -

      - name: Extract frontend and recover all Revo PNG assets
        shell: bash
        run: |
          mkdir -p revo-android/app/src/main/assets/www
          python3 revo-android/extract_revo_frontend.py .cache/RevolutionMacro.exe revo-android/app/src/main/assets/www
          cp revo-android/app/src/main/assets/www/index.android.html revo-android/app/src/main/assets/www/index.html
          npm install --silent --prefix /tmp/hashprobe rollup@4.50.0
          node tools/recover-vite-pngs.js .cache/RevolutionMacro.exe revo-android/app/src/main/assets/www /tmp/hashprobe/node_modules/rollup/dist/native.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('revo-android/app/src/main/assets/www')
          m=json.loads((root/'revo-png-manifest.json').read_text())
          assert m['count']==113, m
          assert all((root/'assets'/x).is_file() and (root/'assets'/x).stat().st_size>100 for x in m['assets'])
          print('PASS: 113/113 Revo PNGs recovered')
          PY

      - name: Apply Android mobile interaction patch
        shell: bash
        run: |
          JS=$(find revo-android/app/src/main/assets/www/assets -maxdepth 1 -name 'index-*.js' | head -n1)
          test -n "$JS"
          python3 tools/patch-revo-frontend-v028.py "$JS"
          grep -q 'data-revo-help-popup' "$JS"
          grep -q 'title:"Auto-Planters"' "$JS"
          grep -q '"aria-label":"Open Auto-Planters"' "$JS"
          grep -q '"aria-label":"Close Auto-Planters"' "$JS"

      - name: Install real Revolution launcher icon
        shell: bash
        run: |
          rm -rf /tmp/revo-icon
          mkdir -p /tmp/revo-icon revo-android/app/src/main/res/drawable-nodpi
          (cd /tmp/revo-icon && 7z x -y "$GITHUB_WORKSPACE/.cache/RevolutionMacro.exe" '.rsrc/0/ICON/1' >/dev/null)
          ICON=/tmp/revo-icon/.rsrc/0/ICON/1
          test -s "$ICON"
          file "$ICON" | grep -q 'PNG image data, 256 x 256'
          cp "$ICON" revo-android/app/src/main/res/drawable-nodpi/revo_icon.png
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('revo-android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=re.sub(r'\s+android:icon="[^"]*"','',s)
          s=re.sub(r'\s+android:roundIcon="[^"]*"','',s)
          s=s.replace('<application','<application\n        android:icon="@drawable/revo_icon"\n        android:roundIcon="@drawable/revo_icon"',1)
          p.write_text(s)
          PY

      - name: Apply Android runtime backends through v0.2.8.1
        shell: bash
        run: |
          cat patches/android-wails-shim-v0.2.4.js \
              patches/android-backend-v0.2.5.js \
              patches/android-backend-v0.2.6.js \
              patches/android-backend-v0.2.8.js \
              patches/android-backend-v0.2.8.1.js \
              > revo-android/app/src/main/assets/www/android-wails-shim.js

      - name: Instrument WebView for v0.2.8.1 emulator acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('revo-android/app/src/main/java/com/revolution/android/MainActivity.java')
          s=p.read_text()
          s=s.replace('import android.webkit.WebChromeClient;', 'import android.webkit.WebChromeClient;\nimport android.webkit.ConsoleMessage;\nimport android.util.Log;')
          s=s.replace('web.setWebChromeClient(new WebChromeClient());', '''WebView.setWebContentsDebuggingEnabled(true);\n        web.setWebChromeClient(new WebChromeClient() {\n            @Override public boolean onConsoleMessage(ConsoleMessage cm) {\n                Log.e("RevoWeb", cm.message());\n                return true;\n            }\n        });''')

          js = r'''(async()=>{
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const visible=e=>!!e&&e.getClientRects().length>0&&getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden';
            const txt=e=>(e&&((e.innerText||e.textContent)||'')||'').trim();
            const buttons=()=>[...document.querySelectorAll('button')].filter(visible);
            const exact=t=>buttons().find(b=>txt(b)===t);
            const tap=e=>{if(!e)return false;e.scrollIntoView({block:'center'});e.click();return true};
            const out={runtimeErrors:[]};
            const err=e=>{try{out.runtimeErrors.push('error:'+String(e.message||e.error||e))}catch(_){}};
            const rej=e=>{try{out.runtimeErrors.push('rejection:'+String(e.reason||e))}catch(_){}};
            window.addEventListener('error',err);
            window.addEventListener('unhandledrejection',rej);
            try {
              const rt=window.dataRuntime,m=window.go.cmd.Macro;
              out.backend=window.RevoAndroidDebug&&window.RevoAndroidDebug.backendVersion;
              out.schema=window.RevoAndroidDebug&&window.RevoAndroidDebug.autoPlanterSchema&&window.RevoAndroidDebug.autoPlanterSchema();
              out.tooltipCount=Object.keys(rt.tooltips||{}).length;
              out.discordShowed=rt.Object('settings').Concrete('discordRichPresencePromptShowed');
              out.discordEnabled=rt.presetObject(rt.preset||rt.defaultPreset||'Default').Object('macro').Concrete('discordRichPresenceEnabled');

              const active=rt.presetObject(rt.preset||rt.defaultPreset||'Default').Object('patterns').List('active');
              active.keyField='id'; active.primitive=false;
              await m.AddDefaultField('sunflower'); await sleep(150);
              out.gatherAfterAdd=active.values.length;
              const added=active.values.find(x=>x&&x.object&&x.object.Concrete('field')==='sunflower');
              out.gatherAdded=!!added;
              out.gatherOrder=added&&added.object.Concrete('order');
              if(added) await m.DeleteField(added.key);
              await sleep(150);
              out.gatherAfterDelete=active.values.length;

              let replay=null;
              window.runtime.EventsOnMultiple('logs_batch',x=>{replay=x;},1);
              await sleep(100);
              out.logCount=(window.RevoAndroidDebug.logs()||[]).length;
              out.logReplay=Array.isArray(replay)?replay.length:-1;

              const auto=rt.presetObject(rt.preset||rt.defaultPreset||'Default').Object('planter').Object('autoPlanters');
              auto.Set('enabled',true);
              await m.RefreshPlanterSchedule('Default');
              await sleep(1400);
              const ps=rt.planterObject(rt.account||'Default').Object('state');
              out.solverRunning=ps.Concrete('solverRunning');
              out.solverStatus=ps.Concrete('solverStatus');
              out.solverReason=ps.Concrete('solverFailureReason');

              tap(exact('Planters'));
              await sleep(500);
              const open=exact('Auto-Planters')||document.querySelector('button[aria-label="Open Auto-Planters"]');
              out.autoButton=!!open;
              if(open){let nc=0;open.addEventListener('click',()=>{nc++},{capture:true});tap(open);await sleep(700);out.autoNativeClick=nc;}
              let dialogs=[...document.querySelectorAll('[role=dialog]')].filter(visible);
              let dialog=dialogs.find(x=>txt(x).includes('Auto-Planters'));
              out.autoDialog=!!dialog;
              const helps=dialog?[...dialog.querySelectorAll('button[aria-label="Help"]')].filter(visible):[];
              out.helpCount=helps.length;
              out.helpButton=helps.length>0;
              tap(helps[0]); await sleep(200);
              let popup=document.querySelector('[data-revo-help-popup]');
              out.helpPopup=!!popup&&visible(popup);
              out.helpText=popup?txt(popup):'';
              tap(document.querySelector('button[aria-label="Close help"]')); await sleep(100);
              out.helpClosed=!document.querySelector('[data-revo-help-popup]');
              dialogs=[...document.querySelectorAll('[role=dialog]')].filter(visible);
              dialog=dialogs.find(x=>txt(x).includes('Auto-Planters'));
              const close=dialog&&[...dialog.querySelectorAll('button')].find(b=>(b.getAttribute('aria-label')||'').toLowerCase().includes('close'));
              out.modalCloseButton=!!close;
              tap(close); await sleep(300);
              out.modalClosed=![...document.querySelectorAll('[role=dialog]')].filter(visible).some(x=>txt(x).includes('Auto-Planters'));
              out.staleAriaModal=!!document.querySelector('[aria-modal="true"]');
              out.discordPromptInDom=(document.body.innerText||'').includes('Discord Rich Presence')&&(document.body.innerText||'').includes('Enable');
              window.removeEventListener('error',err);
              window.removeEventListener('unhandledrejection',rej);
              console.error('RevoV0281Probe '+JSON.stringify(out));
            } catch(e) {
              console.error('RevoV0281Probe ERROR '+String(e)+' '+(e&&e.stack||''));
            }
          })()'''

          marker='web.loadUrl("https://revo.local/index.android.html");'
          if marker not in s: raise SystemExit('loadUrl marker missing')
          replacement = '''web.loadUrl("https://revo.local/index.android.html");\n        Handler v0281 = new Handler(Looper.getMainLooper());\n        v0281.postDelayed(() -> web.evaluateJavascript(%s, value -> Log.e("RevoV0281Schedule", String.valueOf(value))), 16000);''' % json.dumps(js)
          p.write_text(s.replace(marker,replacement,1))
          PY

      - name: Build diagnostic APK
        shell: bash
        run: gradle -p revo-android --stacktrace :app:assembleDebug

      - name: Verify packaged icon and assets
        shell: bash
        run: |
          APK=revo-android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'revo_icon.png'
          COUNT=$(unzip -l "$APK" | grep -E 'assets/www/assets/.*\.png$' | wc -l)
          test "$COUNT" -ge 113
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q 'revo_icon.png'

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot Android 15 emulator and gate v0.2.8.1 interactions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p emulator-artifacts
            adb install -r revo-android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.revolution.android || true
            adb shell am start -W -n com.revolution.android/.MainActivity
            sleep 23
            adb exec-out screencap -p > emulator-artifacts/revo-v0281.png
            adb logcat -d -v time > emulator-artifacts/logcat-v0281.txt
            ! grep -q 'RevoV0281Probe ERROR' emulator-artifacts/logcat-v0281.txt
            grep 'RevoV0281Probe {' emulator-artifacts/logcat-v0281.txt | tail -n1 > emulator-artifacts/probe.txt
            cat emulator-artifacts/probe.txt
            grep -q '"backend":"0.2.8.1"' emulator-artifacts/probe.txt
            grep -q '"keyField":"type"' emulator-artifacts/probe.txt
            grep -q '"keyField":"field"' emulator-artifacts/probe.txt
            grep -q '"keyField":"planter"' emulator-artifacts/probe.txt
            grep -q '"runtimeErrors":\[\]' emulator-artifacts/probe.txt
            grep -Eq '"tooltipCount":([2-9][0-9]|[1-9][0-9]{2,})' emulator-artifacts/probe.txt
            grep -q '"discordShowed":true' emulator-artifacts/probe.txt
            grep -q '"discordEnabled":false' emulator-artifacts/probe.txt
            grep -q '"gatherAdded":true' emulator-artifacts/probe.txt
            grep -q '"gatherAfterAdd":1' emulator-artifacts/probe.txt
            grep -q '"gatherAfterDelete":0' emulator-artifacts/probe.txt
            grep -Eq '"logCount":[1-9][0-9]*' emulator-artifacts/probe.txt
            grep -Eq '"logReplay":[1-9][0-9]*' emulator-artifacts/probe.txt
            grep -q '"solverRunning":false' emulator-artifacts/probe.txt
            grep -q '"solverStatus":"blocked"' emulator-artifacts/probe.txt
            grep -q '"autoButton":true' emulator-artifacts/probe.txt
            grep -q '"autoNativeClick":1' emulator-artifacts/probe.txt
            grep -q '"autoDialog":true' emulator-artifacts/probe.txt
            grep -Eq '"helpCount":[1-9][0-9]*' emulator-artifacts/probe.txt
            grep -q '"helpButton":true' emulator-artifacts/probe.txt
            grep -q '"helpPopup":true' emulator-artifacts/probe.txt
            grep -q '"helpClosed":true' emulator-artifacts/probe.txt
            grep -q '"modalCloseButton":true' emulator-artifacts/probe.txt
            grep -q '"modalClosed":true' emulator-artifacts/probe.txt
            grep -q '"staleAriaModal":false' emulator-artifacts/probe.txt
            grep -q '"discordPromptInDom":false' emulator-artifacts/probe.txt
            ! grep -q "Cannot read properties of undefined (reading 'Concrete')" emulator-artifacts/logcat-v0281.txt
            echo 'PASS: v0.2.8.1 Android interaction gate is green'

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revo-android-v0.2.8.1-emulator-evidence
          path: emulator-artifacts/
          if-no-files-found: warn

      - name: Restore clean MainActivity and build final APK
        shell: bash
        run: |
          cp /tmp/MainActivity.clean.java revo-android/app/src/main/java/com/revolution/android/MainActivity.java
          gradle -p revo-android --stacktrace clean :app:assembleDebug
          APK=revo-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" /tmp/RevolutionMacro-Android-v0.2.8.1-dev.apk
          sha256sum /tmp/RevolutionMacro-Android-v0.2.8.1-dev.apk | sed 's#/tmp/##' > /tmp/SHA256SUMS-v0281.txt
          cp /tmp/RevolutionMacro-Android-v0.2.8.1-dev.apk RevolutionMacro-Android-v0.2.8.1-dev.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: RevolutionMacro-Android-v0.2.8.1-dev
          path: RevolutionMacro-Android-v0.2.8.1-dev.apk
          if-no-files-found: error

      - name: Publish emulator-gated APK
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/RevolutionMacro-Android-v0.2.8.1-dev.apk RevolutionMacro-Android-v0.2.8.1-dev.apk
            cp /tmp/SHA256SUMS-v0281.txt SHA256SUMS.txt
            git add RevolutionMacro-Android-v0.2.8.1-dev.apk SHA256SUMS.txt
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish emulator-gated RevolutionMacro Android v0.2.8.1 dev APK"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
