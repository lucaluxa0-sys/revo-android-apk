name: Recover exact v0.9c Lua AST codec map

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diag-v09c-ast-codec.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download exact pinned Revolution binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache codec-evidence
          curl -fL --retry 4 --retry-delay 2 -o .cache/RevolutionMacro.exe \
            https://github.com/nosyliam/revolution-macro/releases/download/v0.9c-hotfix3/RevolutionMacro.exe
          echo '0024099986d055e7de9f796a87ad6ab1b89b7004d087231f695c926f77fe8abb  .cache/RevolutionMacro.exe' | sha256sum -c -

      - name: Install PE/disassembly helpers
        run: python3 -m pip install --disable-pip-version-check pefile capstone

      - name: Recover codec key inputs, constructors and exact tag candidates
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, re, struct
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_64, CS_GRP_CALL
          from capstone.x86 import X86_OP_IMM, X86_OP_MEM, X86_OP_REG, X86_REG_RIP

          raw=Path('.cache/RevolutionMacro.exe').read_bytes()
          pe=pefile.PE('.cache/RevolutionMacro.exe',fast_load=False)
          base=int(pe.OPTIONAL_HEADER.ImageBase); image_size=int(pe.OPTIONAL_HEADER.SizeOfImage)
          sections=[]
          for s in pe.sections:
              sections.append(dict(name=s.Name.rstrip(b'\0').decode('ascii','replace'),raw=int(s.PointerToRawData),size=int(s.SizeOfRawData),rva=int(s.VirtualAddress),data=s.get_data()))
          def va2off(va):
              rva=va-base
              if 0<=rva<int(pe.OPTIONAL_HEADER.SizeOfHeaders):return rva
              for s in sections:
                  if s['rva']<=rva<s['rva']+s['size']:return s['raw']+rva-s['rva']
              return None
          def q(off):return struct.unpack_from('<Q',raw,off)[0]
          def u32(off):return struct.unpack_from('<I',raw,off)[0]
          def i32(off):return struct.unpack_from('<i',raw,off)[0]
          def bytes_at(va,n):
              off=va2off(va); return None if off is None else raw[off:off+n]
          def printable(va,n=160):
              b=bytes_at(va,n)
              if b is None:return None
              return ''.join(chr(x) if 32<=x<127 else '.' for x in b)

          # Recover moduledata/type names exactly as in prior probe.
          minpc=0x1400014a0; best=None;p=0
          while True:
              hit=raw.find(struct.pack('<Q',minpc),p)
              if hit<0:break
              md=hit-160
              if md>=0 and md+700<len(raw):
                  ftab=q(md+128); n=q(md+136); cap=q(md+144); text=q(md+176)
                  score=sum([text==minpc,1000<n<500000,cap>=n,va2off(ftab) is not None])
                  if best is None or score>best[0]:best=(score,md)
              p=hit+1
          if not best or best[0]<4:raise SystemExit('moduledata recovery failed')
          md=best[1]; types=q(md+296); typelinks=q(md+360); nt=q(md+368)
          def varint(off):
              x=0;sh=0
              for i in range(10):
                  b=raw[off+i];x|=(b&127)<<sh
                  if b<128:return x,i+1
                  sh+=7
              raise ValueError
          def typename(tva):
              off=va2off(tva)
              if off is None:return None
              no=i32(off+40); noff=va2off(types+no)
              if noff is None:return None
              try:ln,nv=varint(noff+1)
              except:return None
              try:return raw[noff+1+nv:noff+1+nv+ln].decode()
              except:return None
          loff=va2off(typelinks); type_by_va={}
          for i in range(int(nt)):
              rel=i32(loff+4*i);va=types+rel;n=typename(va)
              if n:type_by_va[va]=n

          mdx=Cs(CS_ARCH_X86,CS_MODE_64);mdx.detail=True
          def disasm_range(start,end):
              off=va2off(start)
              if off is None:return []
              b=raw[off:off+(end-start)]
              return list(mdx.disasm(b,start))
          def fmt_ins(ins):return f'{ins.address:#x}: {ins.mnemonic} {ins.op_str}'
          def rip_targets(ins):
              out=[]
              for op in ins.operands:
                  if op.type==X86_OP_MEM and op.mem.base==X86_REG_RIP:
                      out.append(ins.address+ins.size+op.mem.disp)
              return out

          # Exact known codec function addresses from recovered Go function table.
          K=0x140a13960; INIT=0x140a13b00; INIT_END=0x140a16020
          ctor_starts=[0x140a16020+i*0xa0 for i in range(32)]
          # Actual symbols are contiguous but some spacing may vary; scan the known range for newobject call sites too.
          newobject=0x140024200

          # Full k disassembly + RIP targets.
          lines=['===== codec.k =====']
          for ins in disasm_range(K,0x140a13b00):
              suffix=[]
              for t in rip_targets(ins):
                  suffix.append(f'RIP->{t:#x} {printable(t,96)!r}')
              lines.append(fmt_ins(ins)+((' ; '+' ; '.join(suffix)) if suffix else ''))

          # Extract every call to k and the preceding instructions. Capture likely Go string ptr/len loaded into RAX/RBX.
          insns=disasm_range(INIT,INIT_END)
          k_calls=[]
          for i,ins in enumerate(insns):
              target=None
              if ins.group(CS_GRP_CALL) and ins.operands and ins.operands[0].type==X86_OP_IMM:
                  target=int(ins.operands[0].imm)&((1<<64)-1)
              if target!=K:continue
              ctx=insns[max(0,i-14):i+10]
              rec={'call':f'{ins.address:#x}','context':[],'rip_candidates':[]}
              for ci in ctx:
                  item=fmt_ins(ci); rec['context'].append(item)
                  for t in rip_targets(ci):
                      bb=bytes_at(t,128)
                      rec['rip_candidates'].append({'insn':f'{ci.address:#x}','target':f'{t:#x}','preview':printable(t,128),'hex':bb[:64].hex() if bb else None})
              k_calls.append(rec)
          Path('codec-evidence/k-calls.json').write_text(json.dumps(k_calls,indent=2),encoding='utf-8')
          lines.append('\n===== init.0 k call contexts =====')
          for r in k_calls:
              lines.append('\nCALL '+r['call'])
              lines.extend(r['context'])
              for c in r['rip_candidates']:lines.append('  CAND '+json.dumps(c,sort_keys=True))

          # Constructor funcs have exact names addStmt.func32..19 then addExpr.func18..1.
          # Recover their type descriptor arguments to runtime.newobject by looking backward from call.
          ctor_ranges=[]
          names=[]
          addr=0x140a16020
          # use exact starts from known function table spacing: every 0xa0 through 0x140a17380
          starts=list(range(0x140a16020,0x140a17420,0xa0))
          # Filter starts that appear to begin with plausible machine code; label sequence from symbol table externally.
          ctor_report=[]
          # Known symbol-order labels from recovered table.
          labels=[f'addStmt.func{i}' for i in range(32,18,-1)] + [f'addExpr.func{i}' for i in range(18,0,-1)]
          # Correct exact starts are arithmetic 0xa0 apart for this binary.
          for start,label in zip(starts,labels):
              end=start+0xa0; ds=disasm_range(start,end); rec={'label':label,'start':f'{start:#x}','type_candidates':[],'instructions':[]}
              for j,ins in enumerate(ds):
                  rec['instructions'].append(fmt_ins(ins))
                  target=None
                  if ins.group(CS_GRP_CALL) and ins.operands and ins.operands[0].type==X86_OP_IMM:
                      target=int(ins.operands[0].imm)&((1<<64)-1)
                  if target==newobject:
                      for prev in ds[max(0,j-8):j]:
                          for t in rip_targets(prev):
                              # LEA may point directly to runtime type descriptor.
                              if t in type_by_va:
                                  rec['type_candidates'].append({'va':f'{t:#x}','name':type_by_va[t],'via':fmt_ins(prev)})
              ctor_report.append(rec)
          Path('codec-evidence/constructors.json').write_text(json.dumps(ctor_report,indent=2),encoding='utf-8')
          lines.append('\n===== constructors =====')
          for r in ctor_report:
              lines.append(json.dumps({'label':r['label'],'start':r['start'],'type_candidates':r['type_candidates']},sort_keys=True))

          # Since k uses SHA-256, brute common candidate inputs for all concrete AST names against all 23 observed tags.
          tags=set('f72810a4 176c5126 e58422da 9e2bcb91 da96a157 7db03b83 cb1f565a 0ee9c651 28c3610e 47991d31 8137973a 1f2d88f0 7bbc28b7 353933e9 4482ce9d f053b163 74b3480f ae5b5109 77eb3498 c111f63b 78722c1c 689a308c 2b53c5da'.split())
          ast_names=sorted({n for n in type_by_va.values() if n.startswith('*ast.')})
          brute=[]
          salts=['','expr','stmt','ast','node','lua','github.com/nosyliam/revolution/lua/ast']
          for n in ast_names:
              short=n.split('.')[-1]; base_names={n,n[1:],short,'*'+short,'ast.'+short,'*ast.'+short,'github.com/nosyliam/revolution/lua/ast.'+short,'*github.com/nosyliam/revolution/lua/ast.'+short}
              vals=set(base_names)
              for b in list(base_names):
                  for s in salts:
                      vals.update([s+b,b+s,s+':'+b,b+':'+s,s+'/'+b,b+'/'+s])
              for v in vals:
                  d=hashlib.sha256(v.encode()).digest()
                  forms={d[:4].hex(),d[-4:].hex(),d[:4][::-1].hex(),d[-4:][::-1].hex(),d.hex()[:8],d.hex()[-8:]}
                  hit=forms&tags
                  if hit: brute.append({'type':n,'input':v,'tags':sorted(hit)})
          Path('codec-evidence/sha256-brute.json').write_text(json.dumps(brute,indent=2),encoding='utf-8')
          lines.append('\n===== sha256 candidate matches =====')
          for r in brute:lines.append(json.dumps(r,sort_keys=True))

          Path('codec-evidence/summary.txt').write_text('\n'.join(lines),encoding='utf-8')
          print('\n'.join(lines[:5000]))

      - name: Upload codec evidence
        uses: actions/upload-artifact@v4
        with:
          name: revolution-v09c-ast-codec
          path: codec-evidence/
          if-no-files-found: error
